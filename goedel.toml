# The whole of what this machine knows about the project it improves.
#
# Adopting the template into a repository is editing THIS FILE and writing one
# paragraph in `loop/goal.txt`. Nothing under `.github/` should ever need to
# learn what your project is written in; if something does, that is a gap in
# this schema and worth reporting rather than working around.
#
# What ships here describes the example project in `src/`, which exists so
# that `ci` is green the moment you clone this and so that the loop has
# something to practise on. Delete `src/`, `tests/` and `bench/`, point the
# masks at your own tree, and the machine is yours.

[project]
name = "goedelci-example"
goal = "loop/goal.txt"

# **What the machine may write to.** Everything else in the repository is
# invisible to it.
allow = ["src/**", "tests/**"]

# **What it may never write to, under any lane but `boundary`.** This is the
# evaluator: the machine itself, the config that tunes it, the record it
# reasons from, the runner that counts its tests, and the benchmark that
# measures it. A loop that can edit any of these has no gate at all.
#
# `tools/` and `bench/` are here rather than in `allow` for a specific reason:
# they decide what a passing test IS and what a rail READS. A machine judged
# by a count it can redefine is judged by nothing. `tests/` is writable --
# a repair has to be able to add the failing test that proves it -- but the
# thing that COUNTS the tests is not.
evaluator = [".github/**", "goedel.toml", "loop/**", "tools/**", "bench/**"]

# **What the judge IS, as opposed to what the machine may not write to.** Every
# certificate carries a digest of these files, and `ledger fsck` requires every
# entry in one epoch to carry the same one -- that is what makes "these two
# verdicts came from the same machine" checkable rather than assumed.
#
# It defaults to `evaluator` with the record removed, which is almost always
# what you want, so this line is here to be read rather than edited. The record
# has to be in `evaluator` (the machine must not rewrite its own history) and
# must NOT be in `criterion` (it changes every night, so a criterion covering
# it would make every entry in an epoch disagree about which judge decided it).
#
# criterion = [".github/**", "goedel.toml", "tools/**", "bench/**"]

[harness]
# What has to happen before anything else can run: installing dependencies,
# fetching a toolchain, generating code. Every job that builds or drafts runs
# these first. The example needs nothing, so it is empty.
setup = []

# The fast gate a draft is held to between attempts. Seconds, not minutes: it
# runs up to six times inside one draw, and its refusals are what the next
# attempt is shown. A typecheck, a lint, a `cargo check` -- whatever answers
# quickly and is usually right about whether code is broken.
check = "python3 -m compileall -q src tests"

# The build, if the project has one. Empty is fine; a language with no build
# step simply has nothing here, and `cost.warnings` is not measured.
build = ""

# **What to delete before measuring, so that nothing compiled from the other
# arm survives into this one.** The two arms are built in one workspace with a
# `git checkout` between them, and a cache keyed on modification time and file
# size cannot tell two same-length edits written in the same second apart -- so
# the candidate runs the baseline's bytecode and both arms report the same
# result. Observed here, on files differing by one character.
#
# The machine also runs everything with PYTHONDONTWRITEBYTECODE, which stops
# NEW caches; this removes whatever a checkout brought with it. Point it at
# your own language's equivalent: __pycache__, .tsbuildinfo, incremental
# compiler state, anything the build trusts without re-reading the source.
clean = "find . -name __pycache__ -prune -exec rm -rf {} + 2>/dev/null; true"

# **The only required line in this file.** Every kind's J2 is a count that may
# not fall, and nothing can count without this.
test = "python3 tools/testrun.py tests"

# Optional. Anything printing `name.rail value unit lower|higher` lines
# becomes a rail; everything else it prints is ignored, so a benchmark may log
# freely.
bench = "python3 bench/run.py"

# Optional: a built file whose size becomes `cost.artifact_bytes`.
artifact = ""

# How to read what the test command printed. These are the two lines most
# worth getting right when you adopt the template: if `claims_re` matches
# nothing, every kind is refused for a reason that has nothing to do with the
# code, and `ci` fails loudly rather than letting that go unnoticed.
suites_re = '(\d+) tests passed'
claims_re = '^\s*ok\b'
warnings_re = '^(?:warning|WARN)'
timeout = 900

[judge]
# How many entries an epoch holds. The evaluator may change only at a multiple
# of this, and `ledger fsck` refuses a record where it changed anywhere else.
epoch_len = 16

# The bootstrap interval's confidence, and the false-discovery rate the
# `better` claims are corrected at. Regressions are deliberately not
# corrected: a veto that weakens as you add rails is one an author can dilute.
confidence = 0.95
fdr = 0.10

# How many samples each arm takes of each rail. One is honest and gives no
# interval; three is the smallest number that gives one. A starved trial
# doubles this rather than giving up.
repeats = 3

# Counted trials below which the archive never backtracks. A clade comparison
# over four trials is a comparison of two priors.
min_evidence = 6

base_minutes = 30
max_level = 3

# Refusals plus balks after which a milestone is abandoned. Without this a
# milestone the drafter cannot write is offered again every night, forever.
balks = 3

# How fast an author's record stops counting. A trial from n epochs ago counts
# author_decay ** n. The epoch is the span within which `utility` holds still,
# so a trial judged in an earlier one was judged by a different standard --
# weaker evidence about tonight, not worthless.
#
# 1.0 counts every trial ever. 0.0 counts only the current epoch, which is
# truncation and leaves about sixteen entries split across the pool. 0.5 keeps
# roughly two epochs of memory and is the default for that reason.
#
# An author with nothing left in the window is UNCERTAIN, not excluded: it
# drops out of the tally and is then drawn from the uniform prior, so one quiet
# epoch cannot retire a model for good.
author_decay = 0.5

[author]
# **`local` runs the model ON THE RUNNER, and needs no credential at all.**
#
# That is the default and it is the point. A hosted endpoint is somebody
# else's product decision: the original of this machine was built against
# GitHub Models, which retired mid-loop -- `HTTP 410
# github_models_retirement_brownout` -- and took the loop with it. A pinned
# tarball and a pinned GGUF are two files with digests. Files do not get
# retired, do not rotate keys, and do not bill.
#
# `anthropic` and `openai` remain for anyone who wants to point this
# somewhere else; both want a credential and neither is the default.
provider = "local"

# Ignored when provider is `local` -- the server is told which weights to
# load, so the name in the request is a label. Used verbatim by the other two.
model = "claude-sonnet-5"

# Only the NAMES of the variables, never the values. `local` needs neither:
# the model action writes the URL into $GITHUB_ENV itself.
api_key_env = "GOEDEL_INFERENCE_KEY"
base_url_env = "GOEDEL_INFERENCE_URL"

# Attempts inside ONE draw. Each one is shown the previous attempt's refusal
# from `harness.check`, which is the only feedback loop inside a single draw
# and the reason this is six rather than one.
attempts = 6
temperature = 0.0
max_tokens = 8000

# How many independent draws a night fans out over. Shard 0 is greedy -- the
# night the loop would have had anyway -- and the rest draw at a raised
# temperature with their index as the declared seed. On a public repository
# these are free, and they buy wall clock inside a night.
shards = 4

# Files every card carries besides the target, for house style and idiom.
context = []

[author.local]
# Two files, two digests, re-checked on every restore. A cache hit is a
# transfer too, and this tree does not trust transfers.
runtime = "https://github.com/ggml-org/llama.cpp/releases/download/b11166/llama-b11166-bin-ubuntu-x64.tar.gz"
runtime_sha256 = "79dccaacf907665a278a9507f583027c294c97f0e93f372364086d9a246e38a5"
# Checked BEFORE the digest, because it is free and a short transfer is the
# likely failure. A truncated tarball is a `llama-server` that is not there;
# a truncated GGUF is a server that starts and answers nonsense.
runtime_bytes = 17013191
# The directory the tarball extracts to, which is not derivable from the URL.
runtime_dir = "llama-b11166"

# Q4_K_M rather than a smaller quantisation. Q2_0 has no x86 kernel and runs
# scalar -- 2.18 t/s prefill against 17.33 for a quantisation with one -- so
# the cheaper file is not the faster one. This costs 2.78 GB and roughly
# twice the bytes per token of a 2-bit file, and CPU decode is memory
# bandwidth bound. The fan-out pays for it: every shard gets its own runner,
# so the night's wall clock is one shard's however many there are.
weights = "https://huggingface.co/empero-ai/Qwen3.8-4B-Distill-GGUF/resolve/main/Qwen3.8-4B-Q4_K_M.gguf"
weights_sha256 = "dec96e8cf2e11b613bb46513dec485377f9ca5a351e71712ee0e244f287c6790"
weights_bytes = 2783446304

# The int8 rung, pinned without being fetched so the swap is one line rather
# than another trip to somebody's API. 4.6 GB against 2.8, and CPU decode is
# memory-bandwidth bound, so about 1.7x the time per token. Try it against
# the measured attempts-to-compile rather than on the grounds that more bits
# are better.
#   weights = ".../Qwen3.8-4B-Q8_0.gguf"
#   weights_sha256 = "770b780d6754a4954d1caf395c9239eaeb394f15c7a7ea34039883377c93c9c3"
#   weights_bytes = 4610579744

# 16384 because a retry card carries the compiler's last refusal on top of a
# full answer budget, and running out of context mid-file is a truncation
# nothing downstream can see. `slots = 1` because nothing here asks twice at
# once, and one slot is the whole context rather than a share of it.
context = 16384
slots = 1
threads = 4
port = 8080
# How long to wait for the weights to load. The server is NOT started with
# --no-warmup: that defers the load to the first request, so /health answers
# in four seconds and the completion then times out -- a server that is up by
# every check available and cannot answer anything yet.
warmup_seconds = 300

# **More than one author, one per shard.** Each shard is already its own
# runner with its own four vCPU, so nothing says they must all run the same
# weights. Uncomment a second entry and shard 1 draws with a different model
# than shard 0 -- a genuinely different prior, which is not the same thing as
# a second temperature sample from one.
#
# Shard N draws with pool[N % len(pool)], so four shards over two authors ask
# each of them twice. Every certificate records which one drew it, because a
# portfolio you cannot attribute is a portfolio you cannot learn from.
#
# The RUNTIME is shared: one llama.cpp build serves any GGUF, so only the
# weights differ and the pool costs bytes rather than complexity.
#
# **The cache is the ceiling.** GitHub gives a repository 10 GB of Actions
# cache, evicted least-recently-used, so three 2.78 GB authors fit and four
# do not. Over the limit nothing breaks -- a miss is a 55-second download on
# a runner that was going to spend thirty minutes anyway -- but a pool that
# thrashes pays that on every shard of every night. Mixing sizes is the way
# to spend it: a 4B and a 1.7B cost less together than two 4Bs and disagree
# more.
#
# With no pool at all, the weights above are the only author and everything
# behaves as it did.
#
[[author.local.pool]]
name = "qwen38-4b-q4"
weights = "https://huggingface.co/empero-ai/Qwen3.8-4B-Distill-GGUF/resolve/main/Qwen3.8-4B-Q4_K_M.gguf"
weights_sha256 = "dec96e8cf2e11b613bb46513dec485377f9ca5a351e71712ee0e244f287c6790"
weights_bytes = 2783446304

[[author.local.pool]]
name = "qwen38-4b-q8"
weights = "https://huggingface.co/empero-ai/Qwen3.8-4B-Distill-GGUF/resolve/main/Qwen3.8-4B-Q8_0.gguf"
weights_sha256 = "770b780d6754a4954d1caf395c9239eaeb394f15c7a7ea34039883377c93c9c3"
weights_bytes = 4610579744


[floors]
# A movement inside its floor is not a movement. Prefixes, longest match wins.
# Measure them with the `floors` workflow; change them with a `boundary`
# proposal that cites the measurement.
#
# Cost rails are exact by construction -- one tree, one toolchain -- so their
# floor is zero and one byte larger really is larger.
"cost." = 0.0

# **0.05, and it holds because the measurement is interleaved.** This was 0.25
# for a while, to absorb a 12% swing between two arms differing by one added
# module -- which was not the module. Measured directly, on two trees whose
# behaviour is byte-for-byte identical: block measurement (all of one arm, then
# all of the other) reported -0.03%, -8.84% and -28.27% on three consecutive
# runs, while alternating between the trees reported +0.15%, +0.44% and -1.12%.
#
# The 28% was the runner, and a floor raised to hide it would also have hidden
# every real improvement smaller than a quarter. `bench-pair` alternates, so
# the floor can be what a floor should be: a little above the noise that
# remains.
"bench." = 0.05

# --- the drill's probe ------------------------------------------------------
#
# `proof` runs a whole night against a candidate written by hand -- no model,
# no pushes -- and it is the only test that exercises the SEAMS between the
# actions rather than each action on its own. Every bug that has actually
# shipped here lived in a seam, so keeping this working after you adopt the
# template is worth the twenty lines it costs.
#
# Two variants, identical in shape and different in what the code DOES. The
# `pass` one must make your test suite gain a claim; the `fail` one must make
# it lose one or fail outright. The refused drill is the one that matters: it
# is what checks that a refusal builds on the live tree rather than filing the
# code it just refused.
#
# Delete this section and `proof` skips with a notice rather than failing.

[proof]
kind = "feature"
target = "src/_goedel_probe.py"

[proof.pass]
"src/_goedel_probe.py" = """
def spread(values):
    if not values:
        raise ValueError("an empty sequence has no spread")
    return max(values) - min(values)
"""
"tests/test_goedel_probe.py" = """
from src._goedel_probe import spread


def test_the_spread_is_the_distance_between_the_extremes():
    assert spread([3, 9, 5]) == 6, spread([3, 9, 5])


def test_an_empty_sequence_has_no_spread():
    try:
        spread([])
    except ValueError:
        return
    raise AssertionError("it answered for an empty sequence")
"""

[proof.fail]
# Syntactically fine, so the fast check passes and a real draft would have been
# let through. Wrong, so the tests refuse it. A probe that fails to PARSE would
# only prove that `harness.check` works, which is a different claim.
"src/_goedel_probe.py" = """
def spread(values):
    if not values:
        raise ValueError("an empty sequence has no spread")
    return max(values) + min(values)
"""
"tests/test_goedel_probe.py" = """
from src._goedel_probe import spread


def test_the_spread_is_the_distance_between_the_extremes():
    assert spread([3, 9, 5]) == 6, spread([3, 9, 5])


def test_an_empty_sequence_has_no_spread():
    try:
        spread([])
    except ValueError:
        return
    raise AssertionError("it answered for an empty sequence")
"""

# --- the kinds ------------------------------------------------------------
#
# A kind is a shape of change and the primary criterion (J1) that decides it.
# Every kind also carries the same J2: nothing it did not ask to pay for may
# read worse, and the test counts may not fall.
#
# `targets` narrows where a MILESTONE may be aimed. It does not narrow what a
# patch may touch -- a repair has to write a test -- and it cannot widen
# `allow`.

[kinds.feature]
verb = "create"
j1 = "claims"
targets = ["src/**"]
# A new module pays for its own bytes; that is what it is for. `cost.warnings`
# is deliberately not allowed: a feature that adds warnings has added code
# nothing exercises, which is what J1 already refuses.
allow_rails = ["cost.artifact_bytes"]

diff_lines = 400
diff_files = 6
prompt = """
Create the module the milestone names, and a test that exercises it. The test
is what makes this judgeable: a feature that adds no passing claim is code
nothing runs, and it is refused before anything else is looked at.
"""

[kinds.repair]
verb = "edit"
j1 = "witness"
targets = ["src/**"]
diff_lines = 200
diff_files = 4
prompt = """
Write the failing test FIRST, as its own file, and then the smallest change to
the source that makes it pass. The test is run against the tree as it stands
before your fix: if it passes there, there was nothing to repair and this is
refused.
"""

[kinds.perf]
verb = "edit"
j1 = "rail"
rail = "bench.total_ms"
targets = ["src/**"]
diff_lines = 200
diff_files = 4
# Off until the project has a benchmark worth believing and floors measured on
# the runner class that will judge it. A perf kind against an unmeasured floor
# adopts the weather.
enabled = false
prompt = """
Make `bench.total_ms` smaller without changing what anything returns. Every
other rail is a veto: if the artifact grows or another measurement regresses,
this is refused whatever the target rail did.
"""
