name: goedel-config
description: >-
  Read and validate `goedel.toml` -- the whole of what this machine knows about
  the project it improves -- and compute the digest of the evaluator judging it.

# Every other action is written against this file rather than against a
# language, a build system or a test runner. Adopting the template into a
# repository is editing this one file; if something has to be special-cased in
# a workflow, that is a gap in this schema and not a licence to hard-code a
# path.
#
# Three rules this enforces rather than documents:
#
# * **The evaluator masks and the allow masks may not overlap.** A machine that
#   may edit the thing that judges it has no gate at all, and the overlap is
#   the shape that mistake takes -- `src/**` allowed and `src/judge/**`
#   forbidden reads as safe and is not, because the first glob admits the
#   second's files. Checked against the MASKS, not against the tree, so a file
#   that does not exist yet cannot slip through by not existing yet.
#
# * **A kind must have a J1.** A kind with no primary criterion can only be
#   adopted on "nothing broke", which is adoption on the absence of evidence.
#   Rows naming no witness, no rail and no rising count are refused at load,
#   not at judgement time.
#
# * **The utility has a digest, and it covers the JUDGE and not the RECORD.**
#   `utility` is sha256 over every file the CRITERION masks cover, and it goes
#   into every certificate. It is what makes "these two verdicts came from the
#   same machine" a checkable claim rather than an assumption -- the Red Queen
#   property the ledger's epoch rules rest on (arXiv:2606.26294).
#
#   It was sha256 over the EVALUATOR masks, which is the right set for "what
#   may the machine not write to" and the wrong set for "what is the judge".
#   The evaluator masks cover `loop/**`, because the record must be protected
#   from the thing it is a record of -- so every night's certificate changed
#   the digest, every entry in an epoch carried a different utility, and
#   `ledger fsck` would have refused the second night the loop ever had. The
#   whole epoch mechanism was inert and would have failed loudly on first use.
#
#   `criterion` defaults to the evaluator masks with the record removed, and
#   must be a subset of them: a judge you are not forbidden to edit is not one.

inputs:
  root:
    description: "the tree holding goedel.toml"
    required: false
    default: "."
  command:
    description: "load | show | assemble | selftest"
    required: false
    default: load
  name:
    description: "for assemble: what the project is called"
    required: false
    default: ""
  harness-json:
    description: "for assemble: the commands `scaffold admit` collected"
    required: false
    default: scaffold-harness.json
  autonomous:
    description: "for assemble: whether the loop promotes its own work"
    required: false
    default: "true"
  export:
    description: "write GOEDEL_* into $GITHUB_ENV for the rest of the job"
    required: false
    default: "true"

outputs:
  name:
    description: "the project's name"
    value: ${{ steps.run.outputs.name }}
  utility:
    description: "sha256 over every evaluator file: which judge this is"
    value: ${{ steps.run.outputs.utility }}
  epoch-len:
    description: "how many entries an epoch holds"
    value: ${{ steps.run.outputs.epoch_len }}
  kinds:
    description: "the enabled kinds, space separated"
    value: ${{ steps.run.outputs.kinds }}
  shards:
    description: "how many author shards a night fans out over"
    value: ${{ steps.run.outputs.shards }}
  shard-matrix:
    description: "the same, as a JSON array for `strategy.matrix`"
    value: ${{ steps.run.outputs.shard_matrix }}
  json:
    description: "the path the whole validated config was written to"
    value: ${{ steps.run.outputs.json }}
  proof:
    description: "yes when [proof] declares a probe the drills can rehearse"
    value: ${{ steps.run.outputs.proof }}
  autonomous:
    description: "yes when the night promotes its own work without a human"
    value: ${{ steps.run.outputs.autonomous }}
  blueprint:
    description: "where the plan lives"
    value: ${{ steps.run.outputs.blueprint }}

runs:
  using: composite
  steps:
    - id: run
      shell: bash
      env:
        ROOT: ${{ inputs.root }}
        COMMAND: ${{ inputs.command }}
        EXPORT: ${{ inputs.export }}
        NAME: ${{ inputs.name }}
        HARNESS_JSON: ${{ inputs.harness-json }}
        AUTONOMOUS: ${{ inputs.autonomous }}
      run: |
        set -euo pipefail
        python3 - <<'PYEOF'
        import fnmatch, hashlib, json, os, sys
        from pathlib import Path

        try:
            import tomllib
        except ModuleNotFoundError:          # pragma: no cover -- 3.10 and below
            print("::error::this runner's python3 has no tomllib; goedel.toml needs 3.11+")
            sys.exit(1)

        J1 = ("witness", "claims", "rail", "cost")

        class ConfigError(Exception): pass

        def out(k, v):
            """A step output, and never more than one.

            `$GITHUB_OUTPUT` is line-oriented, so a value carrying a newline
            writes a SECOND assignment that the runner obeys. Several of these
            values are model-derived -- a refusal reason, a milestone title --
            so a reply containing "\\nverdict=adopt" would set an output no step
            wrote. Every output here is a scalar by design, so collapsing is
            both safe and the meaning.
            """
            v = str(v).replace("\r", " ").replace("\n", " ")
            with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
                fh.write("%s=%s\n" % (k, v))

        def export(k, v):
            path = os.environ.get("GITHUB_ENV")
            if not path or os.environ.get("EXPORT", "true") != "true":
                return
            with open(path, "a", encoding="utf-8") as fh:
                fh.write("%s=%s\n" % (k, v))

        # -- the masks --------------------------------------------------

        def matches(path, masks):
            # `lstrip("./")` was here and it strips CHARACTERS, not a prefix:
            # `.github/x` came back as `github/x`, so every evaluator mask
            # beginning with a dot matched nothing and the machine's own
            # workflows read as proposable. A dotfile is exactly what the
            # evaluator masks are made of.
            if path.startswith("./"):
                path = path[2:]
            for m in masks:
                if fnmatch.fnmatch(path, m):
                    return True
                # `src/**` covers `src/a/b` under fnmatch, which lets `*` cross
                # separators -- but it should also cover `src` itself, which it
                # does not.
                if m.endswith("/**") and (path == m[:-3] or path.startswith(m[:-2])):
                    return True
            return False

        def overlap(allow, evaluator):
            bad = []
            for a in allow:
                probe = a.replace("**", "x").replace("*", "x")
                if matches(probe, evaluator):
                    bad.append(a); continue
                for e in evaluator:
                    if matches(e.replace("**", "x").replace("*", "x"), (a,)):
                        bad.append(a); break
            return bad

        # -- the schema -------------------------------------------------

        def kind_from(name, row):
            verb = str(row.get("verb", "edit"))
            if verb not in ("create", "edit"):
                raise ConfigError("kind %s: verb is create or edit, not %r" % (name, verb))
            j1 = str(row.get("j1", ""))
            if j1 not in J1:
                raise ConfigError(
                    "kind %s: j1 must be one of %s, not %r -- a kind with no primary "
                    "criterion can only be adopted on the absence of evidence"
                    % (name, "/".join(J1), j1))
            rail = str(row.get("rail", ""))
            if j1 == "rail" and not rail:
                raise ConfigError("kind %s: j1 = rail names no rail to move" % name)
            if j1 == "witness" and verb == "create":
                raise ConfigError(
                    "kind %s: a witness must build against the PARENT tree, and a file "
                    "being created is by construction absent from it -- so a create kind "
                    "cannot be judged by fail-then-pass" % name)
            targets = list(row.get("targets", []))
            for mask in targets:
                if not mask:
                    raise ConfigError("kind %s: an empty target mask matches nothing" % name)
            return {
                "name": name, "verb": verb, "j1": j1, "rail": rail,
                "targets": targets,
                "allow_rails": list(row.get("allow_rails", [])),
                "adrift_rails": list(row.get("adrift_rails", [])),
                "diff_lines": int(row.get("diff_lines", 400)),
                "diff_files": int(row.get("diff_files", 10)),
                "enabled": bool(row.get("enabled", True)),
                "prompt": str(row.get("prompt", "")),
            }

        def load(raw, root):
            project = raw.get("project", {})
            allow = tuple(project.get("allow", ()))
            evaluator = tuple(project.get("evaluator", ()))
            if not allow:
                raise ConfigError("[project] allow is empty: nothing could ever be proposed")
            if not evaluator:
                raise ConfigError(
                    "[project] evaluator is empty: the machine could propose a change to "
                    "its own judge, which is a gate that is not one")
            bad = overlap(allow, evaluator)
            if bad:
                raise ConfigError(
                    "these allow masks also admit evaluator paths, so the machine could "
                    "edit its own judge: " + ", ".join(bad))

            # **The criterion: what the judge IS, as opposed to what the
            # machine may not write to.** They differ by exactly the record.
            RECORD = "loop/"
            criterion = tuple(project.get("criterion", ()))
            if not criterion:
                criterion = tuple(m for m in evaluator
                                  if not (m == RECORD.rstrip("/") or m.startswith(RECORD)))
            if not criterion:
                raise ConfigError(
                    "[project] criterion is empty, so nothing identifies the judge and "
                    "every epoch would look like a different machine")
            for m in criterion:
                probe = m.replace("**", "x").replace("*", "x")
                if not matches(probe, evaluator):
                    raise ConfigError(
                        "[project] criterion names %s, which the evaluator masks do not "
                        "cover. A judge the machine is not forbidden to edit is not one." % m)
                if m == RECORD.rstrip("/") or m.startswith(RECORD):
                    raise ConfigError(
                        "[project] criterion names %s, which is the record. The record "
                        "changes every night, so a criterion covering it makes every "
                        "certificate in an epoch disagree about which judge decided it." % m)

            h = raw.get("harness", {})
            harness = {
                "setup": list(h.get("setup", [])),
                "build": str(h.get("build", "")),
                "clean": str(h.get("clean", "")),
                # **What the PRODUCT does, as opposed to what the code does.**
                # `test` says the units behave; `verify` says the thing you are
                # building still is the thing. It runs the built artefact --
                # serves the site and fetches a page, starts the agent and puts
                # its evals to it, calls the API and reads the answer -- and a
                # candidate that fails it is refused whatever its unit tests
                # said.
                #
                # It matters most when nobody is merging. Promotion with no
                # human in it is gated on the judge alone, and a judge that
                # only knows unit tests will happily promote a site that
                # returns 500 on every route because each function is fine.
                "verify": str(h.get("verify", "")),
                "check": str(h.get("check", "")),
                "test": str(h.get("test", "")),
                "bench": str(h.get("bench", "")),
                "artifact": str(h.get("artifact", "")),
                "suites_re": str(h.get("suites_re", r"(\d+) (?:tests?|suites?|examples?) (?:passed|ok)")),
                "claims_re": str(h.get("claims_re", r"^\s*(?:ok|PASS|PASSED)\b")),
                "warnings_re": str(h.get("warnings_re", r"^(?:warning|WARN)")),
                "timeout": int(h.get("timeout", 1800)),
            }
            if not harness["test"]:
                raise ConfigError(
                    "[harness] test is empty: with no test command nothing can count claims, "
                    "and every kind's J2 is a count that may not fall")

            a = raw.get("author", {})
            author = {
                "base_url_env": str(a.get("base_url_env", "GOEDEL_INFERENCE_URL")),
                "api_key_env": str(a.get("api_key_env", "GOEDEL_INFERENCE_KEY")),
                "model": str(a.get("model", "")),
                "attempts": int(a.get("attempts", 6)),
                "temperature": float(a.get("temperature", 0.0)),
                "max_tokens": int(a.get("max_tokens", 2600)),
                "shards": int(a.get("shards", 6)),
                "context": list(a.get("context", [])),
            }
            if author["shards"] < 1:
                raise ConfigError("[author] shards must be at least 1")

            j = raw.get("judge", {})
            judge = {
                "epoch_len": int(j.get("epoch_len", 16)),
                "confidence": float(j.get("confidence", 0.95)),
                "fdr": float(j.get("fdr", 0.10)),
                "repeats": int(j.get("repeats", 3)),
                "min_evidence": int(j.get("min_evidence", 6)),
                "base_minutes": int(j.get("base_minutes", 45)),
                "max_level": int(j.get("max_level", 3)),
                "balks": int(j.get("balks", 3)),
            }
            if judge["epoch_len"] < 1:
                raise ConfigError("[judge] epoch_len must be at least 1")
            if not 0.0 < judge["confidence"] < 1.0:
                raise ConfigError("[judge] confidence must lie strictly between 0 and 1")
            if not 0.0 < judge["fdr"] < 1.0:
                raise ConfigError("[judge] fdr must lie strictly between 0 and 1")
            if judge["repeats"] < 1:
                raise ConfigError("[judge] repeats must be at least 1")

            kinds_raw = raw.get("kinds", {})
            if not kinds_raw:
                raise ConfigError("[kinds] is empty: the machine has no move it may make")
            kinds = {k: kind_from(k, v) for k, v in kinds_raw.items()}
            for k, v in kinds.items():
                # **A kind's targets narrow `allow`; they may not widen it.**
                # `allow` is the machine's whole boundary, and a kind that
                # could aim outside it would be a second, quieter boundary
                # that nothing else in this file checks.
                bad = [m for m in v["targets"]
                       if matches(m.replace("**", "x").replace("*", "x"), evaluator)
                       or not matches(m.replace("**", "x").replace("*", "x"), allow)]
                if bad:
                    raise ConfigError(
                        "kind %s aims at %s, which is not inside [project] allow. A kind's "
                        "targets narrow the boundary; they cannot widen it."
                        % (k, ", ".join(bad)))
            if not any(k["enabled"] for k in kinds.values()):
                raise ConfigError("[kinds] has no enabled row")

            # **[proof]: the end-to-end drill's probe.** Optional, and a project
            # without one loses the only test that exercises the seams between
            # the actions rather than each action on its own. Every bug that
            # has actually shipped here lived in a seam, so this is worth the
            # fifteen lines it costs.
            proof = {}
            praw = raw.get("proof", {})
            if praw:
                kind = str(praw.get("kind", ""))
                target = str(praw.get("target", ""))
                if kind not in kinds:
                    raise ConfigError("[proof] kind %r is not a kind this project has" % kind)
                if not kinds[kind]["enabled"]:
                    raise ConfigError("[proof] kind %r is disabled" % kind)
                if not target:
                    raise ConfigError("[proof] names no target")
                if matches(target, evaluator) or not matches(target, allow):
                    raise ConfigError(
                        "[proof] target %s is not somewhere the machine may write, so the "
                        "drill would be rehearsing a path no night can take" % target)
                good = dict(praw.get("pass", {}))
                bad = dict(praw.get("fail", {}))
                if not good or not bad:
                    raise ConfigError(
                        "[proof] needs both a `pass` and a `fail` variant: the drill that "
                        "matters is the refused one, and a refusal with nothing to compare "
                        "it against proves only that the machine can say yes")
                if set(good) != set(bad):
                    raise ConfigError(
                        "[proof] the two variants write different files (%s); they must "
                        "differ only in what the code DOES, or the drill is comparing two "
                        "shapes of change rather than two outcomes"
                        % ", ".join(sorted(set(good) ^ set(bad))))
                if target not in good:
                    raise ConfigError("[proof] target %s is not one of the files it writes"
                                      % target)
                for path in good:
                    if matches(path, evaluator) or not matches(path, allow):
                        raise ConfigError("[proof] writes %s, which is not writable" % path)
                if good == bad:
                    raise ConfigError(
                        "[proof] the two variants are identical, so one of the two drills "
                        "is asserting the opposite of what it will observe")
                proof = {"kind": kind, "target": target,
                         "pass": {k: str(v) for k, v in good.items()},
                         "fail": {k: str(v) for k, v in bad.items()}}

            # --- [loop]: how much of this runs without anybody ------------
            l = raw.get("loop", {})
            loop = {
                # When true the night pushes its own adoptions to the default
                # branch instead of waiting on a pull request. The audit PR is
                # still written; it stops being a gate and becomes a record.
                "autonomous": bool(l.get("autonomous", False)),
                # How many consecutive refused nights before it stops promoting
                # and starts asking. A loop that cannot get anything past its
                # own judge is not one to leave running.
                "give_up_after": int(l.get("give_up_after", 0)),
            }
            if loop["autonomous"] and not harness["verify"]:
                raise ConfigError(
                    "[loop] autonomous is on and [harness] verify is empty. With nobody "
                    "merging, the judge is the only thing between a candidate and your "
                    "default branch -- and a judge that knows only unit tests will promote "
                    "a product that no longer runs, because every function in it still "
                    "passes. Name a command that exercises the built thing.")

            floors = {str(k): float(v) for k, v in raw.get("floors", {}).items()}
            for rail, f in floors.items():
                if f < 0:
                    raise ConfigError("[floors] %s is negative; a floor is a magnitude" % rail)

            return {
                "name": str(project.get("name", Path(root).name)),
                "goal": str(project.get("goal", "loop/goal.txt")),
                "allow": list(allow), "evaluator": list(evaluator),
                "criterion": list(criterion),
                "harness": harness, "author": author, "judge": judge,
                "kinds": kinds, "floors": floors, "proof": proof, "loop": loop,
                "blueprint": str(project.get("blueprint", "loop/blueprint.txt")),
            }

        def utility_digest(root, criterion):
            """sha256 over every file the criterion covers, by path then content.

            The path is hashed too. Renaming a judge without changing a byte of
            it is still a different judge: the workflow that called the old
            name now calls nothing.
            """
            h = hashlib.sha256()
            root = Path(root)
            files = []
            for p in sorted(root.rglob("*")):
                if not p.is_file() or p.is_symlink():
                    continue
                rel = p.relative_to(root).as_posix()
                if rel.startswith(".git/"):
                    continue
                if matches(rel, criterion):
                    files.append((rel, p))
            for rel, p in files:
                h.update(rel.encode("utf-8")); h.update(b"\0")
                h.update(hashlib.sha256(p.read_bytes()).digest())
            return h.hexdigest(), len(files)

        # ------------------------------------------------------------------

        def selftest():
            ok = fail = 0
            def claim(s, held, detail=""):
                nonlocal ok, fail
                if held: ok += 1; print("  ok   " + s)
                else:
                    fail += 1; print("  FAIL " + s)
                    if detail: print("         " + str(detail))
            def raises(s, fn):
                try: fn()
                except ConfigError: return claim(s, True)
                except Exception as exc: return claim(s, False, "wrong error: %r" % exc)
                return claim(s, False, "it returned instead of refusing")

            base = {"project": {"allow": ["src/**"], "evaluator": [".github/**", "goedel.toml"]},
                    "harness": {"test": "t"}, "kinds": {"feature": {"verb": "create", "j1": "claims"}}}
            cfg = load(base, ".")
            claim("a src path is proposable", matches("src/a/b.py", cfg["allow"])
                  and not matches("src/a/b.py", cfg["evaluator"]))
            claim("the machine itself is not", matches(".github/actions/rails/action.yml", cfg["evaluator"]))
            claim("the config naming the masks is not", matches("goedel.toml", cfg["evaluator"]))
            claim("a path outside every allow mask is not", not matches("README.md", cfg["allow"]))

            def bad(over):
                d = json.loads(json.dumps(base));
                for k, v in over.items(): d[k] = v
                return lambda: load(d, ".")
            raises("an allow mask that admits an evaluator path is refused at load",
                   bad({"project": {"allow": [".github/**"], "evaluator": [".github/**"]}}))
            raises("an allow mask whose parent is the evaluator is refused too",
                   bad({"project": {"allow": [".github/actions/rails/action.yml"],
                                    "evaluator": [".github/**"]}}))
            raises("an empty evaluator mask is refused: a judge nothing protects is not one",
                   bad({"project": {"allow": ["src/**"], "evaluator": []}}))
            raises("an empty allow mask is refused: nothing could be proposed",
                   bad({"project": {"allow": [], "evaluator": [".github/**"]}}))
            raises("a kind with no J1 is refused, not judged on the absence of evidence",
                   bad({"kinds": {"x": {"j1": "vibes"}}}))
            raises("a rail kind that names no rail is refused",
                   bad({"kinds": {"x": {"j1": "rail"}}}))
            raises("a create kind judged by a witness is refused: the witness cannot build",
                   bad({"kinds": {"x": {"verb": "create", "j1": "witness"}}}))
            raises("a kind aiming outside the project's allow masks is refused",
                   bad({"kinds": {"x": {"j1": "claims", "targets": ["docs/**"]}}}))
            raises("a kind aiming at the evaluator is refused",
                   bad({"kinds": {"x": {"j1": "claims", "targets": [".github/**"]}}}))
            claim("and a kind narrowing allow is admitted",
                  load({"project": {"allow": ["src/**", "tests/**"],
                                    "evaluator": [".github/**"]},
                        "harness": {"test": "t"},
                        "kinds": {"x": {"j1": "claims", "targets": ["src/**"]}}},
                       ".")["kinds"]["x"]["targets"] == ["src/**"])
            raises("a project with no test command is refused: nothing could count a claim",
                   bad({"harness": {}}))
            raises("a config with no kinds is refused", bad({"kinds": {}}))
            raises("a config whose every kind is disabled is refused",
                   bad({"kinds": {"x": {"j1": "claims", "enabled": False}}}))
            raises("an epoch shorter than one entry is refused",
                   bad({"judge": {"epoch_len": 0}}))
            raises("a confidence of one is refused: an interval that excludes nothing",
                   bad({"judge": {"confidence": 1.0}}))
            raises("a negative floor is refused: a floor is a magnitude",
                   bad({"floors": {"host.": -0.1}}))

            H = {"check": "true", "test": "t", "claims_re": "^ok", "verify": "v"}
            asm = assemble("a paste bin", H, True)
            claim("an assembled config loads through the same validation",
                  load(tomllib.loads(asm), ".")["name"] == "a paste bin")
            claim("and it is autonomous", load(tomllib.loads(asm), ".")["loop"]["autonomous"])
            claim("and its masks are the machine's, not the project's",
                  load(tomllib.loads(asm), ".")["allow"] == ["src/**", "tests/**", "scripts/**"])
            claim("and the project cannot write its own config",
                  "goedel.toml" in load(tomllib.loads(asm), ".")["evaluator"])
            claim("an assembled config carries the commands it was given",
                  load(tomllib.loads(asm), ".")["harness"]["verify"] == "v")
            claim("a name with a quote in it does not break the file",
                  load(tomllib.loads(assemble('a "quoted" name', H, True)), ".")["name"]
                  == 'a "quoted" name')
            claim("a command with a backslash survives, which every claims_re has",
                  load(tomllib.loads(assemble("x", dict(H, claims_re=r"^\\s*ok"), True)),
                       ".")["harness"]["claims_re"] == r"^\\s*ok",
                  "repr emits a PYTHON literal and TOML reads single quotes as a "
                  "LITERAL string, so the backslash came back doubled")
            claim("and so does one with an apostrophe in it",
                  load(tomllib.loads(assemble("x", dict(H, test="echo it's fine"), True)),
                       ".")["harness"]["test"] == "echo it's fine")
            raises("assembling with no verify and autonomy on is refused",
                   lambda: load(tomllib.loads(
                       assemble("x", {"check": "c", "test": "t", "claims_re": "o"}, True)), "."))
            claim("and with autonomy off it is allowed",
                  load(tomllib.loads(
                      assemble("x", {"check": "c", "test": "t", "claims_re": "o"}, False)),
                      ".")["loop"]["autonomous"] is False)
            raises("assembling a nameless project is refused",
                   lambda: assemble("  ", H, True))

            claim("a project is not autonomous unless it says so",
                  load(base, ".")["loop"]["autonomous"] is False)
            raises("autonomy without a way to check the product is refused",
                   bad({"loop": {"autonomous": True}}))
            claim("and with one it is allowed",
                  load(dict(base, loop={"autonomous": True},
                            harness={"test": "t", "verify": "v"}), ".")["loop"]["autonomous"])

            P = {"kind": "feature", "target": "src/p.py",
                 "pass": {"src/p.py": "a", "tests/t.py": "x"},
                 "fail": {"src/p.py": "b", "tests/t.py": "x"}}
            ALLOW2 = {"allow": ["src/**", "tests/**"], "evaluator": [".github/**"]}
            def pf(over):
                d = json.loads(json.dumps(base)); d["project"] = ALLOW2
                d["proof"] = dict(P); d["proof"].update(over)
                return lambda: load(d, ".")
            claim("a well-formed proof probe is admitted", bool(pf({})()["proof"]))
            claim("and a config without one simply has none", load(base, ".")["proof"] == {})
            raises("a proof aimed at a kind this project lacks is refused",
                   pf({"kind": "mystery"}))
            raises("a proof aimed outside the writable paths is refused",
                   pf({"target": "README.md"}))
            raises("a proof with only one variant is refused",
                   pf({"fail": {}}))
            raises("a proof whose variants write different files is refused",
                   pf({"fail": {"src/p.py": "b"}}))
            raises("a proof whose two variants are identical is refused",
                   pf({"fail": {"src/p.py": "a", "tests/t.py": "x"}}))
            raises("a proof whose target is not among its own files is refused",
                   pf({"target": "src/other.py"}))

            claim("the criterion defaults to the evaluator without the record",
                  load({"project": {"allow": ["src/**"],
                                    "evaluator": [".github/**", "loop/**", "goedel.toml"]},
                        "harness": {"test": "t"}, "kinds": {"x": {"j1": "claims"}}},
                       ".")["criterion"] == [".github/**", "goedel.toml"])
            raises("a criterion covering the record is refused: the record moves nightly",
                   bad({"project": {"allow": ["src/**"], "evaluator": [".github/**", "loop/**"],
                                    "criterion": ["loop/**"]}}))
            raises("a criterion the evaluator does not cover is refused",
                   bad({"project": {"allow": ["src/**"], "evaluator": [".github/**"],
                                    "criterion": ["scripts/**"]}}))
            raises("an evaluator that is nothing but the record leaves no criterion",
                   bad({"project": {"allow": ["src/**"], "evaluator": ["loop/**"]}}))

            import tempfile
            with tempfile.TemporaryDirectory() as td:
                r = Path(td); (r / ".github").mkdir()
                (r / ".github/a.yml").write_text("one")
                d1, n1 = utility_digest(r, [".github/**"])
                claim("the utility digest covers the criterion files", n1 == 1)
                (r / ".github/a.yml").write_text("two")
                d2, _ = utility_digest(r, [".github/**"])
                claim("editing the judge changes the digest", d1 != d2)
                (r / ".github/a.yml").rename(r / ".github/b.yml")
                d3, _ = utility_digest(r, [".github/**"])
                claim("and so does renaming it without editing it", d2 != d3)
                (r / "src").mkdir(); (r / "src/x.py").write_text("anything")
                d4, _ = utility_digest(r, [".github/**"])
                claim("a change outside the masks does not", d3 == d4)

                # The claim the whole separation exists for.
                (r / "loop/ledger/entries").mkdir(parents=True)
                (r / "loop/ledger/entries/0000000000000000.cert").write_text("a night")
                d5, _ = utility_digest(r, [".github/**"])
                claim("and filing a certificate does not change which judge decided it",
                      d4 == d5,
                      "a criterion covering the record makes every entry in an epoch "
                      "disagree, and fsck refuses the second night the loop ever has")
            print("\n%d/%d claims held" % (ok, ok + fail))
            return 1 if fail else 0

        # -- assembling one ----------------------------------------------

        # `textwrap.dedent` over an indented literal, not a flush-left one: YAML
        # ends a block scalar at the first line indented less than its first
        # line, so a template written flush-left inside `run: |` truncates the
        # program GitHub loads at exactly that point.
        TEMPLATE = __import__("textwrap").dedent("""\
            # Written by `genesis`. Everything above [harness] is fixed by the machine
            # and not by the thing it is building: a loop that picks its own boundary
            # at birth has no boundary.
            #
            # The commands below came from whatever wrote the first version of this
            # project, and were accepted only after the tree they describe actually
            # built, tested and answered. Edit them by hand if you like; `ci` will tell
            # you immediately if they stop being true.

            [project]
            name = {name}
            goal = "loop/goal.txt"
            blueprint = "loop/blueprint.txt"

            # What the machine may write to.
            allow = ["src/**", "tests/**", "scripts/**"]

            # What it may never write to outside the `boundary` lane: itself, its
            # config, its record, and anything that decides whether its work was good.
            evaluator = [".github/**", "goedel.toml", "loop/**"]

            [harness]
            setup = {setup}
            check = {check}
            build = {build}
            clean = {clean}
            test = {test}
            verify = {verify}
            bench = ""
            artifact = ""
            suites_re = {suites_re}
            claims_re = {claims_re}
            warnings_re = '^(?:warning|WARN)'
            timeout = 900

            [judge]
            epoch_len = 16
            confidence = 0.95
            fdr = 0.10
            repeats = 3
            min_evidence = 6
            base_minutes = 30
            max_level = 3
            balks = 3

            [loop]
            # With this on, a night that gets past the judge pushes to the default
            # branch itself. The audit pull request is still written; it stops being a
            # gate and becomes a record. `verify` above is then the only thing between
            # a broken build and everybody who uses this, which is why config refuses
            # to switch this on without one.
            autonomous = {autonomous}

            [author]
            provider = "anthropic"
            model = "claude-sonnet-5"
            api_key_env = "GOEDEL_INFERENCE_KEY"
            base_url_env = "GOEDEL_INFERENCE_URL"
            attempts = 6
            temperature = 0.0
            max_tokens = 8000
            shards = 4
            context = []

            [floors]
            "cost." = 0.0

            [kinds.feature]
            verb = "create"
            j1 = "claims"
            targets = ["src/**", "scripts/**"]
            allow_rails = ["cost.artifact_bytes"]
            diff_lines = 400
            diff_files = 6
            prompt = "Create what the milestone names, and a test that exercises it. A feature that adds no passing claim is code nothing runs, and it is refused before anything else is looked at."

            [kinds.repair]
            verb = "edit"
            j1 = "witness"
            targets = ["src/**", "scripts/**"]
            diff_lines = 200
            diff_files = 4
            prompt = "Write the failing test FIRST, as its own file, then the smallest change to the source that makes it pass. The test is run against the tree as it stands before your fix: if it passes there, there was nothing to repair."
            """)

        def toml_str(v):
            """A TOML string that means what was handed to it.

            **Not `repr`.** Python's repr produces a PYTHON literal, and TOML
            reads a single-quoted string as a LITERAL string with no escape
            processing at all -- so repr on a regex containing a backslash
            emitted a Python escape that TOML read back as two backslashes.
            Every claims_re worth writing has a backslash in it, so this was
            wrong for the commonest case and right only for the trivial ones.

            A literal string when the value has no apostrophe and no newline,
            which is almost always; a basic string with the escapes it needs
            otherwise.
            """
            if "'" not in v and "\n" not in v:
                return "'" + v + "'"
            esc = v.replace("\\", "\\\\").replace('"', '\\"').replace("\n", "\\n")
            return '"' + esc + '"'

        def assemble(name, harness, autonomous):
            """Build a goedel.toml from a fixed template and the answers given.

            The masks, the kinds, the bar and the budgets are the machine's.
            Only the commands are the project's, and they arrive already
            demonstrated: `genesis` does not call this until the tree they
            describe has built, tested and answered.
            """
            if not name.strip():
                raise ConfigError("a project with no name")
            setup = harness.get("setup", "")
            return TEMPLATE.format(
                name=toml_str(name.strip()),
                setup=("[%s]" % toml_str(setup)) if setup else "[]",
                check=toml_str(harness.get("check", "")),
                build=toml_str(harness.get("build", "")),
                clean=toml_str(harness.get("clean", "")),
                test=toml_str(harness.get("test", "")),
                verify=toml_str(harness.get("verify", "")),
                suites_re=toml_str(harness.get("suites_re", r"(\d+) passed")),
                claims_re=toml_str(harness.get("claims_re", r"^\s*(?:ok|PASS|PASSED)\b")),
                autonomous="true" if autonomous else "false")

        # ------------------------------------------------------------------

        cmd = os.environ.get("COMMAND", "load").strip()
        root = os.environ.get("ROOT", ".") or "."
        try:
            if cmd == "selftest":
                sys.exit(selftest())
            if cmd == "assemble":
                hj = Path(os.environ.get("HARNESS_JSON", "scaffold-harness.json"))
                if not hj.is_file():
                    raise ConfigError("no harness answers at %s" % hj)
                text = assemble(os.environ.get("NAME", ""),
                                json.loads(hj.read_text(encoding="utf-8")),
                                os.environ.get("AUTONOMOUS", "true") == "true")
                dest = Path(root) / "goedel.toml"
                dest.write_text(text, encoding="utf-8")
                # Read straight back through the same validation everything
                # else goes through. A config this action wrote and cannot
                # itself load is one the first night would have died on.
                load(tomllib.loads(text), root)
                print("  wrote %s, and it loads" % dest)
                out("json", str(dest))
                sys.exit(0)

            p = Path(root) / "goedel.toml"
            if not p.is_file():
                raise ConfigError(
                    "no goedel.toml at %s -- that file is the whole of the adapter between "
                    "this machine and a project, and there is no default for it" % root)
            try:
                raw = tomllib.loads(p.read_text(encoding="utf-8"))
            except tomllib.TOMLDecodeError as exc:
                raise ConfigError("goedel.toml is not valid TOML: %s" % exc) from None
            cfg = load(raw, root)
            digest, n = utility_digest(root, cfg["criterion"])
            cfg["utility"] = digest
            cfg["utility_files"] = n

            dest = Path(os.environ.get("RUNNER_TEMP", "/tmp")) / "goedel-config.json"
            dest.write_text(json.dumps(cfg, indent=2, sort_keys=True), encoding="utf-8")

            enabled = [k for k, v in sorted(cfg["kinds"].items()) if v["enabled"]]
            out("name", cfg["name"])
            out("utility", digest)
            out("epoch_len", str(cfg["judge"]["epoch_len"]))
            out("kinds", " ".join(enabled))
            out("shards", str(cfg["author"]["shards"]))
            out("shard_matrix", json.dumps(list(range(cfg["author"]["shards"]))))
            out("json", str(dest))
            out("proof", "yes" if cfg["proof"] else "no")
            out("autonomous", "yes" if cfg["loop"]["autonomous"] else "no")
            out("blueprint", cfg["blueprint"])
            export("GOEDEL_CONFIG", str(dest))
            export("GOEDEL_NAME", cfg["name"])
            export("GOEDEL_UTILITY", digest)
            export("GOEDEL_EPOCH_LEN", str(cfg["judge"]["epoch_len"]))
            export("GOEDEL_REPEATS", str(cfg["judge"]["repeats"]))
            export("GOEDEL_MIN_EVIDENCE", str(cfg["judge"]["min_evidence"]))

            print("  %s: %d kind(s) enabled (%s)" % (cfg["name"], len(enabled), ", ".join(enabled)))
            print("  the criterion is %d file(s), digest %s" % (n, digest[:16]))
            print("  epoch %d entries, repeats %d, confidence %.2f, fdr %.2f"
                  % (cfg["judge"]["epoch_len"], cfg["judge"]["repeats"],
                     cfg["judge"]["confidence"], cfg["judge"]["fdr"]))
            if cmd == "show":
                print(json.dumps(cfg, indent=2, sort_keys=True))
        except ConfigError as exc:
            print("::error::config: %s" % exc)
            sys.exit(1)
        PYEOF
