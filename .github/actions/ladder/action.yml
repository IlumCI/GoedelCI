name: goedel-ladder
description: >-
  The operator's one line, decomposed into witnessed milestones, and the
  bookkeeping that says which one the night is on.

# **This is the whole of what an operator does.** `loop/goal.txt` holds one
# paragraph saying what the project is for. Everything below it -- what to
# build next, in what order, and how anybody would know it worked -- is this
# action's, and it is the difference between a loop that improves a repository
# and a loop that walks a grid of constants forever.
#
# A rung is a milestone with a WITNESS: a sentence naming what would have to
# be observed for the milestone to be met. A milestone without one cannot be
# judged, so `propose` refuses to file it.
#
#     [rung] v2
#     seq 3
#     goal <sha256 of goal.txt when this rung was written>
#     kind feature
#     target src/cache.py
#     title An LRU cache in front of the resolver
#     witness a test that fills the cache past its bound and sees the oldest evicted
#     point <sha256 of this block, without this line>
#     balks 0
#     [end]
#
# **State is derived, not stored.** Whether a rung is open, met or retired is
# read off the LEDGER -- met when an adopted certificate carries its point,
# retired after enough refusals do. A counter in this file would be a second
# account of the same history and would eventually disagree with the first.
# Balks are the exception and have to be stored, because a draw that came back
# with nothing files no certificate to count.
#
# **The point is what makes any of that work.** It was the envelope's point
# that travelled to the certificate in the original of this file -- and an
# envelope's point differs every night, so `met` and `refused` both counted
# zero forever and a rung could be neither completed nor retired. The loop
# would have rebuilt one file every night for good, with the ladder never
# leaving its first rung.
#
# **The goal hash is how a changed goal stops old rungs.** Rewrite
# `loop/goal.txt` and every rung under the old text is stale by construction;
# `next` skips them and `propose` writes fresh ones. Changing your mind costs
# one edit.

inputs:
  command:
    description: "next | card | admit | balk | progress | goal | selftest"
    required: true
  root:
    description: "the tree the ladder lives in"
    required: false
    default: "."
  config:
    description: "the validated goedel.toml JSON"
    required: false
    default: ""
  why:
    description: "for balk: what came back instead of a draft"
    required: false
    default: ""
  reply:
    description: "for admit: the file `draft ask` wrote"
    required: false
    default: reply.txt
  criteria:
    description: >-
      the criteria still open in the blueprint's current phase, one per line,
      as `blueprint phase` writes them. When this file has lines in it a
      milestone's witness MUST be one of them, word for word: that is what
      makes a phase completable rather than a mood, and what stops the loop
      wandering into work the plan did not ask for.
    required: false
    default: ""
  survey:
    description: >-
      what `survey` found, used when no phase criteria are open. A finished
      plan is not a finished project: the first version of everything is full
      of the stub put in to get a test passing, the error caught and dropped,
      and the input nothing validates. Those are what a loop does next.
    required: false
    default: ""
  card-out:
    description: "for card: where to write the question"
    required: false
    default: ladder-card.txt
  grammar-out:
    description: "for card: where to write the GBNF the reply must take"
    required: false
    default: ""
  system-out:
    description: "for card: where to write the rules the answer is held to"
    required: false
    default: ladder-system.txt
  emit-env:
    description: "for next: where to write the RUNG_* file"
    required: false
    default: rung.env

outputs:
  have:
    description: "yes when a rung is open"
    value: ${{ steps.run.outputs.have }}
  point:
    description: "the open rung's point"
    value: ${{ steps.run.outputs.point }}
  kind:
    description: "the open rung's kind"
    value: ${{ steps.run.outputs.kind }}
  target:
    description: "the file it is about"
    value: ${{ steps.run.outputs.target }}
  verb:
    description: "create | edit"
    value: ${{ steps.run.outputs.verb }}
  retired:
    description: "yes when this call retired the rung"
    value: ${{ steps.run.outputs.retired }}
  why:
    description: "one line for the log"
    value: ${{ steps.run.outputs.why }}

runs:
  using: composite
  steps:
    - id: run
      shell: bash
      env:
        COMMAND: ${{ inputs.command }}
        ROOT: ${{ inputs.root }}
        CONFIG: ${{ inputs.config }}
        WHY: ${{ inputs.why }}
        EMIT_ENV: ${{ inputs.emit-env }}
        REPLY: ${{ inputs.reply }}
        CRITERIA: ${{ inputs.criteria }}
        SURVEY: ${{ inputs.survey }}
        CARD_OUT: ${{ inputs.card-out }}
        SYSTEM_OUT: ${{ inputs.system-out }}
        GRAMMAR_OUT: ${{ inputs.grammar-out }}
      run: |
        set -euo pipefail
        python3 - <<'PYEOF'
        import fnmatch, hashlib, json, os, re, sys
        from pathlib import Path

        RUNGS = "loop/ladder/rungs.txt"
        OPEN, CLOSE = "[rung] v2", "[end]"
        KEYS = ("seq", "goal", "kind", "target", "title", "witness", "point", "balks")
        DECLARED = ("kind", "target", "title", "witness")

        class LadderError(Exception): pass

        def out(k, v):
            """A step output, and never more than one.

            `$GITHUB_OUTPUT` is line-oriented, so a value carrying a newline
            writes a SECOND assignment that the runner obeys. Several of these
            values are model-derived -- a refusal reason, a milestone title --
            so a reply containing "\\nverdict=adopt" would set an output no step
            wrote. Every output here is a scalar by design, so collapsing is
            both safe and the meaning.
            """
            v = str(v).replace("\r", " ").replace("\n", " ")
            with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
                fh.write("%s=%s\n" % (k, v))


        # -- the file ----------------------------------------------------

        def parse(text):
            rungs, cur, inside = [], None, False
            for n, line in enumerate(text.splitlines(), 1):
                s = line.strip()
                if s == OPEN:
                    if inside:
                        raise LadderError("line %d: a rung opened inside a rung" % n)
                    cur, inside = {}, True
                    continue
                if s == CLOSE:
                    if not inside:
                        raise LadderError("line %d: a rung closed that was not open" % n)
                    missing = [k for k in KEYS if k not in cur]
                    if missing:
                        raise LadderError("the rung ending at line %d declares no %s"
                                          % (n, ", ".join(missing)))
                    rungs.append(cur); cur, inside = None, False
                    continue
                if not s:
                    continue
                if not inside:
                    raise LadderError("line %d: content outside any rung" % n)
                k, _, v = line.strip().partition(" ")
                if k not in KEYS:
                    raise LadderError("line %d: %r is not a rung field" % (n, k))
                if k in cur:
                    raise LadderError("line %d: %s again" % (n, k))
                cur[k] = v
            if inside:
                raise LadderError("the last rung was never closed")
            return rungs

        def render(rung):
            return "\n".join([OPEN] + ["%s %s" % (k, rung[k]) for k in KEYS] + [CLOSE, ""])

        def point_of(rung):
            """The digest of the rung's declaration, without the point itself.

            Only the DECLARED fields: seq and balks move, and a point that
            moved with them would stop naming the milestone the certificates
            carry.
            """
            body = "".join("%s %s\n" % (k, rung[k]) for k in DECLARED)
            return hashlib.sha256(body.encode("utf-8")).hexdigest()

        def load(root):
            p = Path(root) / RUNGS
            return parse(p.read_text(encoding="utf-8")) if p.is_file() else []

        def save(root, rungs):
            p = Path(root) / RUNGS
            p.parent.mkdir(parents=True, exist_ok=True)
            p.write_text("".join(render(r) for r in rungs), encoding="utf-8")

        def goal_text(root, cfg):
            p = Path(root) / cfg.get("goal", "loop/goal.txt")
            return p.read_text(encoding="utf-8").strip() if p.is_file() else ""

        def goal_hash(text):
            return hashlib.sha256(text.encode("utf-8")).hexdigest()[:16]

        # -- state, derived ----------------------------------------------

        def ledger(root):
            d = Path(root) / "loop/ledger/entries"
            if not d.is_dir():
                return []
            es = []
            for p in sorted(d.iterdir()):
                if p.suffix != ".cert" or p.name.startswith("."):
                    continue
                f = {}
                for line in p.read_text(encoding="utf-8").splitlines():
                    k, _, v = line.partition(" ")
                    f[k] = v
                es.append(f)
            return es

        def state_of(rung, entries, goal, balk_limit):
            """open | met | retired | stale, from the record rather than a counter."""
            if rung["goal"] != goal:
                return "stale"
            mine = [f for f in entries if f.get("ladder") == rung["point"]]
            if any(f["verdict"] == "adopt" for f in mine):
                return "met"
            refused = sum(1 for f in mine if f["verdict"] == "refuse")
            if refused + int(rung["balks"]) >= balk_limit:
                return "retired"
            return "open"

        def next_open(rungs, entries, goal, balk_limit):
            for r in rungs:
                if state_of(r, entries, goal, balk_limit) == "open":
                    return r
            return None

        # -- proposing ---------------------------------------------------

        # **The shape, as a grammar rather than as a request.**

        #

        # Measured against the runner's own author: asked for a milestone in

        # the block below, a 4B wrote six thousand characters of `src/window.py`

        # -- it pattern-matched the coding task and never saw the meta-task --

        # and `admit` refused it for carrying no fenced rung. That is a balk,

        # and three balks retire a milestone the model was never allowed to

        # propose. Constrained, the same question answered correctly in 22

        # seconds rather than four and a half minutes, because the grammar

        # stops generation at the closing sentinel instead of letting it write

        # an essay around the answer.

        #

        # The SYSTEM text stays and says the same thing in prose: a hosted

        # provider is sent no grammar, and the two must not disagree.

        def grammar(kinds):
            """The block, with `kind` enumerated rather than left open.

            A free `kind` line lets the model name one that does not exist,
            which `admit` then refuses for a reason the model could not have
            known -- and a refusal it could not have avoided is a balk, and
            three balks retire a milestone. Enumerated, the only kinds it can
            emit are the ones this project enabled.

            ENABLED, not every kind the config defines. A config carries
            kinds that are switched off, and offering one in the grammar
            would let the model pick exactly the thing `admit` refuses two
            lines later -- the same unavoidable refusal in a new place.
            """
            on = sorted(k for k, v in kinds.items() if v.get("enabled", True))
            alts = " | ".join('"%s"' % k for k in on) or '[^\\n]+'
            return (
                'root ::= "<<<RUNG>>>\\nkind: " kind "\\ntarget: " line '
                '"\\ntitle: " line "\\nwitness: " line "\\n<<<END>>>"\n'
                'kind ::= %s\n'
                'line ::= [^\\n]+\n' % alts
            )

        SYSTEM = __import__("textwrap").dedent("""\
            You decompose a project's goal into the single next milestone that would
            move it forward. You answer with exactly one fenced block and nothing else:

            <<<RUNG>>>
            kind: <one of the kinds you were given>
            target: <one path, relative to the repository root>
            title: <one line, what this milestone is>
            witness: <one line: what would have to be OBSERVED for it to be done>
            <<<END>>>

            Rules that are checked mechanically and will refuse your answer:
            - The kind must be one of the kinds listed for you, and the target must be
              inside the paths you were told are writable.
            - A `create` kind's target must NOT already exist; an `edit` kind's must.
            - The witness is a test that could be written and run, not a feeling. "the
              cache evicts the oldest entry when it is full" is a witness; "performance
              is better" is not.
            - Propose the SMALLEST next step, not the whole goal. One file.
            - Do not repeat a milestone that is already listed as done or abandoned.
            """)

        FENCE = re.compile(r"<<<RUNG>>>\s*(.*?)\s*<<<END>>>", re.S)

        def read_proposal(reply):
            found = FENCE.findall(reply)
            if not found:
                raise LadderError("the reply carries no fenced rung")
            if len(found) > 1:
                raise LadderError("the reply carries %d rungs; a milestone is one"
                                  % len(found))
            fields = {}
            for line in found[0].splitlines():
                if not line.strip():
                    continue
                k, sep, v = line.partition(":")
                if not sep:
                    raise LadderError("%r is not `key: value`" % line.strip())
                k = k.strip()
                if k not in DECLARED:
                    raise LadderError("%r is not a rung field a proposal may set" % k)
                if k in fields:
                    raise LadderError("%s again" % k)
                fields[k] = v.strip()
            missing = [k for k in DECLARED if k not in fields]
            if missing:
                raise LadderError("the proposal declares no " + ", ".join(missing))
            return fields

        def matches(path, masks):
            if path.startswith("./"):
                path = path[2:]
            for m in masks:
                if fnmatch.fnmatch(path, m):
                    return True
                if m.endswith("/**") and (path == m[:-3] or path.startswith(m[:-2])):
                    return True
            return False

        def admit(fields, cfg, root, rungs, goal, criteria=()):
            """`criteria` empty means maintenance: the witness is free, because
            there is no phase left for it to complete. It is still refused if
            it is missing or is a dash, which is the check that matters."""
            kinds = cfg["kinds"]
            kind = fields["kind"]
            if kind not in kinds or not kinds[kind]["enabled"]:
                raise LadderError("%r is not a kind this project has enabled" % kind)
            target = fields["target"]
            if matches(target, cfg["evaluator"]):
                raise LadderError(
                    "%s is the evaluator; a milestone aimed at the machine's own judge "
                    "goes through the boundary lane, not the ladder" % target)
            if not matches(target, cfg["allow"]):
                raise LadderError("%s is outside every writable path" % target)
            # A kind's own masks, where it declares them. What a milestone may
            # be ABOUT is narrower than what its patch may touch: a repair's
            # patch has to write a test, and a milestone aimed at a test is a
            # milestone about making the numbers go up.
            if kinds[kind]["targets"] and not matches(target, kinds[kind]["targets"]):
                raise LadderError(
                    "kind %s aims only at %s, and %s is not one of them"
                    % (kind, ", ".join(kinds[kind]["targets"]), target))
            if ".." in Path(target).parts or Path(target).is_absolute():
                raise LadderError("%s escapes the tree" % target)
            exists = (Path(root) / target).exists()
            verb = kinds[kind]["verb"]
            if verb == "create" and exists:
                raise LadderError("kind %s creates a file and %s is already there"
                                  % (kind, target))
            if verb == "edit" and not exists:
                raise LadderError("kind %s edits a file and %s does not exist"
                                  % (kind, target))
            if not fields["witness"] or fields["witness"] == "-":
                raise LadderError(
                    "a milestone with no witness cannot be judged, so it is not a "
                    "milestone")
            # **Verbatim, and that is the whole contract with the blueprint.**
            # `blueprint` decides a phase is met when a rung carrying one of its
            # criteria was adopted, and it matches on the sentence. A witness
            # that paraphrases meets nothing, so the phase never completes and
            # the plan stalls on it for good -- silently, because every
            # individual night looks like it worked.
            if criteria and fields["witness"] not in criteria:
                raise LadderError(
                    "the witness is not one of the criteria open in this phase. It has "
                    "to be one of them word for word, or meeting it completes nothing "
                    "and the plan never moves on. Open:\n  " + "\n  ".join(criteria))
            if not fields["title"]:
                raise LadderError("a milestone with no title says nothing")
            for k, v in fields.items():
                if "\n" in v:
                    raise LadderError("%s carries a newline; the format is one line each" % k)

            rung = dict(fields)
            rung["seq"] = str(len(rungs) + 1)
            rung["goal"] = goal
            rung["balks"] = "0"
            rung["point"] = point_of(rung)
            if any(r["point"] == rung["point"] for r in rungs):
                raise LadderError("this exact milestone is already on the ladder")
            return rung

        def card(cfg, root, rungs, entries, goal_body, balk_limit, goal, criteria=(),
                 survey=""):
            kinds = ["  %s (%s, judged by %s)" % (k, v["verb"], v["j1"])
                     for k, v in sorted(cfg["kinds"].items()) if v["enabled"]]
            done, gone = [], []
            for r in rungs:
                s = state_of(r, entries, goal, balk_limit)
                if s == "met":
                    done.append("  %s: %s" % (r["target"], r["title"]))
                elif s == "retired":
                    gone.append("  %s: %s" % (r["target"], r["title"]))
            tree = []
            for p in sorted(Path(root).rglob("*")):
                if not p.is_file():
                    continue
                rel = p.relative_to(root).as_posix()
                if matches(rel, cfg["allow"]) and not matches(rel, cfg["evaluator"]):
                    tree.append("  " + rel)
            parts = ["THE GOAL\n" + goal_body]
            if criteria:
                # The plan, ahead of everything else. A night works the next
                # thing rather than any thing, and the witness has to be one of
                # these sentences so that meeting it completes something.
                parts.append(
                    "THE PHASE BEING BUILT RIGHT NOW. Your milestone's witness must be "
                    "ONE of these sentences, copied word for word:\n"
                    + "\n".join("  " + c for c in criteria))
            elif survey.strip():
                # **The plan is finished and the project is not.** Nothing is
                # owed to a phase any more, so the witness is free -- but it is
                # still a witness, and it should come from something actually
                # observed in the tree rather than from an idea about it.
                parts.append(
                    "THE PLAN IS FINISHED. Every phase of the blueprint is met, so there "
                    "is no criterion to satisfy and the work now is keeping this thing "
                    "correct: replacing what is still standing in for the real "
                    "implementation, closing what is unsafe, reporting failures that are "
                    "currently discarded, and testing what nothing tests.\n\n"
                    "Here is what was found in the tree. Take ONE of these, and make its "
                    "`a test would show` line your witness -- it is already written as "
                    "something observable:\n\n" + survey.strip()
                    + "\n\nPrefer the unsafe findings, then the swallowed failures, then "
                      "the stubs. Do not propose work that is not on this list: a "
                      "milestone nothing observed is a guess about a codebase you are "
                      "seeing one file of.")
            parts += [
                     "THE KINDS OF MILESTONE AVAILABLE\n" + "\n".join(kinds),
                     "THE PATHS YOU MAY AIM AT\n" + "\n".join("  " + m for m in cfg["allow"])]
            if tree:
                parts.append("WHAT ALREADY EXISTS THERE\n" + "\n".join(tree[:200]))
            else:
                parts.append("NOTHING EXISTS THERE YET. The first milestone creates a file.")
            if done:
                parts.append("ALREADY DONE\n" + "\n".join(done))
            if gone:
                parts.append("TRIED AND ABANDONED -- do not propose these again\n"
                             + "\n".join(gone))
            return "\n\n".join(parts)

        def progress(rungs, entries, goal, balk_limit):
            if not rungs:
                return "(the ladder is empty; the next night writes its first rung)"
            rows = [("seq", "state", "kind", "target", "title")]
            for r in rungs:
                rows.append((r["seq"], state_of(r, entries, goal, balk_limit),
                             r["kind"], r["target"][:34], r["title"][:52]))
            w = [max(len(x[i]) for x in rows) for i in range(len(rows[0]))]
            return "\n".join("  ".join(c.ljust(n) for c, n in zip(x, w)).rstrip() for x in rows)

        # ------------------------------------------------------------------

        def selftest():
            import tempfile
            ok = fail = 0
            def claim(s, held, detail=""):
                nonlocal ok, fail
                if held: ok += 1; print("  ok   " + s)
                else:
                    fail += 1; print("  FAIL " + s); print("         " + str(detail))
            def raises(s, fn):
                try: fn()
                except LadderError: return claim(s, True)
                except Exception as exc: return claim(s, False, "wrong error: %r" % exc)
                return claim(s, False, "it returned instead of refusing")

            CFG = {"allow": ["src/**"], "evaluator": [".github/**", "goedel.toml"],
                   "goal": "loop/goal.txt",
                   "kinds": {"feature": {"verb": "create", "j1": "claims", "enabled": True,
                                         "targets": []},
                             "repair": {"verb": "edit", "j1": "witness", "enabled": True,
                                        "targets": []},
                             "off": {"verb": "edit", "j1": "claims", "enabled": False,
                                     "targets": []}}}

            def rung(**over):
                r = {"seq": "1", "goal": "g"*16, "kind": "feature", "target": "src/a.py",
                     "title": "a title", "witness": "a witness", "balks": "0"}
                r.update(over); r["point"] = point_of(r); return r

            r1 = rung()
            claim("a rung round-trips", parse(render(r1)) == [r1])
            claim("the point covers only the declaration",
                  point_of(rung(seq="9", balks="3")) == point_of(r1))
            claim("and changes when the milestone does",
                  point_of(rung(title="another")) != point_of(r1))
            raises("a rung that never closes is refused",
                   lambda: parse(render(r1).replace("[end]\n", "")))
            raises("a field nothing knows is refused",
                   lambda: parse(render(r1).replace("balks 0", "vibes good")))
            raises("content outside a rung is refused",
                   lambda: parse("stray\n" + render(r1)))

            # -- derived state -------------------------------------------
            G = "g"*16
            def cert(verdict, ladder):
                return {"verdict": verdict, "ladder": ladder}
            claim("a fresh rung is open", state_of(r1, [], G, 3) == "open")
            claim("an adopted certificate carrying its point meets it",
                  state_of(r1, [cert("adopt", r1["point"])], G, 3) == "met")
            claim("a certificate carrying another point does not",
                  state_of(r1, [cert("adopt", "z"*64)], G, 3) == "open")
            claim("enough refusals retire it",
                  state_of(r1, [cert("refuse", r1["point"])] * 3, G, 3) == "retired")
            claim("and not one fewer",
                  state_of(r1, [cert("refuse", r1["point"])] * 2, G, 3) == "open")
            claim("balks count toward retirement, because a balk files no certificate",
                  state_of(rung(balks="3"), [], G, 3) == "retired")
            claim("balks and refusals count together",
                  state_of(rung(balks="2"), [cert("refuse", point_of(rung(balks="2")))],
                           G, 3) == "retired")
            claim("a rung written under a different goal is stale",
                  state_of(r1, [], "h"*16, 3) == "stale")
            claim("so rewriting the goal stops every rung under the old one",
                  next_open([r1], [], "h"*16, 3) is None)
            claim("next takes the first open rung",
                  next_open([rung(seq="1"), rung(seq="2", title="b")], [], G, 3)["title"]
                  == "a title")
            claim("and skips a met one",
                  next_open([r1, rung(seq="2", title="b")],
                            [cert("adopt", r1["point"])], G, 3)["title"] == "b")

            # -- the fence contract --------------------------------------
            good = ("<<<RUNG>>>\nkind: feature\ntarget: src/a.py\ntitle: t\n"
                    "witness: w\n<<<END>>>")
            claim("a well-formed proposal parses",
                  read_proposal(good)["target"] == "src/a.py")
            claim("prose around the fence is ignored",
                  read_proposal("I think:\n" + good + "\nHope that helps.")["kind"] == "feature")
            raises("a reply with no fence is refused", lambda: read_proposal("sure thing"))
            raises("two fences is refused: a milestone is one",
                   lambda: read_proposal(good + "\n" + good))
            raises("a field a proposal may not set is refused",
                   lambda: read_proposal(good.replace("title: t", "point: deadbeef")))
            raises("a missing field is refused",
                   lambda: read_proposal(good.replace("witness: w\n", "")))
            raises("a line that is not key: value is refused",
                   lambda: read_proposal(good.replace("title: t", "just some prose")))

            with tempfile.TemporaryDirectory() as td:
                root = Path(td)
                (root / "src").mkdir()
                (root / "src/there.py").write_text("x")
                def adm(**over):
                    f = {"kind": "feature", "target": "src/new.py", "title": "t",
                         "witness": "w"}
                    f.update(over)
                    return lambda: admit(f, CFG, root, [], G)
                claim("a well-formed milestone is admitted", adm()()["point"])
                raises("a kind this project has not enabled is refused", adm(kind="off"))
                raises("a kind it does not have at all is refused", adm(kind="mystery"))
                raises("a target in the evaluator is refused", adm(target="goedel.toml"))
                raises("a target outside every writable path is refused",
                       adm(target="README.md"))
                NARROW = dict(CFG, kinds=dict(
                    CFG["kinds"], feature={"verb": "create", "j1": "claims",
                                           "enabled": True, "targets": ["src/**"]}))
                raises("a milestone aimed outside its kind's own masks is refused",
                       lambda: admit({"kind": "feature", "target": "tests/t.py",
                                      "title": "t", "witness": "w"}, NARROW, root, [], G))
                OPEN = ("posting a body to /paste returns an id",
                        "getting /paste/<id> returns the body that was posted")
                raises("a witness that paraphrases a criterion is refused",
                       lambda: admit({"kind": "feature", "target": "src/new.py",
                                      "title": "t", "witness": "posting returns an id"},
                                     CFG, root, [], G, OPEN))
                claim("and one copied word for word is admitted",
                      admit({"kind": "feature", "target": "src/new.py", "title": "t",
                             "witness": OPEN[0]}, CFG, root, [], G, OPEN)["witness"]
                      == OPEN[0])
                claim("with no phase open, any witness a test could be written for does",
                      admit({"kind": "feature", "target": "src/new.py", "title": "t",
                             "witness": "anything observable"}, CFG, root, [], G)["title"]
                      == "t")
                c = card(CFG, root, [], [], "a goal", 3, G, OPEN)
                claim("the card puts the open criteria first", "word for word" in c)
                claim("and lists them", OPEN[1] in c)

                SURVEY = ("[unsafe] src/a.py:4\n    run(x, shell=True)\n"
                          "    a test would show: a value containing shell "
                          "metacharacters is handled literally\n")
                m = card(CFG, root, [], [], "a goal", 3, G, (), SURVEY)
                claim("with no criteria open the card turns to maintenance",
                      "THE PLAN IS FINISHED" in m)
                claim("and carries what was actually found in the tree",
                      "shell=True" in m)
                claim("and tells it to take a witness from the findings",
                      "a test would show" in m)
                claim("and not to invent work that was not observed",
                      "not on this list" in m)
                claim("a maintenance milestone's witness is free of any phase",
                      admit({"kind": "feature", "target": "src/new.py", "title": "t",
                             "witness": "a value with a semicolon in it is not executed"},
                            CFG, root, [], G, ())["witness"].startswith("a value"))
                raises("but a maintenance milestone still needs one",
                       lambda: admit({"kind": "feature", "target": "src/new.py",
                                      "title": "t", "witness": "-"},
                                     CFG, root, [], G, ()))
                with_survey = card(CFG, root, [], [], "a goal", 3, G, OPEN, SURVEY)
                claim("an open phase still wins over the survey",
                      "THE PLAN IS FINISHED" not in with_survey)

                claim("and one inside them is admitted",
                      admit({"kind": "feature", "target": "src/new.py", "title": "t",
                             "witness": "w"}, NARROW, root, [], G)["kind"] == "feature")
                raises("a target that escapes the tree is refused",
                       adm(target="src/../../etc/passwd"))
                raises("a create kind aimed at a file that exists is refused",
                       adm(target="src/there.py"))
                raises("an edit kind aimed at a file that does not is refused",
                       adm(kind="repair", target="src/absent.py"))
                claim("and an edit kind aimed at one that does is admitted",
                      admit({"kind": "repair", "target": "src/there.py", "title": "t",
                             "witness": "w"}, CFG, root, [], G)["kind"] == "repair")
                raises("a milestone with no witness is refused: it could not be judged",
                       adm(witness=""))
                raises("a witness of `-` is refused too", adm(witness="-"))
                raises("a milestone with no title is refused", adm(title=""))
                raises("a milestone already on the ladder is refused",
                       lambda: admit({"kind": "feature", "target": "src/new.py",
                                      "title": "t", "witness": "w"}, CFG, root,
                                     [admit({"kind": "feature", "target": "src/new.py",
                                             "title": "t", "witness": "w"},
                                            CFG, root, [], G)], G))
                added = admit({"kind": "feature", "target": "src/new.py", "title": "t",
                               "witness": "w"}, CFG, root, [r1], G)
                claim("a new rung takes the next sequence number", added["seq"] == "2")
                claim("and is stamped with the goal it was written under",
                      added["goal"] == G)

                c = card(CFG, root, [r1], [cert("adopt", r1["point"])], "build a thing", 3, G)
                claim("the card carries the goal", "build a thing" in c)
                claim("and only the enabled kinds", "off (" not in c and "feature (" in c)
                claim("and what is already done", "ALREADY DONE" in c)
                claim("and what exists in the writable tree", "src/there.py" in c)
                gone = card(CFG, root, [r1], [cert("refuse", r1["point"])] * 3,
                            "build a thing", 3, G)
                claim("and tells it not to re-propose what was abandoned",
                      "ABANDONED" in gone)

            claim("progress renders an empty ladder without failing",
                  "empty" in progress([], [], G, 3))
            claim("and a populated one as a table",
                  "retired" in progress([r1], [cert("refuse", r1["point"])] * 3, G, 3))
            # -- the grammar, which is the shape as a constraint ----------
            G = grammar({"feature": {"enabled": True}, "repair": {"enabled": True},
                         "off": {"enabled": False}})
            claim("the grammar names the same four fields the parser requires",
                  all(("\\n%s: " % k) in G or ('"<<<RUNG>>>\\n%s: "' % k) in G
                      for k in DECLARED), G)
            claim("and it opens and closes on the sentinels admit looks for",
                  "<<<RUNG>>>" in G and "<<<END>>>" in G)
            claim("a field is one line, so a milestone cannot run into the next",
                  "line ::= [^" in G and G.rstrip().endswith("]+"))
            claim("kind is enumerated, so the model cannot name one that is "
                  "not enabled and be refused for a rule it could not check",
                  'kind ::= "feature" | "repair"' in G, G)
            claim("a kind the project switched off is not offered, or the "
                  "model would pick the one thing admit refuses next",
                  '"off"' not in G, G)
            claim("a project with one kind gets a grammar naming only it",
                  'kind ::= "repair"\n' in grammar({"repair": {"enabled": True}}))
            claim("and the enumeration follows the project, not this file",
                  '"tidy"' in grammar({"tidy": {"enabled": True}}))
            claim("the block the grammar forces is one admit reads",
                  read_proposal("<<<RUNG>>>\nkind: feature\ntarget: src/a.py\n"
                                "title: t\nwitness: w\n<<<END>>>")["witness"] == "w",
                  "a grammar that produced something the parser refuses would be "
                  "two contracts disagreeing, and the model would obey the wrong one")

            print("\n%d/%d claims held" % (ok, ok + fail))
            return 1 if fail else 0

        # ------------------------------------------------------------------

        cmd = os.environ["COMMAND"].strip()
        if cmd == "selftest":
            sys.exit(selftest())

        root = os.environ.get("ROOT", ".") or "."
        cfg = json.loads(Path(os.environ["CONFIG"]).read_text(encoding="utf-8"))
        limit = int(cfg["judge"].get("balks", 3))
        criteria = ()
        cpath = os.environ.get("CRITERIA", "").strip()
        if cpath and Path(cpath).is_file():
            criteria = tuple(l.strip() for l in
                             Path(cpath).read_text(encoding="utf-8").splitlines() if l.strip())
        survey = ""
        spath = os.environ.get("SURVEY", "").strip()
        if spath and Path(spath).is_file():
            survey = Path(spath).read_text(encoding="utf-8")
        try:
            body = goal_text(root, cfg)
            if not body:
                raise LadderError(
                    "loop/goal.txt is empty. That one paragraph is the only thing this "
                    "machine cannot write for itself.")
            goal = goal_hash(body)
            rungs = load(root)
            entries = ledger(root)
            openr = next_open(rungs, entries, goal, limit)

            if cmd == "goal":
                print(body)
                out("have", "yes" if openr else "no"); out("why", "")
            elif cmd == "progress":
                text = progress(rungs, entries, goal, limit)
                print(text)
                # Also to a file. A composite action's stdout is not something
                # a caller can capture, and the audit pull request needs these
                # lines in its body -- a multi-line job output is a quoting
                # accident and GITHUB_OUTPUT has no good way to carry a table.
                Path("ladder-progress.txt").write_text(text + "\n", encoding="utf-8")
                out("have", "yes" if openr else "no"); out("why", "")
            elif cmd == "next":
                if not openr:
                    print("  no rung is open")
                    Path(os.environ["EMIT_ENV"]).write_text("", encoding="utf-8")
                    out("have", "no"); out("why", "no open rung")
                    sys.exit(0)
                verb = cfg["kinds"][openr["kind"]]["verb"]
                # A FILE and not job outputs: a title carries spaces and
                # backticks and a witness carries a sentence, and every one of
                # those is a quoting accident waiting in $GITHUB_OUTPUT.
                Path(os.environ["EMIT_ENV"]).write_text(
                    "".join("RUNG_%s=%s\n" % (k.upper(), openr[k]) for k in KEYS)
                    + "RUNG_VERB=%s\n" % verb, encoding="utf-8")
                print("  rung %s: %s %s -- %s"
                      % (openr["seq"], openr["kind"], openr["target"], openr["title"]))
                out("have", "yes"); out("point", openr["point"]); out("kind", openr["kind"])
                out("target", openr["target"]); out("verb", verb)
                out("why", openr["title"])
            elif cmd == "balk":
                if not openr:
                    out("have", "no"); out("why", "nothing to balk at"); sys.exit(0)
                openr["balks"] = str(int(openr["balks"]) + 1)
                save(root, rungs)
                gone = state_of(openr, entries, goal, limit) == "retired"
                print("  balk %s on rung %s%s"
                      % (openr["balks"], openr["seq"], " -- retired" if gone else ""))
                out("have", "yes"); out("point", openr["point"])
                out("retired", "yes" if gone else "no")
                out("why", os.environ.get("WHY", "")[:200].replace("\n", " "))
            elif cmd == "card":
                # **The question, written to a file; the asking belongs to
                # `draft`.** Both actions needed a model, so both carried a
                # copy of the request client -- sixty lines of HTTP that had to
                # agree and only agreed because a check said so. `draft` owns
                # the network now and this owns what a milestone MEANS, which
                # is the split that leaves neither holding a copy of the other.
                if openr:
                    print("  a rung is already open; nothing to ask")
                    out("have", "yes"); out("point", openr["point"]); out("why", "already open")
                    sys.exit(0)
                Path(os.environ["CARD_OUT"]).write_text(
                    card(cfg, root, rungs, entries, body, limit, goal, criteria, survey),
                    encoding="utf-8")
                Path(os.environ["SYSTEM_OUT"]).write_text(SYSTEM, encoding="utf-8")
                if os.environ.get("GRAMMAR_OUT", "").strip():
                    Path(os.environ["GRAMMAR_OUT"]).write_text(
                        grammar(cfg["kinds"]), encoding="utf-8")
                print("  asked for the next milestone")
                out("have", "no"); out("why", "a question was written")
            elif cmd == "admit":
                if openr:
                    print("  a rung is already open; the reply is not needed")
                    out("have", "yes"); out("point", openr["point"]); out("why", "already open")
                    sys.exit(0)
                f = Path(os.environ["REPLY"])
                if not f.is_file() or not f.read_text(encoding="utf-8").strip():
                    raise LadderError("no reply to admit")
                rung = admit(read_proposal(f.read_text(encoding="utf-8")),
                             cfg, root, rungs, goal, criteria)
                rungs.append(rung)
                save(root, rungs)
                print("  a new rung: %s %s -- %s"
                      % (rung["kind"], rung["target"], rung["title"]))
                out("have", "yes"); out("point", rung["point"]); out("kind", rung["kind"])
                out("target", rung["target"])
                out("verb", cfg["kinds"][rung["kind"]]["verb"])
                out("why", rung["title"])
            else:
                raise LadderError("no such command: %r" % cmd)
        except LadderError as exc:
            # A refused proposal is the ORDINARY outcome and not a failure.
            # The night goes on to whatever else it can do; retrying with more
            # context is how a fence contract stops being one.
            print("::notice::ladder %s: %s" % (cmd, exc))
            out("have", "no"); out("why", str(exc)[:200].replace("\n", " "))
            sys.exit(0 if cmd in ("card", "admit") else 1)
        PYEOF
