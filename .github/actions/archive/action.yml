name: goedel-archive
description: >-
  The lineage tree over the ledger, clade-level metaproductivity, and which
  node the night should grow from.

# This is the Huxley-Goedel Machine's contribution (arXiv:2510.21614) made
# concrete for a repository. The observation it rests on is the
# *metaproductivity-performance mismatch*: the tree state that scores best now
# is not reliably the one whose descendants score best later, so a search that
# always expands the current best is expanding the wrong thing. What predicts
# future improvement is **clade-level metaproductivity** -- how well a node's
# whole lineage of descendants has done -- and that is a quantity this ledger
# already contains, because every certificate names the one it descends from.
#
# The archive's nodes are the ADOPTED trees, plus a root. A refusal is not a
# node; it is an evaluation that happened at its parent, and it counts against
# that parent's clade exactly as a failed benchmark run counts against an
# agent. Rollbacks and supersessions count as neither: they are things that
# happened TO the record, and scoring a lineage for surviving an operator's
# override would reward the wrong thing.
#
# Selection is Thompson sampling over Beta(1+S, 1+F) per clade, seeded from a
# string the caller supplies -- the night's point, normally. Seeded, because a
# night nobody can reconstruct is the thing this whole ledger exists not to be:
# two runs over the same record must choose the same node, and an operator
# reading the log must be able to get the same answer by hand.
#
# **Any adopted node, including a cousin.** An earlier version of this refused
# to move anywhere but straight up the tip's own ancestry, on the reasoning
# that a repository has one working tree and restoring a cousin would make the
# ledger's parent chain stop describing the files. That reasoning was wrong,
# and it cost the search most of what the archive is for.
#
# The parent chain describes the files exactly as well after a sideways move as
# after a backtrack, because what it records is which STATE a trial was built
# from, not which commit came before it in time. Every invariant `ledger fsck`
# enforces still holds: the next entry's lineage names a node that exists, was
# adopted, and has a smaller sequence number. Nothing else was ever true of a
# backtrack either.
#
# What a move costs is the same in both directions -- the working tree becomes
# that node's tree and the ledger is carried forward whole -- so restricting it
# to ancestors bought nothing and removed every branch of the archive that was
# not on the tip's own line. On a tree where one early decision seeded two
# lineages, that is most of the search space.

inputs:
  command:
    description: "report | select | reconsider | authors | selftest"
    required: true
  root:
    description: "the tree the ledger lives in"
    required: false
    default: "."
  seed:
    description: "what makes this night's draw reproducible"
    required: false
    default: ""
  pool:
    description: "for authors: the pool's names, space separated"
    required: false
    default: ""
  shards:
    description: "for authors: how many shards the night fans out over"
    required: false
    default: "1"
  decay:
    description: >-
      for authors: how much a trial counts per epoch of age. 1 is all-time,
      0 counts only the current epoch.
    required: false
    default: "1"
  min-evidence:
    description: "counted trials below which reconsider always stays"
    required: false
    default: "6"
  half:
    description: "extend (greedy) or explore (sampled) -- the OOPS half in force"
    required: false
    default: explore

outputs:
  node:
    description: "the chosen node's certificate name, or `root`"
    value: ${{ steps.run.outputs.node }}
  assignment:
    description: "for authors: a JSON array, one author name per shard"
    value: ${{ steps.run.outputs.assignment }}
  tree:
    description: "the git tree that node is"
    value: ${{ steps.run.outputs.tree }}
  decision:
    description: "for reconsider: stay | back"
    value: ${{ steps.run.outputs.decision }}
  steps:
    description: "for reconsider: how far up the chain"
    value: ${{ steps.run.outputs.steps }}
  cmp:
    description: "the chosen clade's metaproductivity"
    value: ${{ steps.run.outputs.cmp }}
  evidence:
    description: "how many counted trials that clade rests on"
    value: ${{ steps.run.outputs.evidence }}
  why:
    description: "one line saying what the record said"
    value: ${{ steps.run.outputs.why }}

runs:
  using: composite
  steps:
    - id: run
      shell: bash
      env:
        COMMAND: ${{ inputs.command }}
        ROOT: ${{ inputs.root }}
        SEED: ${{ inputs.seed }}
        POOL: ${{ inputs.pool }}
        SHARDS: ${{ inputs.shards }}
        DECAY: ${{ inputs.decay }}
        MIN_EVIDENCE: ${{ inputs.min-evidence }}
        HALF: ${{ inputs.half }}
      run: |
        set -euo pipefail
        python3 - <<'PYEOF'
        import hashlib, os, random, sys
        from pathlib import Path

        ROOT = "root"

        def out(k, v):
            """A step output, and never more than one.

            `$GITHUB_OUTPUT` is line-oriented, so a value carrying a newline
            writes a SECOND assignment that the runner obeys. Several of these
            values are model-derived -- a refusal reason, a milestone title --
            so a reply containing "\\nverdict=adopt" would set an output no step
            wrote. Every output here is a scalar by design, so collapsing is
            both safe and the meaning.
            """
            v = str(v).replace("\r", " ").replace("\n", " ")
            with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
                fh.write("%s=%s\n" % (k, v))

        class Node:
            __slots__ = ("name", "seq", "tree", "parent", "children",
                         "successes", "trials", "depth")
            def __init__(self, name, seq, tree, parent, depth):
                self.name, self.seq, self.tree = name, seq, tree
                self.parent, self.depth = parent, depth
                self.children, self.successes, self.trials = [], 0, 0

        class Archive:
            def __init__(self, nodes, order):
                self.nodes, self.order = nodes, order

            def clade(self, name):
                """`name` and every node descended from it."""
                found, stack = [], [name]
                while stack:
                    n = stack.pop()
                    found.append(n)
                    stack.extend(reversed(self.nodes[n].children))
                return found

            def counts(self, name):
                s = t = 0
                for n in self.clade(name):
                    s += self.nodes[n].successes
                    t += self.nodes[n].trials
                return s, t

            def cmp(self, name):
                """Clade metaproductivity: the posterior mean under a uniform prior.

                The prior matters and is not decoration. A node with one
                adopted trial out of one would otherwise read 1.000 and beat a
                node with nine out of ten forever, which is the pathology that
                makes a one-sample maximum a bad thing to sort by. Beta(1,1)
                prices ignorance: one-of-one reads 0.667, nine-of-ten reads
                0.833.
                """
                s, t = self.counts(name)
                return (s + 1) / (t + 2)

            def select(self, seed, explore=True):
                rng = random.Random(hashlib.sha256(seed.encode("utf-8")).digest())
                best, best_draw = ROOT, -1.0
                for name in self.order:
                    s, t = self.counts(name)
                    draw = rng.betavariate(1 + s, 1 + (t - s)) if explore else (s + 1) / (t + 2)
                    # Depth breaks ties toward the deeper node: two clades with
                    # the same record are the same bet, and the deeper one
                    # already carries more adopted work, so starting there
                    # spends less.
                    draw += self.nodes[name].depth * 1e-9
                    if draw > best_draw:
                        best, best_draw = name, draw
                return best

            def tip(self):
                return self.order[-1] if len(self.order) > 1 else ROOT

            def ancestry(self, name):
                """`name`, its parent, and so on up to the root."""
                chain, n = [], name
                while True:
                    chain.append(n)
                    if n == ROOT:
                        return chain
                    n = self.nodes[n].parent

            def distance(self, frm, to):
                """Steps from `frm` up to `to`, or -1 when `to` is not above it."""
                n, d = frm, 0
                while n != to:
                    if n == ROOT:
                        return -1
                    n = self.nodes[n].parent
                    d += 1
                return d

            def lca(self, a, b):
                """The nearest state both `a` and `b` were built from."""
                up = self.ancestry(a)
                seen = set(up)
                for n in self.ancestry(b):
                    if n in seen:
                        return n
                return ROOT

            def report(self):
                rows = [("node", "seq", "depth", "s/t", "clade s/t", "cmp")]
                for name in self.order:
                    n = self.nodes[name]
                    s, t = self.counts(name)
                    rows.append((name[:12], str(n.seq) if n.seq else "-", str(n.depth),
                                 "%d/%d" % (n.successes, n.trials), "%d/%d" % (s, t),
                                 "%.3f" % self.cmp(name)))
                w = [max(len(r[i]) for r in rows) for i in range(len(rows[0]))]
                return "\n".join("  ".join(c.ljust(x) for c, x in zip(r, w)).rstrip()
                                 for r in rows)

        def authors(entries, decay=1.0, now=None):
            """Adoptions and trials per author, and the same posterior mean.

            **The portfolio's own scoreboard.** A night can fan out over
            several models rather than several temperatures of one, and each
            shard is its own runner, so that costs nothing in wall clock. It
            is only worth doing if the record says which of them drew what --
            which is what the certificate's `author` field is for.

            Priced under Beta(1, 1) exactly as a clade is, and for the same
            reason: a one-of-one author is not evidence that it is perfect,
            and the uniform prior is what stops a single lucky draw sorting
            above a model with a long record. Events are not trials.

            **A trial from `n` epochs ago counts `decay ** n`.** The epoch is
            the span within which `utility` holds still, so a trial judged in
            an earlier one was judged by a different standard and is weaker
            evidence about this one -- weaker, not worthless, which is why
            this discounts rather than truncates. `decay = 0` IS truncation
            (only the current epoch survives, since anything older weighs
            zero) and `decay = 1` is the all-time count, so both readings
            come out of one number.

            The counts go fractional, which Beta takes without complaint: a
            model with four full-weight adoptions and four half-weight ones
            is Beta(7, 1), and that is the right amount of confidence.
            """
            def epoch_of(f):
                try:
                    return int(f.get("epoch", 0))
                except (TypeError, ValueError):
                    return 0

            if now is None:
                seen = [epoch_of(f) for _, f in entries]
                now = max(seen) if seen else 0
            tally = {}
            for _, f in entries:
                a = (f.get("author") or "-").strip()
                if not a or a == "-" or f.get("lane") == "event":
                    continue
                # **Age measured in epochs, not in nights.** The epoch is the
                # span within which the criterion holds still, so it is the
                # only unit in which two trials are comparable at all. `max(0,
                # ...)` because an entry cannot be newer than the newest one
                # and a negative age would weigh it MORE than the present.
                age = max(0, now - epoch_of(f))
                w = decay ** age
                if w <= 0.0:
                    continue
                s, t = tally.get(a, (0.0, 0.0))
                tally[a] = (s + (w if f.get("verdict") == "adopt" else 0.0), t + w)
            return {a: (s, t, (s + 1.0) / (t + 2.0)) for a, (s, t) in tally.items()}

        def authors_report(tally):
            if not tally:
                return "  no author has been attributed a trial yet"
            rows = [("author", "adopted", "trials", "cmp")]
            for a in sorted(tally, key=lambda k: (-tally[k][2], k)):
                s, t, c = tally[a]
                # Fractional, because they are discounted by age. Printed to
                # one place rather than rounded to integers: "3.5 of 6.0" is
                # the actual evidence, and an operator reading "4 of 6" would
                # be reading a number nothing computed.
                rows.append((a, "%.1f" % s, "%.1f" % t, "%.3f" % c))
            w = [max(len(r[i]) for r in rows) for i in range(len(rows[0]))]
            return "\n".join("  " + "  ".join(c.ljust(x) for c, x in zip(r, w)).rstrip()
                              for r in rows)

        def assign(names, tally, shards, seed):
            """Which author draws each shard.

            **Shard 0 takes the greedy author, the rest are sampled.** That
            is the same split shard 0 already has everywhere else here: it is
            the night the loop would have had anyway, so the best-known
            author never misses one. Shards 1..N draw independently from
            Beta(1+S, 1+F), which is Thompson sampling and means a better
            author wins more runners without a worse one ever being shut out
            -- its posterior stays wide until it has been tried enough to
            deserve a narrow one.

            Duplicates are the point, not a bug. Two shards on the author
            with the record and two on the challenger is the allocation the
            evidence justifies; forcing one shard each would spend the same
            runners ignoring everything the ledger knows.

            **With no evidence every author is Beta(1,1)**, so this is
            uniform -- which is exactly right, and is why there is no
            minimum-evidence floor here as there is on `reconsider`. Sampling
            two identical priors costs nothing; BACKTRACKING on them would
            move the night somewhere for no reason.

            Names come from the config's pool rather than from the ledger, so
            an author added tonight is in the running tonight.

            **A record does not expire, and that is a known limitation.** An
            author is scored over every trial it has ever had, so one that
            did badly against an old goal carries that forever. Epoch-scoping
            the tally would be the principled fix -- `utility` changes only
            at epoch boundaries, and entries judged by different criteria are
            not strictly comparable -- but sixteen entries an epoch is thin
            evidence to sample from. Named rather than half-solved.
            """
            rng = random.Random(hashlib.sha256(("authors" + seed).encode("utf-8")).digest())
            picks = []
            for n in range(max(0, shards)):
                best, best_draw = (names[0] if names else "-"), -1.0
                for a in names:
                    s, t, _ = tally.get(a, (0, 0, 0.0))
                    draw = ((s + 1.0) / (t + 2.0) if n == 0
                            else rng.betavariate(1 + s, 1 + (t - s)))
                    # Breaks an exact tie at random rather than by name, so
                    # that on a record with no evidence -- every author
                    # Beta(1,1) -- shard 0 is not always the same one.
                    draw += rng.random() * 1e-9
                    if draw > best_draw:
                        best, best_draw = a, draw
                picks.append(best)
            return picks

        def build(entries):
            """`entries` is a list of plain field mappings, in seq order."""
            nodes = {ROOT: Node(ROOT, 0, "-", "", 0)}
            order = [ROOT]
            for name, f in entries:
                if f["verdict"] not in ("adopt", "refuse", "stale"):
                    continue
                parent = f["lineage"]
                if parent not in nodes:
                    # `ledger fsck` refuses this, so reaching it means fsck did
                    # not run. Attach to the root rather than dropping the
                    # trial: an unattributable trial is still one that happened.
                    parent = ROOT
                nodes[parent].trials += 1
                if f["verdict"] == "adopt":
                    nodes[parent].successes += 1
                    nodes[name] = Node(name, int(f["seq"]), f["candidate-tree"], parent,
                                       nodes[parent].depth + 1)
                    nodes[parent].children.append(name)
                    order.append(name)
            return Archive(nodes, order)

        def load(root):
            d = Path(root) / "loop/ledger/entries"
            if not d.is_dir():
                return []
            es = []
            for p in sorted(d.iterdir()):
                if p.suffix != ".cert" or p.name.startswith("."):
                    continue
                f = {}
                for line in p.read_text(encoding="utf-8").splitlines():
                    k, _, v = line.partition(" ")
                    f[k] = v
                es.append((p.stem, f))
            es.sort(key=lambda e: int(e[1]["seq"]))
            return es

        def reconsider(archive, seed, min_evidence=6, explore=True):
            """(decision, tree, steps, node, why). `decision` is stay or move."""
            tip = archive.tip()
            total = archive.counts(ROOT)[1]
            if total < min_evidence:
                # Below the floor this answers `stay` by construction, and that
                # is not a stub: a clade comparison over four trials is a
                # comparison of two priors, and moving on it would throw away
                # adopted work for a coin.
                return ("stay", "", 0, tip,
                        "%d counted trial(s), under the %d floor" % (total, min_evidence))
            pick = archive.select(seed, explore=explore)
            if pick == tip:
                return ("stay", "", 0, tip, "the tip is the best clade to grow from")
            common = archive.lca(tip, pick)
            back = archive.distance(tip, common)
            over = archive.distance(pick, common)
            if over == 0:
                shape = "%d step(s) up its own line" % back
            elif back == 0:
                shape = "%d step(s) down into a lineage it already carries" % over
            else:
                shape = ("%d step(s) up to %s and %d back down another lineage"
                         % (back, common[:12], over))
            return ("move", archive.nodes[pick].tree, back, pick,
                    "clade %s reads %.3f against the tip's %.3f over %d trial(s): %s"
                    % (pick[:12], archive.cmp(pick), archive.cmp(tip),
                       archive.counts(pick)[1], shape))

        # ------------------------------------------------------------------

        def selftest():
            ok = fail = 0
            def claim(s, held, detail=""):
                nonlocal ok, fail
                if held: ok += 1; print("  ok   " + s)
                else:
                    fail += 1; print("  FAIL " + s)
                    if detail: print("         " + str(detail))

            def e(name, seq, lineage, verdict):
                return (name, {"verdict": verdict, "seq": str(seq), "lineage": lineage,
                               "candidate-tree": (name * 3)[:40].ljust(40, "0")})

            empty = build([])
            claim("an empty ledger is a root and nothing else", empty.order == [ROOT])
            claim("its tip is the root", empty.tip() == ROOT)
            claim("with no evidence the root reads the prior", empty.cmp(ROOT) == 0.5)
            claim("and it is where a night grows from", empty.select("x") == ROOT)

            es = [e("a"*16, 1, ROOT, "adopt"), e("b"*16, 2, "a"*16, "refuse"),
                  e("c"*16, 3, "a"*16, "adopt"), e("d"*16, 4, "c"*16, "refuse"),
                  e("e"*16, 5, "c"*16, "refuse")]
            a = build(es)
            claim("only adoptions become nodes", a.order == [ROOT, "a"*16, "c"*16])
            claim("refusals count as trials at the node they were tried from",
                  a.nodes["c"*16].trials == 2)
            claim("the tip is the newest adopted state", a.tip() == "c"*16)
            claim("a clade holds its node and its descendants",
                  a.clade("a"*16) == ["a"*16, "c"*16])
            claim("the root's clade counts every trial", a.counts(ROOT) == (2, 5))
            claim("cmp prices a clade under a uniform prior", abs(a.cmp(ROOT) - 3/7) < 1e-12)
            claim("a one-of-one clade does not read as certainty",
                  build([e("f"*16, 1, ROOT, "adopt")]).cmp(ROOT) < 0.7)
            claim("an event entry is not a trial",
                  build([e("a"*16, 1, ROOT, "restore")]).counts(ROOT) == (0, 0))
            claim("a stale entry is", build([e("a"*16, 1, ROOT, "stale")]).counts(ROOT) == (0, 1))

            claim("selection is deterministic in its seed", a.select("n1") == a.select("n1"))
            claim("and it does explore more than one clade",
                  len({a.select("n%d" % i) for i in range(40)}) > 1)
            greedy = max(a.order, key=lambda n: (a.cmp(n), a.nodes[n].depth))
            claim("greedy selection takes the best posterior mean, every time",
                  {a.select("n%d" % i, explore=False) for i in range(20)} == {greedy})

            claim("distance up the chain is counted in steps",
                  a.distance("c"*16, "a"*16) == 1)
            claim("and a node that is not an ancestor answers -1",
                  a.distance("a"*16, "c"*16) == -1)
            claim("a node's ancestry ends at the root",
                  a.ancestry("c"*16) == ["c"*16, "a"*16, ROOT])
            claim("the nearest common state of a node and itself is itself",
                  a.lca("c"*16, "c"*16) == "c"*16)
            claim("and of two lineages is where they parted",
                  a.lca("c"*16, "a"*16) == "a"*16)

            thin = build(es[:2])
            claim("under the evidence floor, reconsider stays",
                  reconsider(thin, "s", 6)[0] == "stay")
            claim("and says how far under it is", "under the 6 floor" in reconsider(thin, "s", 6)[4])

            bad = [e("a"*16, 1, ROOT, "adopt"), e("1"*16, 2, "a"*16, "adopt"),
                   e("2"*16, 3, "a"*16, "adopt"), e("3"*16, 4, "a"*16, "adopt"),
                   e("4"*16, 5, "3"*16, "refuse"), e("5"*16, 6, "3"*16, "refuse"),
                   e("6"*16, 7, "3"*16, "refuse"), e("7"*16, 8, "3"*16, "refuse")]
            ab = build(bad)
            outs = [reconsider(ab, "s%d" % i, 6) for i in range(40)]
            claim("a tip with a dead clade under a live ancestor does get moved off",
                  any(o[0] == "move" for o in outs),
                  "forty seeds all answered stay")
            mv = next(o for o in outs if o[0] == "move")
            claim("a move names a real node", mv[3] in ab.clade(ROOT))
            claim("and it is never the tip it is moving from", mv[3] != ab.tip())
            claim("a lineage whose every child failed is not where the night goes",
                  all(o[3] != "3"*16 for o in outs if o[0] == "move"))
            claim("the emitted decision is one the workflow branches on",
                  all(o[0] in ("stay", "move") for o in outs))

            # A cousin: two lineages from one early decision, one of them dead.
            # The old version could not reach the live one at all, because it
            # is not on the tip's own ancestry.
            cousins = [e("a"*16, 1, ROOT, "adopt"),
                       e("L"*16, 2, "a"*16, "adopt"),
                       e("1"*16, 3, "L"*16, "adopt"),
                       e("2"*16, 4, "L"*16, "adopt"),
                       e("R"*16, 5, "a"*16, "adopt"),
                       e("3"*16, 6, "R"*16, "refuse"),
                       e("4"*16, 7, "R"*16, "refuse"),
                       e("5"*16, 8, "R"*16, "refuse"),
                       e("6"*16, 9, "R"*16, "refuse")]
            cz = build(cousins)
            claim("the tip is in the dead lineage", cz.tip() == "R"*16)
            claim("and the live cousin is not one of its ancestors",
                  cz.distance(cz.tip(), "1"*16) == -1)
            picks = {reconsider(cz, "c%d" % i, 6)[3] for i in range(60)}
            claim("a cousin lineage is reachable, which is most of the search space",
                  bool(picks & {"L"*16, "1"*16, "2"*16}),
                  "sixty seeds only ever chose %s" % sorted(p[:4] for p in picks))
            side = [reconsider(cz, "c%d" % i, 6) for i in range(60)]
            over = [o for o in side if o[0] == "move" and cz.distance(cz.tip(), o[3]) == -1]
            claim("and a move to one says it went up and back down",
                  not over or "back down" in over[0][4] or "down into" in over[0][4])
            # -- the portfolio's scoreboard --------------------------------
            def E(author, verdict, lane="model", epoch=0):
                return ("x", {"author": author, "verdict": verdict, "lane": lane, "epoch": epoch})
            
            t = authors([E("a", "adopt"), E("a", "refuse"), E("b", "adopt")])
            claim("an author's adoptions and trials are counted",
                  t["a"][:2] == (1, 2) and t["b"][:2] == (1, 1), t)
            claim("and priced under the same uniform prior a clade is, so a "
                  "one-of-one author does not read as certainty",
                  t["b"][2] == 2 / 3)
            claim("a one-of-one author does not outrank a longer record it ties",
                  authors([E("a", "adopt")] * 6)["a"][2] > t["b"][2])
            claim("an unattributed draw is not counted against anybody",
                  "-" not in authors([E("-", "refuse"), E("a", "adopt")]))
            claim("an event is not a trial, here as everywhere else",
                  authors([E("a", "superseded", "event")]) == {})
            claim("the report sorts the portfolio best first",
                  authors_report(t).splitlines()[1].split()[0] == "b")
            claim("and says so plainly when nothing has been attributed yet",
                  "no author" in authors_report({}))

            # -- and a record that stops counting ---------------------------
            old = [E("a", "adopt", epoch=0)] * 4 + [E("b", "adopt", epoch=3)] * 4
            flat = authors(old, decay=1.0)
            claim("at decay 1 an ancient trial counts as much as tonight's",
                  flat["a"][1] == flat["b"][1] == 4.0, flat)
            half = authors(old, decay=0.5)
            claim("at decay 0.5 a trial three epochs old counts an eighth",
                  abs(half["a"][1] - 0.5) < 1e-9 and half["b"][1] == 4.0, half)
            claim("so the recent author outranks the ancient one on the same record",
                  half["b"][2] > half["a"][2])
            hard = authors(old, decay=0.0)
            claim("decay 0 IS truncation: only the current epoch survives",
                  list(hard) == ["b"] and hard["b"][1] == 4.0, hard)
            claim("the current epoch is read off the entries, so nothing has to "
                  "tell the archive what night it is",
                  authors([E("a", "adopt", epoch=9)], decay=0.0)["a"][1] == 1.0)
            claim("an entry that somehow post-dates the newest is not weighed "
                  "MORE than the present",
                  authors([E("a", "adopt", epoch=0)], decay=0.5, now=-5)["a"][1] == 1.0)
            claim("counts go fractional, which is what Beta wants",
                  authors([E("a", "adopt", epoch=0), E("a", "refuse", epoch=1)],
                          decay=0.5)["a"][:2] == (0.5, 1.5))
            claim("and a discounted tally still sorts and prints",
                  "0.5" in authors_report(authors(old, decay=0.5)))
            claim("a discounted record still drives the assignment",
                  assign(["a", "b"], half, 1, "s")[0] == "b"),
            # **Truncation must make an author UNCERTAIN, not invisible.** At
            # decay 0 an author with nothing in the current epoch drops out of
            # the tally entirely -- and `assign` reads a missing author as
            # Beta(1,1), the uniform prior, so it is still drawn. If it fell to
            # zero instead, one quiet epoch would retire a model for good and
            # the record could never recover it. Measured on a filed ledger:
            # an author last tried two epochs ago still took 37 of 160 shards.
            gone = authors([E("now", "adopt", epoch=2)] * 12, decay=0.0)
            claim("an author with nothing in the window is absent from the tally",
                  "stale" not in gone)
            claim("but still drawn, because a missing author reads as the prior "
                  "and not as a zero",
                  "stale" in assign(["now", "stale"], gone, 60, "s"))

            # -- Thompson sampling over the portfolio ----------------------

            T = authors([E("a", "adopt")] * 8 + [E("a", "refuse")] * 2

                        + [E("b", "adopt")] + [E("b", "refuse")] * 9)

            claim("shard 0 takes the author with the best posterior mean",

                  assign(["a", "b"], T, 1, "s")[0] == "a", T)

            many = assign(["a", "b"], T, 400, "s")

            claim("a better author wins more runners",

                  many.count("a") > many.count("b"),

                  (many.count("a"), many.count("b")))

            claim("and a worse one is never shut out, because its posterior stays "

                  "wide until it has been tried enough to deserve a narrow one",

                  many.count("b") > 0, many.count("b"))

            flat = assign(["a", "b"], {}, 400, "s")

            claim("with no evidence at all the assignment is near uniform, which "

                  "is what two identical priors should give",

                  140 < flat.count("a") < 260, flat.count("a"))

            claim("an author with no trials is still drawn, because the names come "

                  "from the pool and not from the ledger",

                  "c" in assign(["a", "b", "c"], T, 200, "s"))

            claim("one author takes every shard",

                  assign(["only"], T, 4, "s") == ["only"] * 4)

            claim("the assignment is deterministic in its seed",

                  assign(["a", "b"], T, 8, "s") == assign(["a", "b"], T, 8, "s"))

            claim("and a different seed is a different night, where the "
                  "evidence leaves anything to choose",
                  any(assign(["a", "b"], {}, 8, "s") != assign(["a", "b"], {}, 8, str(k))
                      for k in range(12)))
            claim("where it does not, the seed changes nothing: eight shards over "
                  "8/10 against 1/10 nearly all go to the author with the record",
                  all(assign(["a", "b"], T, 8, str(k)).count("a") >= 7
                      for k in range(12)),
                  [assign(["a", "b"], T, 8, str(k)).count("a") for k in range(12)])

            claim("an empty pool does not crash the night", assign([], T, 3, "s") == ["-"] * 3)

            claim("zero shards asks nobody", assign(["a"], T, 0, "s") == [])


            print("\n%d/%d claims held" % (ok, ok + fail))
            return 1 if fail else 0

        # ------------------------------------------------------------------

        cmd = os.environ["COMMAND"].strip()
        if cmd == "selftest":
            sys.exit(selftest())

        root = os.environ.get("ROOT", ".") or "."
        seed = os.environ.get("SEED", "")
        explore = os.environ.get("HALF", "explore") != "extend"
        entries = load(root)
        archive = build(entries)

        if cmd == "authors":
            import json as _json
            names = os.environ.get("POOL", "").split()
            try:
                n = int(os.environ.get("SHARDS", "1") or "1")
            except ValueError:
                n = 1
            try:
                decay = float(os.environ.get("DECAY", "1") or "1")
            except ValueError:
                decay = 1.0
            decay = min(1.0, max(0.0, decay))
            tally = authors(entries, decay=decay)
            picks = assign(names, tally, n, seed)
            print("  a trial counts %.2f per epoch of age" % decay)
            print(authors_report(tally))
            print("\n  tonight: " + ", ".join(
                "shard %d %s" % (i, a) for i, a in enumerate(picks)))
            out("assignment", _json.dumps(picks))
            sys.exit(0)

        if cmd == "report":
            print(archive.report())
            # The portfolio, under the lineage tree. An operator checking in
            # wants to know which of the models they are paying a runner for
            # is earning it, and that is not a question the clade table can
            # answer -- a clade is where a change came FROM, an author is
            # who wrote it.
            print("\n  the portfolio, best first")
            print(authors_report(authors(entries)))
            node = archive.tip()
            decision, tree, steps, why = "stay", archive.nodes[node].tree, 0, "reported only"
        elif cmd == "select":
            node = archive.select(seed, explore=explore)
            tree = archive.nodes[node].tree
            decision, steps = "stay", 0
            why = ("clade %s, cmp %.3f over %d trial(s), %s"
                   % (node[:12], archive.cmp(node), archive.counts(node)[1],
                      "sampled" if explore else "greedy"))
            print("  " + why)
        elif cmd == "reconsider":
            decision, tree, steps, node, why = reconsider(
                archive, seed, int(os.environ.get("MIN_EVIDENCE", "6") or "6"), explore)
            print("  the clade says: %s -- %s" % (decision, why))
        else:
            print("::error::archive: no such command: %r" % cmd)
            sys.exit(1)

        out("node", node)
        out("tree", tree)
        out("decision", decision)
        out("steps", str(steps))
        out("cmp", "%.4f" % archive.cmp(node))
        out("evidence", str(archive.counts(node)[1]))
        out("why", why)
        PYEOF
