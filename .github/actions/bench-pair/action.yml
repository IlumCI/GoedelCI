name: goedel-bench-pair
description: >-
  Measure two trees by alternating between them, so that time is not one of the
  things being compared.

# **Block measurement conflates the change with the clock.** Running the
# baseline's samples, then the candidate's, means every baseline reading was
# taken earlier than every candidate reading -- so a runner that warms up, a
# noisy neighbour that arrives, or a CPU that starts throttling shows up in the
# comparison as an effect of the patch. On a shared hosted runner that drift is
# routinely larger than anything a one-file change does.
#
# Measured directly, on two trees whose behaviour is byte-for-byte identical --
# the candidate adds a function nothing calls -- so every reported difference is
# the machine and none of it is the change:
#
#     run   block measurement   alternating
#      1          -0.03%           +0.15%
#      2          -8.84%           +0.44%
#      3         -28.27%           -1.12%
#
# A judge fed the third row would have adopted a no-op as a 28% improvement,
# and gone on doing so for as long as the runner was busy.
#
# The fix is the one every A/B benchmark uses: alternate. Round one takes a
# sample of each, round two takes another sample of each, and so on. Whatever
# the machine is doing over the run is then spread across both arms instead of
# landing entirely on one, and the paired comparison downstream is comparing
# two trees rather than two times of day.
#
# **It is a separate action because it needs git and `harness` deliberately
# does not.** `harness` runs commands in a directory and knows nothing about
# refs; that is what lets it be pointed at any project. This owns the checkout
# between rounds, and hands the readings back in the same rail-file format so
# nothing downstream can tell the difference.
#
# It MERGES into the rail files that already exist rather than replacing them:
# the cost rails -- warnings, artifact size -- come from the arms' real build
# and test runs and cannot be re-measured by a benchmark. A second reading of
# an artifact's size would be the same number by construction, so it is carried
# rather than re-taken.

inputs:
  command:
    description: "measure | selftest"
    required: false
    default: measure
  base-ref:
    description: "the baseline tree or commit"
    required: false
    default: ""
  cand-ref:
    description: "the candidate tree or commit"
    required: false
    default: ""
  config:
    description: "the validated goedel.toml JSON"
    required: false
    default: ""
  rounds:
    description: "how many samples of each arm; each round takes one of each"
    required: false
    default: "3"
  before:
    description: "the baseline's rail file, merged into"
    required: false
    default: rails-a.txt
  after:
    description: "the candidate's rail file, merged into"
    required: false
    default: rails-b.txt
  restore:
    description: "the ref to leave checked out when it is done"
    required: false
    default: ""

outputs:
  rounds:
    description: "how many rounds actually completed"
    value: ${{ steps.run.outputs.rounds }}
  rails:
    description: "how many rails were measured in both arms"
    value: ${{ steps.run.outputs.rails }}
  why:
    description: "when a round could not be taken, what stopped it"
    value: ${{ steps.run.outputs.why }}

runs:
  using: composite
  steps:
    - id: run
      shell: bash
      env:
        COMMAND: ${{ inputs.command }}
        BASE_REF: ${{ inputs.base-ref }}
        CAND_REF: ${{ inputs.cand-ref }}
        CONFIG: ${{ inputs.config }}
        ROUNDS: ${{ inputs.rounds }}
        BEFORE: ${{ inputs.before }}
        AFTER: ${{ inputs.after }}
        RESTORE: ${{ inputs.restore }}
      run: |
        set -euo pipefail
        python3 - <<'PYEOF'
        import json, os, re, subprocess, sys
        from pathlib import Path

        HEADER, FOOTER = "[rail] v2", "[rail] end"
        RAIL_LINE = re.compile(
            r"^([a-z][a-z0-9_]*(?:\.[a-z0-9_]+)+) +(-?[0-9.eE+]+) +(\S+) +(lower|higher)\s*$")

        class PairError(Exception): pass

        def out(k, v):
            v = str(v).replace("\r", " ").replace("\n", " ")
            with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
                fh.write("%s=%s\n" % (k, v))

        def git(*a):
            r = subprocess.run(["git"] + list(a), capture_output=True, text=True)
            if r.returncode:
                raise PairError("git %s: %s" % (" ".join(a), (r.stderr or r.stdout).strip()))
            return r.stdout.strip()

        def bench(cmd, timeout):
            """One reading. A round that will not run is not half a round."""
            try:
                r = subprocess.run(cmd, shell=True, capture_output=True, text=True,
                                   timeout=timeout)
            except subprocess.TimeoutExpired:
                return None, "the benchmark did not finish inside %ds" % timeout
            if r.returncode:
                tail = ((r.stdout or "") + (r.stderr or "")).strip().splitlines()
                return None, "the benchmark exited %d: %s" % (
                    r.returncode, " ".join(tail[-3:])[:200])
            found = {}
            for line in ((r.stdout or "") + (r.stderr or "")).splitlines():
                m = RAIL_LINE.match(line.strip())
                if m:
                    name, value, unit, direction = m.groups()
                    found[name] = (float(value), unit, direction)
            return found, ""

        def read(path):
            p = Path(path)
            if not p.is_file():
                return {}
            lines = [l for l in p.read_text(encoding="utf-8").splitlines() if l.strip()]
            if not lines or lines[0].strip() != HEADER or lines[-1].strip() != FOOTER:
                raise PairError("%s is not a rail file" % path)
            rails = {}
            for line in lines[1:-1]:
                name, vals, unit, direction = line.split()
                rails[name] = ([float(v) for v in vals.split(",")], unit, direction)
            return rails

        def write(path, rails):
            def num(v):
                return str(int(v)) if v == int(v) and abs(v) < 1e15 else repr(round(v, 6))
            body = "\n".join(
                "%s %s %s %s" % (n, ",".join(num(v) for v in vals), unit, d)
                for n, (vals, unit, d) in sorted(rails.items()))
            Path(path).write_text(HEADER + "\n" + (body + "\n" if body else "") + FOOTER + "\n",
                                  encoding="utf-8")

        # ------------------------------------------------------------------

        def selftest():
            import tempfile
            ok = fail = 0
            def claim(s, held, detail=""):
                nonlocal ok, fail
                if held: ok += 1; print("  ok   " + s)
                else:
                    fail += 1; print("  FAIL " + s); print("         " + str(detail))

            with tempfile.TemporaryDirectory() as td:
                p = str(Path(td) / "r.txt")
                write(p, {"a.b": ([1.0, 2.0], "n", "lower")})
                claim("a rail file round-trips through read and write",
                      read(p)["a.b"][0] == [1.0, 2.0])
                claim("an absent file reads as nothing rather than failing",
                      read(str(Path(td) / "gone.txt")) == {})
                Path(p).write_text("nonsense\n")
                try:
                    read(p); claim("a file that is not a rail file is refused", False)
                except PairError:
                    claim("a file that is not a rail file is refused", True)

            found, why = bench("echo 'host.q 41.2 ms lower'; echo noise", 10)
            claim("a reading is the rail lines and nothing else",
                  found == {"host.q": (41.2, "ms", "lower")})
            found, why = bench("exit 3", 10)
            claim("a benchmark that fails is not a reading", found is None)
            claim("and says what it did", "exited 3" in why)
            found, why = bench("sleep 5", 1)
            claim("a benchmark that hangs is not a reading either", found is None)
            claim("and says it ran out of time", "did not finish" in why)

            # The claim the whole action exists for.
            merged = {"cost.warnings": ([2.0], "n", "lower")}
            for value in (10.0, 11.0, 12.0):
                merged.setdefault("host.q", ([], "ms", "lower"))[0].append(value)
            claim("cost rails are carried, not re-measured",
                  merged["cost.warnings"][0] == [2.0])
            claim("and bench rails accumulate one sample per round",
                  merged["host.q"][0] == [10.0, 11.0, 12.0])
            print("\n%d/%d claims held" % (ok, ok + fail))
            return 1 if fail else 0

        # ------------------------------------------------------------------

        if os.environ.get("COMMAND", "").strip() == "selftest":
            sys.exit(selftest())

        cfg = json.loads(Path(os.environ["CONFIG"]).read_text(encoding="utf-8"))
        cmd = cfg["harness"]["bench"]
        timeout = cfg["harness"]["timeout"]
        rounds = max(1, int(os.environ.get("ROUNDS", "3") or "3"))
        base_ref, cand_ref = os.environ["BASE_REF"], os.environ["CAND_REF"]
        before_path, after_path = os.environ["BEFORE"], os.environ["AFTER"]

        if not cmd:
            print("  this project has no benchmark; the counts decide on their own")
            out("rounds", "0"); out("rails", "0"); out("why", "")
            raise SystemExit(0)

        before, after = read(before_path), read(after_path)
        taken, why = 0, ""
        try:
            for r in range(1, rounds + 1):
                for ref, into in ((base_ref, before), (cand_ref, after)):
                    git("checkout", "-qf", "--detach", ref)
                    found, err = bench(cmd, timeout)
                    if found is None:
                        why = "round %d: %s" % (r, err)
                        raise StopIteration
                    for name, (value, unit, direction) in found.items():
                        if name not in into:
                            into[name] = ([], unit, direction)
                        into[name][0].append(value)
                taken = r
                print("  round %d of %d" % (r, rounds))
        except StopIteration:
            pass
        finally:
            restore = os.environ.get("RESTORE", "").strip()
            if restore:
                git("checkout", "-qf", "--detach", restore)

        write(before_path, before)
        write(after_path, after)

        both = sorted(set(before) & set(after))
        print("  %d round(s) taken, %d rail(s) measured in both arms" % (taken, len(both)))
        if why:
            print("::warning::%s" % why)
        if taken == 0:
            # Nothing was measured, which is a fact about the run. The cost
            # rails are still in the files, so the comparison downstream still
            # has something to say; it simply has nothing to say about timing.
            print("::warning::no round completed, so no timing rail was measured")
        out("rounds", str(taken)); out("rails", str(len(both))); out("why", why)
        PYEOF
