name: goedel-template-check
description: >-
  The machine checked against itself: every workflow is one GitHub can actually
  load, every action can prove itself, every local `uses:` resolves, and the
  one block that exists twice is the same block twice.

# **First among the checks in spirit, because a workflow GitHub cannot load is
# a gate that is not running at all.** In the repository this template grew
# from, one workflow carried two `env:` keys on a single step. GitHub refused
# the file, so every push produced a zero-job run named after the path, the
# branch filter never applied because the filter was inside the file that would
# not load, and nothing published from that channel for weeks. The only symptom
# was a fast red X on unrelated branches, which reads as noise.
#
# It survived a YAML sweep that printed `ok`, because a permissive loader keeps
# the LAST of a duplicate pair -- agreeing with a file the real parser rejects,
# and keeping the wrong half of it. So a library is not the check here. The
# structural pass is, and it refuses what a library would quietly resolve.
#
# A library is still a second opinion worth having, because it is the same
# parser class GitHub uses and it says out loud that a file cannot be loaded
# at all. So `check` runs `yaml.safe_load` over every file as well, where the
# runner has the module, and adds what it says to the same list. The two
# readers are independent and neither is allowed to excuse the other: a file
# has to satisfy both.
#
# The five checks:
#
#   loadable    no duplicate key in one mapping, no tab indentation, and no
#               block scalar that ends early. The last is this template's own
#               hazard: every action here carries a python program inside
#               `run: |`, and YAML ends a block scalar at the first line
#               indented less than its first line. A prompt written flush-left
#               inside one truncates the program GitHub loads -- with no error,
#               at the exact point where the rest of the file stops existing.
#
#               A dedent is also how `run:` legally gives way to the next key,
#               so the dedent alone says nothing -- but the line it lands on
#               must be a key, a list item, a comment or a document marker.
#               Prose at column zero is none of those, and that is exactly
#               what a multi-line shell string looks like when its
#               continuation lines were never indented:
#
#                   gh pr comment "$n" --body "one was merged instead.
#
#                   Nothing is wrong with this one."
#
#               Two workflows shipped in that shape. Both produced a zero-job
#               run on every push, named after the path, with a scanning error
#               about a line two hundred down the file. The heredoc rule did
#               not see them because there was no heredoc.
#
#   provable    every action under .github/actions/ accepts `command:
#               selftest`, AND `ci` actually runs every one of them. An action
#               that cannot prove itself is one nothing downstream should
#               trust; an action whose suite exists and is never run is worse,
#               because it reads as covered. Both are how a check gets deleted:
#               not by argument, by nobody noticing it went.
#
#               `ci` lists the suites one line each rather than looping,
#               because a composite action cannot be called in a loop from
#               YAML. That list is therefore a thing that can silently fall
#               behind the directory, which is what this compares.
#
#   resolvable  every `uses: ./.github/actions/X` names a directory that is
#               there. A local `uses:` that does not resolve fails at run time,
#               in the middle of a night, on a step nobody was watching.
#
#   named       every status check RULESETS.md tells an operator to require is
#               one a job here actually reports. GitHub renders EVERY matrix
#               key into a job name unless the job declares one, so
#               `proof / drill (pass)` was really `proof / drill (pass,
#               adopt)` -- and a required check that never reports does not
#               fail a merge, it BLOCKS it, for good, while looking like a
#               queue. Two files nothing else keeps in step.
#
#   singular    exactly one action may talk to the network. This was two for a
#               while -- `draft` and `ladder` both needed a model, so both
#               carried sixty lines of HTTP that had to agree -- and the fix
#               was to split them so that one owns the network and the other
#               owns what a milestone means. This check is what stops the
#               second copy coming back the next time something needs to ask a
#               question, which is the form that drift takes here.

inputs:
  command:
    description: "check | selftest"
    required: true
  root:
    description: "the tree to check"
    required: false
    default: "."

outputs:
  actions:
    description: "how many actions were checked"
    value: ${{ steps.run.outputs.actions }}
  workflows:
    description: "how many workflows were checked"
    value: ${{ steps.run.outputs.workflows }}

runs:
  using: composite
  steps:
    - id: run
      shell: bash
      env:
        COMMAND: ${{ inputs.command }}
        ROOT: ${{ inputs.root }}
      run: |
        set -euo pipefail
        python3 - <<'PYEOF'
        import os, re, sys
        from pathlib import Path

        KEY = re.compile(r"^(\s*)(-\s+)?([A-Za-z_][\w.\-]*)\s*:(\s|$)")
        ITEM = re.compile(r"^(\s*)-(\s|$)")
        BLOCK = re.compile(r":\s*[|>][+-]?\d*\s*$")
        USES = re.compile(r"^\s*(?:-\s+)?uses:\s*['\"]?(\./[^\s'\"]+)")
        # Anything not beginning with `./` is somebody else's code, running
        # with this repository's token.
        FOREIGN = re.compile(r"^\s*(?:-\s+)?uses:\s*['\"]?(?!\./)([^\s'\"]+)")
        PINNED = re.compile(r"@[0-9a-f]{40}$")
        # `(?<![<])` so that `# <<< ask` -- a marker comment, not a redirection
        # -- does not read as `<< ask`.
        HEREDOC = re.compile(r"(?<![<])<<-?\s*['\"]?([A-Za-z_][A-Za-z0-9_]*)['\"]?\s*$")
        # `urllib` need not be the first name on the line: the action that has
        # it imports it alongside six others, and a regex anchored to the word
        # right after `import` found nothing and reported that this machine
        # cannot ask a model anything.
        NETWORK = re.compile(r"^\s*(?:import|from)\s+[\w., ]*\burllib\b", re.M)

        class TemplateError(Exception): pass

        def out(k, v):
            """A step output, and never more than one.

            `$GITHUB_OUTPUT` is line-oriented, so a value carrying a newline
            writes a SECOND assignment that the runner obeys. Several of these
            values are model-derived -- a refusal reason, a milestone title --
            so a reply containing "\\nverdict=adopt" would set an output no step
            wrote. Every output here is a scalar by design, so collapsing is
            both safe and the meaning.
            """
            v = str(v).replace("\r", " ").replace("\n", " ")
            with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
                fh.write("%s=%s\n" % (k, v))

        # The opening of a GitHub expression, assembled rather than written,
        # because this program may not contain one -- which is the rule it is
        # here to enforce. Writing it out is how this check first failed.
        EXPR = "$" + "{" + "{"

        def loadable(path, text, is_action=False):
            """Everything a structural read can say about one file.

            Returns (problems, uses). The `uses:` values are collected HERE,
            by the same walk that already knows where the block scalars and
            the comments are, rather than by a regex over the whole file --
            which found this action's own documentation and the string
            literals inside its selftest, and reported them as unresolved
            local actions.
            """
            bad, uses, foreign = [], [], []
            lines = text.split("\n")
            key_of = {}
            # (indent, {keys seen}) for each open mapping, outermost first.
            stack = [(-1, set())]
            i = 0
            while i < len(lines):
                line = lines[i]
                if line.strip().startswith("#") or not line.strip():
                    i += 1; continue
                u = USES.match(line)
                if u:
                    uses.append(u.group(1))
                else:
                    f = FOREIGN.match(line)
                    if f:
                        foreign.append((i + 1, f.group(1)))
                if "\t" in line[: len(line) - len(line.lstrip())]:
                    bad.append("line %d: a tab in the indentation; YAML forbids it" % (i + 1))
                    i += 1; continue

                if BLOCK.search(line):
                    opener = KEY.match(line)
                    opener = opener.group(3) if opener else ""
                    # Skip the scalar. YAML ends it at the first non-empty line
                    # indented less than its first line, and that is legal --
                    # it is how `run:` gives way to the next key. What is NOT
                    # legal is a HEREDOC inside the scalar whose terminator is
                    # on the far side of that boundary: the shell then gets a
                    # program cut off wherever YAML happened to stop, GitHub
                    # reports nothing wrong, and the step runs a fragment.
                    #
                    # Every action in this template is a python program inside
                    # `run: |`, so this is the template's own characteristic
                    # way of breaking, and a generic "ends early" heuristic
                    # both misses it -- the offending line is usually at column
                    # zero, outside any plausible guess at the block's owner --
                    # and fires on ordinary well-formed steps.
                    j, first, body = i + 1, None, []
                    while j < len(lines):
                        cur = lines[j]
                        if not cur.strip():
                            body.append(""); j += 1; continue
                        ind = len(cur) - len(cur.lstrip())
                        if first is None:
                            first = ind
                        elif ind < first:
                            break
                        body.append(cur[first:] if len(cur) >= first else cur.strip())
                        j += 1
                    for n, b in enumerate(body):
                        if b.lstrip().startswith("#"):
                            # `# <<< ask` reads as a heredoc opener `<< ask` to
                            # a regex that does not check what precedes the
                            # `<<`. The marker comments this template uses to
                            # bracket its one duplicated block are exactly that
                            # shape, so the check reported every action that
                            # carries one.
                            continue
                        m = HEREDOC.search(b)
                        if not m:
                            continue
                        term = m.group(1)
                        if not any(x.strip() == term for x in body[n + 1:]):
                            bad.append(
                                "line %d opens a heredoc <<%s that never closes inside this "
                                "run: block. YAML ended the block at line %d, so the shell "
                                "is handed a TRUNCATED program and GitHub reports nothing "
                                "wrong." % (i + 1 + n + 1, term, j + 1))
                    # And what ENDED the block has to be something YAML can go
                    # on to read. A dedent is how `run:` legally gives way to
                    # the next key, so the dedent itself says nothing -- but
                    # the line it lands on must be a key, a list item, a
                    # comment or a document marker. Prose at column zero is
                    # none of those, and that is precisely the shape of a
                    # multi-line shell string whose continuation lines were
                    # never indented:
                    #
                    #     gh pr comment "$n" --body "one was merged instead.
                    #
                    #     Nothing is wrong with this one."     <- column zero
                    #
                    # The scalar ends at the blank line, the quote never
                    # closes, and GitHub answers with a scanning error about a
                    # line hundreds down the file. The heredoc rule above does
                    # not see it because there is no heredoc.
                    if j < len(lines):
                        endr = lines[j]
                        t = endr.strip()
                        if not (KEY.match(endr) or ITEM.match(endr)
                                or t.startswith("#") or t.startswith("---")
                                or t.startswith("...")):
                            bad.append(
                                "line %d: %r is at a lower indent than the block scalar "
                                "opened at line %d, so YAML ENDS THE BLOCK HERE -- and "
                                "this line is not a key, a list item or a comment, so the "
                                "file stops being loadable at all. A multi-line shell "
                                "string whose continuation lines sit at column zero is "
                                "the usual cause; write the text to a file and pass "
                                "--body-file." % (j + 1, t[:60], i + 1))
                    if is_action and opener == "run":
                        for n, b in enumerate(body):
                            if EXPR in b:
                                bad.append(
                                    "line %d: a GitHub expression inside an action's "
                                    "run: block. The runner SUBSTITUTES it before bash "
                                    "ever sees the program -- and a composite action "
                                    "has no matrix or event context, so the whole "
                                    "manifest fails to load with 'Unexpected symbol'. "
                                    "Pass the value in through env: instead; a mention "
                                    "of one in a comment has to be assembled."
                                    % (i + 1 + n + 1))
                    i = j; continue

                m = KEY.match(line)
                if not m:
                    if ITEM.match(line):
                        # A bare `- value` at this indent. Nothing to track.
                        pass
                    i += 1; continue
                indent, dash, key, _ = m.groups()
                depth = len(indent) + (len(dash) if dash else 0)
                if dash:
                    # `- key:` opens a fresh mapping for this sequence item, so
                    # the same key in two items is not a duplicate.
                    while stack and stack[-1][0] >= depth:
                        stack.pop()
                    stack.append((depth, set()))
                else:
                    while stack and stack[-1][0] > depth:
                        stack.pop()
                    if not stack or stack[-1][0] < depth:
                        stack.append((depth, set()))
                seen = stack[-1][1]
                if key in seen:
                    bad.append(
                        "line %d: %r again in the same mapping. A permissive loader keeps "
                        "the last of the pair and agrees with a file GitHub refuses "
                        "outright." % (i + 1, key))
                seen.add(key)
                i += 1
            for n, ref in foreign:
                if not PINNED.search(ref):
                    bad.append(
                        "line %d: %s is not pinned to a commit. A tag is a moving pointer "
                        "somebody else controls, and this one runs with a token that can "
                        "write to your branches. Pin it: owner/repo@<40 hex> # v4"
                        % (n, ref))
            return bad, uses

        # A required status check is named `<workflow> / <job>`, and GitHub
        # renders every matrix key into the job half unless the job carries an
        # explicit `name:`. So the names an operator copies into a ruleset are
        # derived from two files that nothing keeps in step -- and a required
        # check that does not report does not fail the merge, it BLOCKS it,
        # for good, while looking like a queue. `proof / drill (pass)` was
        # already wrong: the matrix had two keys, so the real check was
        # `proof / drill (pass, adopt)`.
        # SPACES around the slash, which is how GitHub itself writes a check
        # name and is what separates one from the backticked paths and branch
        # patterns the same file is full of: `.github/RULESETS.md` and
        # `boundary/**` have no spaces, `proof / ledger` does. Anything that
        # survives and still does not name a workflow here is skipped rather
        # than reported, because the file is prose.
        CHECKREF = re.compile(r"`([A-Za-z0-9_-][A-Za-z0-9_.-]*) +/ +([^`/]+)`")

        def rendered_names(text):
            """(workflow name, [job name patterns]) read structurally.

            A GitHub expression becomes `*`, so a matrix-derived name matches
            what it could render as without this having to expand the matrix.
            """
            wf, jobs, in_jobs, job_indent = None, [], False, None
            pend, prop_indent = None, None
            for line in text.split("\n"):
                if not line.strip() or line.lstrip().startswith("#"):
                    continue
                ind = len(line) - len(line.lstrip())
                m = re.match(r"^name:\s*(.+?)\s*$", line)
                if m and wf is None:
                    wf = m.group(1).strip("'\"")
                if re.match(r"^jobs:\s*$", line):
                    in_jobs, job_indent = True, None
                    continue
                if not in_jobs:
                    continue
                if ind == 0:
                    in_jobs = False
                    continue
                m = re.match(r"^(\s*)([A-Za-z_][\w.-]*):\s*$", line)
                if m and (job_indent is None or ind == job_indent):
                    job_indent, prop_indent = ind, None
                    if pend:
                        jobs.append(pend)
                    pend = m.group(2)
                    continue
                if job_indent is not None and ind > job_indent and prop_indent is None:
                    # The first line under the job fixes where its own keys
                    # live. Anything deeper belongs to a step, a `with:` or a
                    # matrix -- and `name:` is the commonest key in all three,
                    # so without this the job list fills with step titles and
                    # artifact names and loses the jobs themselves.
                    prop_indent = ind
                m = re.match(r"^\s*name:\s*(.+?)\s*$", line)
                if m and pend is not None and ind == prop_indent:
                    pend = m.group(1).strip("'\"")
            if pend:
                jobs.append(pend)
            return wf, [re.sub(r"\$\{\{.*?\}\}", "*", j) for j in jobs]

        def has_selftest(text):
            return "selftest" in text and re.search(r"command.*selftest|selftest.*command",
                                                    text, re.S) is not None

        def block(text, name):
            m = re.search(r"# >>> %s\b.*?\n(.*?)\n\s*# <<< %s\b" % (name, name), text, re.S)
            return m.group(1) if m else None

        def check(root):
            root = Path(root)
            problems, n_actions, n_workflows = [], 0, 0

            wf = root / ".github/workflows"
            files = []
            if wf.is_dir():
                files += sorted(p for p in wf.iterdir() if p.suffix in (".yml", ".yaml"))
            n_workflows = len(files)
            actions = []
            ad = root / ".github/actions"
            if ad.is_dir():
                for sub in sorted(x for x in ad.iterdir() if x.is_dir()):
                    p = sub / "action.yml"
                    if not p.is_file():
                        p = sub / "action.yaml"
                    if not p.is_file():
                        problems.append("%s has no action.yml" % sub.name)
                        continue
                    actions.append((sub.name, p))
            n_actions = len(actions)
            files += [p for _, p in actions]

            # A second opinion, where the runner has one. It agrees with a
            # duplicate key and with a schema this action rejects, so it is
            # not the check -- but it is the same parser class GitHub uses,
            # and it says out loud that a file cannot be loaded at all. When
            # the two disagree the structural pass is the one that refuses.
            try:
                import yaml  # noqa: F401
            except ImportError:
                yaml = None
                print("::warning::no yaml module here; the structural pass is "
                      "the only reader")

            action_paths = {p for _, p in actions}
            for p in files:
                if yaml is not None:
                    try:
                        yaml.safe_load(p.read_text(encoding="utf-8"))
                    except Exception as e:
                        problems.append(
                            "%s: a real parser cannot load this file: %s"
                            % (p.relative_to(root), str(e).replace("\n", " ")))
                bad, uses = loadable(p, p.read_text(encoding="utf-8"),
                                     is_action=p in action_paths)
                for b in bad:
                    problems.append("%s: %s" % (p.relative_to(root), b))
                for u in uses:
                    # `u[2:]` and not `lstrip("./")`. lstrip strips CHARACTERS,
                    # so `./.github/actions/cert` came back as
                    # `github/actions/cert` and every local action read as
                    # missing. Every path in this template begins with a dot.
                    rel = u[2:] if u.startswith("./") else u
                    # A directory for a composite action, a FILE for a
                    # reusable workflow. Requiring a directory refused every
                    # `uses: ./.github/workflows/x.yml`, which is how one
                    # workflow calls another and is the whole shape of the
                    # night's judge step.
                    target = root / rel
                    if not (target.is_dir() or target.is_file()):
                        problems.append("%s uses %s, which is not there"
                                        % (p.relative_to(root), u))
                    elif target.is_dir() and not (target / "action.yml").is_file() \
                            and not (target / "action.yaml").is_file():
                        problems.append("%s uses %s, which has no action.yml"
                                        % (p.relative_to(root), u))

            for name, p in actions:
                if not has_selftest(p.read_text(encoding="utf-8")):
                    problems.append(
                        "%s has no selftest command. An action that cannot prove itself is "
                        "one nothing downstream should trust." % name)

            ci = root / ".github/workflows/ci.yml"
            if ci.is_file():
                text = ci.read_text(encoding="utf-8")
                ran = set(re.findall(
                    r"uses:\s*\./\.github/actions/([a-z0-9-]+)\s*\n\s*with:\s*\{\s*"
                    r"command:\s*selftest\s*\}", text))
                ran |= set(re.findall(
                    r"uses:\s*\./\.github/actions/([a-z0-9-]+)\s*\n(?:\s+\w[\w-]*:.*\n)*?"
                    r"\s+command:\s*selftest\s*\n", text))
                missing = sorted({n for n, _ in actions} - ran)
                if missing:
                    problems.append(
                        "ci does not run the claim suite of: %s. The suite exists and "
                        "nothing runs it, which reads as covered and is not."
                        % ", ".join(missing))

            rules = root / ".github/RULESETS.md"
            if rules.is_file():
                import fnmatch
                have = {}
                for p in sorted(wf.iterdir()) if wf.is_dir() else []:
                    if p.suffix not in (".yml", ".yaml"):
                        continue
                    n, js = rendered_names(p.read_text(encoding="utf-8"))
                    if n:
                        have.setdefault(n, []).extend(js)
                seen = set()
                for w, j in CHECKREF.findall(rules.read_text(encoding="utf-8")):
                    j = j.strip()
                    if (w, j) in seen or w not in have:
                        continue
                    seen.add((w, j))
                    if not any(fnmatch.fnmatchcase(j, pat) for pat in have[w]):
                        problems.append(
                            "RULESETS.md names `%s / %s` as a status check and no job in "
                            "%s.yml renders that name (it has: %s). A required check that "
                            "never reports does not fail a merge, it blocks it forever."
                            % (w, j, w, ", ".join(have[w])))

            talkers = [name for name, p in actions
                       if NETWORK.search(p.read_text(encoding="utf-8"))]
            if len(talkers) > 1:
                problems.append(
                    "more than one action talks to the network (%s). Exactly one may: two "
                    "copies of a request client are two definitions of how this machine "
                    "asks a question, and they drift. Ask through the one that owns it."
                    % ", ".join(sorted(talkers)))
            elif not talkers:
                problems.append(
                    "no action talks to the network, so nothing can ask a model anything")
            return problems, n_actions, n_workflows

        # ------------------------------------------------------------------

        def selftest():
            ok = fail = 0
            def claim(s, held, detail=""):
                nonlocal ok, fail
                if held: ok += 1; print("  ok   " + s)
                else:
                    fail += 1; print("  FAIL " + s); print("         " + str(detail))

            lo = lambda f, s: loadable(f, s)[0]
            us = lambda s: loadable("f", s)[1]

            good = "on:\n  push:\n    branches: [main]\njobs:\n  a:\n    runs-on: x\n"
            claim("a well-formed workflow has nothing wrong with it", lo("f", good) == [])

            dup = "jobs:\n  a:\n    runs-on: x\n    runs-on: y\n"
            claim("two of one key in one mapping is caught", len(lo("f", dup)) == 1)
            claim("and the message says why a loader would not catch it",
                  "keeps the last" in lo("f", dup)[0])

            twice = ("jobs:\n  a:\n    steps:\n      - run: x\n        env:\n          A: 1\n"
                     "        env:\n          B: 2\n")
            claim("the two-env-keys-on-one-step bug is caught", len(lo("f", twice)) == 1)

            items = ("steps:\n  - name: one\n    run: x\n  - name: two\n    run: y\n")
            claim("the same key in two list items is not a duplicate",
                  lo("f", items) == [])
            claim("but twice in ONE list item is",
                  len(lo("f", "steps:\n  - name: one\n    name: two\n")) == 1)

            siblings = "a:\n  x: 1\nb:\n  x: 2\n"
            claim("the same key under two different parents is not a duplicate",
                  lo("f", siblings) == [])

            tab = "jobs:\n\ta: x\n"
            claim("a tab in the indentation is caught", len(lo("f", tab)) == 1)

            blk = "run: |\n  line one\n  line two\n"
            claim("a block scalar is skipped rather than parsed as keys",
                  lo("f", blk) == [])
            claim("a key-looking line inside a block scalar is not a key",
                  lo("f", "run: |\n  a: 1\n  a: 2\n") == [])
            early = "steps:\n  - run: |\n      first: line\n    name: x\n"
            claim("a block that ends at a real sibling key is fine",
                  lo("f", early) == [])
            closed = ("steps:\n  - run: |\n      python3 - <<'PY'\n      print(1)\n"
                      "      PY\n    name: x\n")
            claim("a heredoc that closes inside its block is fine",
                  lo("f", closed) == [])
            trap = ("steps:\n  - run: |\n      python3 - <<'PY'\n      print(1)\n"
                    "    name: x\n")
            claim("a heredoc whose terminator fell outside the block is caught",
                  len(lo("f", trap)) == 1)
            claim("and the message says the shell gets a truncated program",
                  "TRUNCATED" in lo("f", trap)[0])
            flush = ("steps:\n  - run: |\n      python3 - <<'PY'\n      x = \"\"\"\n"
                     "prompt at column zero\n\"\"\"\n      PY\n")
            claim("a line at column zero inside a block ends it, and the heredoc "
                  "terminator is stranded",
                  any("TRUNCATED" in b for b in lo("f", flush)))
            claim("and the flush-left line is reported in its own right, because "
                  "it breaks the file whether or not a heredoc was open",
                  any("ENDS THE BLOCK HERE" in b for b in lo("f", flush)))

            claim("a local uses is found", us("      - uses: ./.github/actions/cert\n")
                  == ["./.github/actions/cert"])
            claim("a marketplace one is not", us("      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1\n") == [])
            claim("an unpinned third-party action is caught",
                  len(lo("f", "steps:\n  - uses: actions/checkout@v4\n")) == 1)
            claim("and the message says a tag is somebody else's moving pointer",
                  "moving pointer" in lo("f", "steps:\n  - uses: actions/checkout@v4\n")[0])
            claim("a pinned one is fine",
                  lo("f", "steps:\n  - uses: actions/checkout@" + "a"*40 + " # v4\n") == [])
            claim("and a local action needs no pin, being this repository's own",
                  lo("f", "steps:\n  - uses: ./.github/actions/cert\n") == [])
            claim("a reusable workflow of our own needs no pin either",
                  lo("f", "jobs:\n  j:\n    uses: ./.github/workflows/x.yml\n") == [])

            claim("a reusable workflow is used by file, not by directory",
                  us("    uses: ./.github/workflows/loop-judge.yml\n")
                  == ["./.github/workflows/loop-judge.yml"])
            claim("a uses inside a comment is not a uses",
                  us("      # - uses: ./.github/actions/X\n") == [])
            claim("nor is one inside a block scalar, where it is a string literal",
                  us("      - run: |\n          uses: ./.github/actions/cert\n") == [])
            claim("a dotted local path survives being resolved",
                  ("./.github/actions/cert")[2:] == ".github/actions/cert",
                  "lstrip('./') would have eaten the leading dot of .github")
            prose = ('steps:\n  - run: |\n      gh pr comment --body "one won.\n'
                     '\n'
                     'Nothing is wrong with this one."\n')
            claim("a flush-left continuation of a shell string is caught",
                  len(lo("f", prose)) == 1, lo("f", prose))
            claim("and the message says YAML ends the block there",
                  "ENDS THE BLOCK HERE" in lo("f", prose)[0])
            claim("a block that gives way to a sibling key is still fine",
                  lo("f", "steps:\n  - run: |\n      x\n    name: y\n") == [])
            claim("a block that gives way to the next list item is fine",
                  lo("f", "steps:\n  - run: |\n      x\n  - run: y\n") == [])
            claim("a block that gives way to a comment is fine",
                  lo("f", "steps:\n  - run: |\n      x\n# a note\njobs: {}\n") == [])
            claim("a block that runs to the end of the file is fine",
                  lo("f", "steps:\n  - run: |\n      x\n      y\n") == [])

            la = lambda s: loadable("f", s, is_action=True)[0]
            expr = "steps:\n  - run: |\n      echo " + EXPR + " inputs.x }" + "}\n"
            claim("a GitHub expression in an action's run: block is caught",
                  len(la(expr)) == 1, la(expr))
            claim("and the message says the runner substitutes it first",
                  "SUBSTITUTES" in la(expr)[0])
            claim("the same line in a workflow is legal and is not flagged",
                  lo("f", expr) == [])
            claim("an action's run: block with no expression is fine",
                  la("steps:\n  - run: |\n      echo hello\n") == [])
            claim("and one in an action's env:, which is where it belongs, is fine",
                  la("steps:\n  - env:\n      X: " + EXPR + " inputs.x }" + "}\n"
                     "    run: |\n      echo \"$X\"\n") == [])

            claim("a marker comment is not a heredoc",
                  lo("f", "steps:\n  - run: |\n      # <<< ask\n      x\n") == [])

            # Assembled rather than written out: a literal GitHub expression
            # in this program is substituted by the runner before bash sees
            # it, which is the rule two checks below.
            ARM = EXPR + " matrix.arm }" + "}"
            wfx = ("name: proof\njobs:\n  ledger:\n    runs-on: x\n  drill:\n"
                   "    name: drill (" + ARM + ")\n    runs-on: x\n")
            claim("a workflow's name and its jobs are read out of it",
                  rendered_names(wfx) == ("proof", ["ledger", "drill (*)"]),
                  rendered_names(wfx))
            claim("a job with no explicit name is known by its key",
                  rendered_names("name: ci\njobs:\n  machine:\n    runs-on: x\n")
                  == ("ci", ["machine"]))
            claim("a step's name is not a job's name",
                  rendered_names("name: ci\njobs:\n  a:\n    steps:\n"
                                 "      - name: something\n        run: x\n")
                  == ("ci", ["a"]))
            claim("nor is an artifact's, under a with: two levels down",
                  rendered_names("name: ci\njobs:\n  a:\n    runs-on: x\n"
                                 "    steps:\n      - uses: u\n        with:\n"
                                 "          name: ci-harness\n  b:\n    runs-on: x\n")
                  == ("ci", ["a", "b"]),
                  rendered_names("name: ci\njobs:\n  a:\n    runs-on: x\n"
                                 "    steps:\n      - uses: u\n        with:\n"
                                 "          name: ci-harness\n  b:\n    runs-on: x\n"))
            claim("a matrix-rendered name matches what it can render as",
                  __import__("fnmatch").fnmatchcase("drill (pass)", "drill (*)"))
            claim("and the two-key form that was actually shipped does too",
                  __import__("fnmatch").fnmatchcase("drill (pass, adopt)", "drill (*)"))
            claim("a check reference is picked out of the ruleset prose",
                  CHECKREF.findall("- checks: **`ci / machine`**, **`proof / drill (pass)`**")
                  == [("ci", "machine"), ("proof", "drill (pass)")])
            claim("and a plain path in prose is not one",
                  CHECKREF.findall("see `.github/RULESETS.md`, and `loop/ledger/x`") == [])
            claim("nor is a branch pattern that happens to be named after a workflow",
                  CHECKREF.findall("Ruleset `boundary` -- branch `boundary/**`") == [])

            claim("an action that imports urllib is one that talks to the network",
                  bool(NETWORK.search("        import urllib.request\n")))
            claim("even when it is not the first name on the import line",
                  bool(NETWORK.search("        import json, os, sys, urllib.request\n")))
            claim("and from-imports count too",
                  bool(NETWORK.search("        from urllib.request import urlopen\n")))
            claim("and a mention of it in a comment is not",
                  not NETWORK.search("        # urllib would do it\n"))

            claim("a marked block is extracted",
                  block("# >>> ask -- a note\nBODY\n# <<< ask\n", "ask") == "BODY")
            claim("and an unmarked file answers None", block("nothing", "ask") is None)
            claim("the marker's own comment line is not part of the block",
                  block("# >>> ask -- draft says this\nBODY\n# <<< ask", "ask")
                  == block("# >>> ask -- ladder says that\nBODY\n# <<< ask", "ask"))

            claim("a ci list that covers every action is fine",
                  not [n for n in ("cert", "ledger")
                       if n not in set(re.findall(
                           r"uses:\s*\./\.github/actions/([a-z0-9-]+)\s*\n\s*with:\s*\{\s*"
                           r"command:\s*selftest\s*\}",
                           "      - uses: ./.github/actions/cert\n        with: { command: selftest }\n"
                           "      - uses: ./.github/actions/ledger\n        with: { command: selftest }\n"))])
            claim("and one that misses an action is noticed",
                  "ledger" not in set(re.findall(
                      r"uses:\s*\./\.github/actions/([a-z0-9-]+)\s*\n\s*with:\s*\{\s*"
                      r"command:\s*selftest\s*\}",
                      "      - uses: ./.github/actions/cert\n        with: { command: selftest }\n")))

            claim("an action without a selftest is noticed",
                  not has_selftest("inputs:\n  command:\n    description: run\n"))
            claim("and one with it is not",
                  has_selftest("inputs:\n  command:\n    description: run | selftest\n"))
            print("\n%d/%d claims held" % (ok, ok + fail))
            return 1 if fail else 0

        # ------------------------------------------------------------------

        cmd = os.environ["COMMAND"].strip()
        if cmd == "selftest":
            sys.exit(selftest())
        if cmd != "check":
            print("::error::template-check: no such command: %r" % cmd); sys.exit(1)

        problems, n_actions, n_workflows = check(os.environ.get("ROOT", ".") or ".")
        out("actions", str(n_actions)); out("workflows", str(n_workflows))
        if problems:
            for p in problems:
                print("::error::%s" % p)
            sys.exit(1)
        print("  %d action(s) and %d workflow(s): every one loadable, every action provable, "
              "every local uses resolved" % (n_actions, n_workflows))
        PYEOF
