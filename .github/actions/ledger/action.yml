name: goedel-ledger
description: >-
  The append-only record of every trial, and the fsck that is the whole of the
  trust in it.

#     loop/ledger/entries/<name>.cert    one certificate, named by its digest
#     loop/ledger/tried/<point>.env      the envelope a night committed to
#     loop/ledger/anchors/<name>/        archived comparisons, for `boundary`
#
# `fsck` runs before the night reads the ledger and again after the night
# writes it. Not because corruption is expected, but because the ledger is the
# machine's memory, and a machine reasoning from a corrupted memory reaches
# confident conclusions -- which is worse than halting, and looks the same from
# outside until it is much worse.
#
# **This action does not know what a certificate field means.** It reads each
# entry with a `key value` split and checks only the claims the DIRECTORY
# makes: that a file is named by its own digest, that the sequence is a
# permutation of 1..N, that lineage points backwards at something real, and
# that epochs behave. Per-field validity is `cert`'s job and is delegated
# there with `check-dir`, so the field table exists in exactly one place.
#
# **The epoch claims are the Red Queen ones.** A self-improving system whose
# evaluator also changes has no fixed meaning for "better" unless the change is
# confined to epoch boundaries (arXiv:2606.26294). That confinement is a
# property of this directory, so it is checked here: entries in one epoch carry
# one utility digest, epochs advance by exactly one, and only at a boundary.
# Without those three, two certificates are two machines' opinions and
# comparing them is a category error nothing downstream can detect.
#
# **A boundary is either a full epoch or an amendment.** `boundary` is the
# machine's way to change its judge, and it may only do so when an epoch is
# full. The operator has a second way: edit the template on the default
# branch, which a night then follows. That is the human's authority and not
# the machine's to refuse -- but it is still a new judge, and a record that
# let it arrive silently mid-epoch would compare the two judges' verdicts as
# if they were one. So the night files an `amended` entry, and an amendment
# closes the epoch it arrives in, whatever its fill, and opens the next.
# Epochs are therefore counted from their own first entry, not from seq 1:
# absent any amendment the two readings are identical, and with one only
# the relative reading is true.

inputs:
  command:
    description: "fsck | tail | count | seq | report | selftest"
    required: true
  root:
    description: "the tree the ledger lives in"
    required: false
    default: "."
  epoch-len:
    description: "how many entries an epoch holds"
    required: false
    default: "16"
  n:
    description: "for tail: how many entries"
    required: false
    default: "10"

outputs:
  count:
    description: "how many entries the ledger holds"
    value: ${{ steps.run.outputs.count }}
  seq:
    description: "the sequence number the next entry takes"
    value: ${{ steps.run.outputs.seq }}
  epoch:
    description: "the epoch the next entry belongs to, judged by the same evaluator"
    value: ${{ steps.run.outputs.epoch }}
  boundary:
    description: "yes when the current epoch is full, so the next entry opens one"
    value: ${{ steps.run.outputs.boundary }}
  utility:
    description: "the evaluator digest the newest entry was judged by; empty for an empty ledger"
    value: ${{ steps.run.outputs.utility }}
  amend-epoch:
    description: "the epoch an `amended` entry filed now would open"
    value: ${{ steps.run.outputs.amend_epoch }}
  to-go:
    description: "how many more entries the current epoch takes before it is full"
    value: ${{ steps.run.outputs.to_go }}
  tip:
    description: "the name of the newest adopted entry, or `root`"
    value: ${{ steps.run.outputs.tip }}
  why:
    description: >-
      when fsck refuses, which claim it refused on. A caller that only knows
      THAT the record is bad cannot tell a drill that exercised the rule it
      meant to from one that tripped over something else on the way.
    value: ${{ steps.run.outputs.why }}

runs:
  using: composite
  steps:
    # Per-field validity first, and by the action that owns the field table.
    # fsck below assumes every file parses; this is what makes that true.
    - if: inputs.command == 'fsck'
      uses: ./.github/actions/cert
      with:
        command: check-dir
        dir: ${{ inputs.root }}/loop/ledger/entries

    - id: run
      shell: bash
      env:
        COMMAND: ${{ inputs.command }}
        ROOT: ${{ inputs.root }}
        EPOCH_LEN: ${{ inputs.epoch-len }}
        TAIL_N: ${{ inputs.n }}
      run: |
        set -euo pipefail
        python3 - <<'PYEOF'
        import hashlib, os, re, sys
        from pathlib import Path

        NAME16 = re.compile(r"\A[0-9a-f]{16}\Z")

        class LedgerError(Exception): pass

        def out(k, v):
            """A step output, and never more than one.

            `$GITHUB_OUTPUT` is line-oriented, so a value carrying a newline
            writes a SECOND assignment that the runner obeys. Several of these
            values are model-derived -- a refusal reason, a milestone title --
            so a reply containing "\\nverdict=adopt" would set an output no step
            wrote. Every output here is a scalar by design, so collapsing is
            both safe and the meaning.
            """
            v = str(v).replace("\r", " ").replace("\n", " ")
            with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
                fh.write("%s=%s\n" % (k, v))

        def read(p):
            """A certificate as a plain mapping. `cert check-dir` already said
            it is one; this only needs the values."""
            f = {}
            for line in p.read_text(encoding="utf-8").splitlines():
                k, _, v = line.partition(" ")
                f[k] = v
            return f

        class Entry:
            __slots__ = ("name", "path", "f")
            def __init__(self, name, path, f):
                self.name, self.path, self.f = name, path, f
            def __getitem__(self, k):
                try:
                    return self.f[k]
                except KeyError:
                    raise LedgerError("%s.cert carries no %s" % (self.name, k)) from None
            @property
            def seq(self): return int(self["seq"])
            @property
            def epoch(self): return int(self["epoch"])
            @property
            def counted(self):
                # A restore or a supersession is something that happened TO
                # the record, not an attempt the machine made. Scoring a
                # lineage for surviving an operator's override would reward
                # the wrong thing.
                return self["verdict"] in ("adopt", "refuse", "stale")
            @property
            def adopted(self): return self["verdict"] == "adopt"

        def entries_dir(root): return Path(root) / "loop/ledger/entries"

        def load(root):
            d = entries_dir(root)
            if not d.is_dir():
                return []
            es = []
            for p in sorted(d.iterdir()):
                if p.name.startswith("."):
                    continue
                if p.suffix != ".cert" or not p.is_file():
                    raise LedgerError("%s is under entries/ and is not a certificate" % p.name)
                es.append(Entry(p.stem, p, read(p)))
            es.sort(key=lambda e: e.seq)
            return es

        def count(root):
            d = entries_dir(root)
            return sum(1 for p in d.iterdir() if p.suffix == ".cert") if d.is_dir() else 0

        def fsck(root, epoch_len):
            es = load(root)

            for e in es:
                want = hashlib.sha256(e.path.read_bytes()).hexdigest()[:16]
                if e.name != want:
                    raise LedgerError(
                        "%s.cert names itself %s and hashes to %s: somebody edited a "
                        "certificate after it was filed" % (e.name, e.name, want))
                if not NAME16.match(e.name):
                    raise LedgerError("%s.cert is not named by a digest" % e.name)

            seqs = [e.seq for e in es]
            if seqs != list(range(1, len(es) + 1)):
                dupes = sorted({s for s in seqs if seqs.count(s) > 1})
                raise LedgerError(
                    "the sequence is %s and should be 1..%d%s"
                    % (seqs[:8], len(es), ("; repeated: %s" % dupes) if dupes else ""))

            for a, b in zip(es, es[1:]):
                if b["utc"] < a["utc"]:
                    raise LedgerError("seq %d is stamped %s, before seq %d at %s"
                                      % (b.seq, b["utc"], a.seq, a["utc"]))

            by_name = {e.name: e for e in es}
            for e in es:
                parent = e["lineage"]
                if parent == "root":
                    continue
                if parent not in by_name:
                    raise LedgerError("seq %d descends from %s, which is not in the ledger"
                                      % (e.seq, parent))
                if by_name[parent].seq >= e.seq:
                    raise LedgerError("seq %d descends from seq %d, which came after it"
                                      % (e.seq, by_name[parent].seq))
                if not by_name[parent].adopted:
                    raise LedgerError(
                        "seq %d descends from seq %d, which was %s: a tree that was never "
                        "adopted is not a state anything could have been built from"
                        % (e.seq, by_name[parent].seq, by_name[parent]["verdict"]))

            # --- the epoch claims ---------------------------------------
            if es and es[0].epoch != 0:
                raise LedgerError("seq 1 is in epoch %d; the record starts at epoch 0"
                                  % es[0].epoch)
            if es and es[0]["verdict"] == "amended":
                raise LedgerError("seq 1 is an amendment, and there is no judge before it "
                                  "to have amended")
            # epoch_len is part of the evaluator, so an amendment may have
            # changed it. Fill is checked only from the newest amendment on,
            # where the length in force is the one this was given; before it,
            # every other claim still holds and fill is not this reader's to know.
            since = max([i for i, e in enumerate(es) if e["verdict"] == "amended"], default=0)
            held = {}
            for i, e in enumerate(es):
                held[e.epoch] = held.get(e.epoch, 0) + 1
                if i >= since and held[e.epoch] > epoch_len:
                    raise LedgerError("epoch %d holds more than %d entries at seq %d"
                                      % (e.epoch, epoch_len, e.seq))
            for i, (a, b) in enumerate(zip(es, es[1:]), start=1):
                amended = b["verdict"] == "amended"
                if b.epoch == a.epoch:
                    if amended:
                        raise LedgerError(
                            "seq %d is an amendment inside epoch %d; an amendment is a new "
                            "judge, so it opens an epoch" % (b.seq, a.epoch))
                    if b["utility"] != a["utility"]:
                        raise LedgerError(
                            "seq %d and seq %d are both in epoch %d and were judged by "
                            "different evaluators; within an epoch the criterion is fixed"
                            % (a.seq, b.seq, a.epoch))
                    continue
                if b.epoch != a.epoch + 1:
                    raise LedgerError("the epoch jumps from %d to %d at seq %d"
                                      % (a.epoch, b.epoch, b.seq))
                if amended:
                    if b["utility"] == a["utility"]:
                        raise LedgerError(
                            "seq %d is an amendment that carries the evaluator seq %d already "
                            "had; it amends nothing" % (b.seq, a.seq))
                    continue
                if i > since and held[a.epoch] != epoch_len:
                    raise LedgerError(
                        "the epoch advances at seq %d, after %d entr%s of epoch %d and not "
                        "%d, and seq %d is not an amendment; the criterion may change only "
                        "at a boundary" % (b.seq, held[a.epoch],
                                           "y" if held[a.epoch] == 1 else "ies",
                                           a.epoch, epoch_len, b.seq))

            # --- the tried markers --------------------------------------
            td = Path(root) / "loop/ledger/tried"
            if td.is_dir():
                for p in sorted(td.iterdir()):
                    if p.name.startswith("."):
                        continue
                    if p.suffix != ".env":
                        raise LedgerError("%s is under tried/ and is not an envelope" % p.name)
                    got = hashlib.sha256(p.read_bytes()).hexdigest()
                    if p.stem != got[:16]:
                        raise LedgerError(
                            "tried/%s is named for a point the file does not hash to" % p.name)
            return es

        def position(es, epoch_len):
            """(the epoch the next entry takes under the same judge, whether the
            current epoch is full, the epoch an amendment filed now opens, how
            many entries the current epoch still takes)."""
            if not es:
                return 0, False, 0, epoch_len
            last = es[-1].epoch
            held = sum(1 for e in es if e.epoch == last)
            full = held >= epoch_len
            return (last + 1 if full else last), full, last + 1, max(0, epoch_len - held)

        def tip(es):
            for e in reversed(es):
                if e.adopted:
                    return e.name
            return "root"

        def tail(es, n):
            es = es[-n:]
            if not es:
                return "(the ledger is empty)"
            short = {"clonal": "cl", "reaction-norm": "rn", "cross-lineage": "xl", "-": "-"}
            rows = [("seq", "utc", "kind", "lane", "op", "moved", "verdict", "why")]
            for e in es:
                rows.append((str(e.seq), e["utc"][5:16].replace("T", " "), e["kind"][:10],
                             e["lane"][:8], short.get(e["operator"], "?"), e["moved"][:8],
                             e["verdict"][:10], e["why"][:52]))
            w = [max(len(r[i]) for r in rows) for i in range(len(rows[0]))]
            return "\n".join("  ".join(c.ljust(x) for c, x in zip(r, w)).rstrip() for r in rows)

        # ------------------------------------------------------------------

        def selftest():
            import tempfile
            ok = fail = 0
            def claim(s, held, detail=""):
                nonlocal ok, fail
                if held: ok += 1; print("  ok   " + s)
                else:
                    fail += 1; print("  FAIL " + s)
                    if detail: print("         " + str(detail))
            def raises(s, fn):
                try: fn()
                except LedgerError: return claim(s, True)
                except Exception as exc: return claim(s, False, "wrong error: %r" % exc)
                return claim(s, False, "it returned instead of refusing")

            FIELDS = ("version seq utc point kind lane operator lineage epoch utility rung axis "
                      "ladder parent-tree candidate-tree rail corpus alpha-k bar fdr minutes half "
                      "level trials queries suites claims checks witness moved effect interval q "
                      "why verdict runner").split()
            BASE = dict(version="2", seq="1", utc="2026-01-02T03:04:05Z", point="a"*64,
                        kind="repair", lane="model", operator="clonal", lineage="root",
                        epoch="0", utility="b"*64, rung="1", axis="grid", ladder="-",
                        **{"parent-tree": "c"*40, "candidate-tree": "d"*40},
                        rail="none", corpus="0123abcd", **{"alpha-k": "0"}, bar="-", fdr="-",
                        minutes="45", half="extend", level="0", trials="1", queries="0",
                        suites="-", claims="-", checks="-", witness="-", moved="-",
                        effect="-", interval="-", q="-", why="a scratch entry",
                        verdict="refuse", runner="1/1")

            def write(root, **over):
                f = dict(BASE); f["seq"] = str(count(root) + 1); f.update(over)
                f.setdefault("point", hashlib.sha256(repr(sorted(f.items())).encode()).hexdigest())
                f["point"] = hashlib.sha256(repr(sorted(f.items())).encode()).hexdigest()
                text = "\n".join("%s %s" % (k, f[k]) for k in FIELDS) + "\n"
                name = hashlib.sha256(text.encode()).hexdigest()[:16]
                d = entries_dir(root); d.mkdir(parents=True, exist_ok=True)
                (d / (name + ".cert")).write_text(text, encoding="utf-8")
                return name

            with tempfile.TemporaryDirectory() as td:
                claim("an absent ledger holds nothing rather than failing", count(td) == 0)
                claim("fsck is happy with nothing", fsck(td, 16) == [])
                a = write(td, verdict="adopt")
                write(td, lineage=a)
                claim("entries load in sequence order", [e.seq for e in load(td)] == [1, 2])
                claim("fsck accepts a well-formed ledger", len(fsck(td, 16)) == 2)
                claim("the tip is the newest adopted entry", tip(load(td)) == a)
                p = entries_dir(td) / (sorted(x.name for x in entries_dir(td).iterdir())[0])
                p.write_text(p.read_text().replace("trials 1", "trials 9"))
                raises("a corrupted ledger halts the night rather than being reasoned from",
                       lambda: fsck(td, 16))

            with tempfile.TemporaryDirectory() as td:
                write(td); write(td, seq="3")
                raises("a gap in the sequence is refused", lambda: fsck(td, 16))
            with tempfile.TemporaryDirectory() as td:
                write(td, utc="2026-02-02T00:00:00Z"); write(td, utc="2026-01-01T00:00:00Z")
                raises("an entry stamped before its predecessor is refused", lambda: fsck(td, 16))
            with tempfile.TemporaryDirectory() as td:
                write(td, lineage="0"*16)
                raises("descent from an entry that does not exist is refused", lambda: fsck(td, 16))
            with tempfile.TemporaryDirectory() as td:
                a = write(td, verdict="refuse"); write(td, lineage=a)
                raises("descent from a tree that was never adopted is refused",
                       lambda: fsck(td, 16))
            with tempfile.TemporaryDirectory() as td:
                write(td); write(td, utility="e"*64)
                raises("two evaluators inside one epoch is refused: within an epoch the bar is fixed",
                       lambda: fsck(td, 16))
            with tempfile.TemporaryDirectory() as td:
                write(td); write(td, epoch="1", utility="e"*64)
                raises("the criterion may not change away from an epoch boundary",
                       lambda: fsck(td, 16))
                claim("at a boundary of one, it may", len(fsck(td, 1)) == 2)
            with tempfile.TemporaryDirectory() as td:
                write(td); write(td, epoch="2", utility="e"*64)
                raises("an epoch that skips a number is refused", lambda: fsck(td, 1))
            AM = dict(verdict="amended", lane="event", kind="event")
            with tempfile.TemporaryDirectory() as td:
                write(td); write(td, epoch="1", utility="e"*64, **AM)
                claim("an amendment opens an epoch wherever it arrives", len(fsck(td, 16)) == 2)
                claim("and the next entry joins it, under the new judge",
                      position(load(td), 16) == (1, False, 2, 15))
                write(td, epoch="1", utility="e"*64)
                claim("so the entry after it is in epoch 1", len(fsck(td, 16)) == 3)
            with tempfile.TemporaryDirectory() as td:
                write(td); write(td, utility="e"*64, **AM)
                raises("an amendment inside an epoch is refused", lambda: fsck(td, 16))
            with tempfile.TemporaryDirectory() as td:
                write(td); write(td, epoch="1", **AM)
                raises("an amendment that changes nothing is refused", lambda: fsck(td, 16))
            with tempfile.TemporaryDirectory() as td:
                write(td, **AM)
                raises("an amendment with nothing before it is refused", lambda: fsck(td, 16))
            with tempfile.TemporaryDirectory() as td:
                write(td, epoch="1")
                raises("a record that does not start at epoch 0 is refused", lambda: fsck(td, 16))
            with tempfile.TemporaryDirectory() as td:
                write(td); write(td); write(td)
                raises("an epoch fuller than its length is refused", lambda: fsck(td, 2))
            with tempfile.TemporaryDirectory() as td:
                write(td); write(td, epoch="1", utility="e"*64, **AM)
                write(td, epoch="1", utility="e"*64)
                write(td, epoch="2", utility="e"*64)
                claim("epochs are counted from their first entry, not from seq 1",
                      len(fsck(td, 2)) == 4)
            with tempfile.TemporaryDirectory() as td:
                write(td); write(td, epoch="1", utility="e"*64, **AM)
                write(td, epoch="2", utility="e"*64)
                raises("an epoch opened by an amendment still fills before it closes",
                       lambda: fsck(td, 2))
            with tempfile.TemporaryDirectory() as td:
                write(td); write(td); write(td, epoch="1"); write(td, epoch="1")
                write(td, epoch="2", utility="e"*64, **AM)
                claim("an amendment that changed epoch_len does not unmake the epochs "
                      "written under the old one", len(fsck(td, 3)) == 5)
                claim("a full epoch is a boundary", position(load(td)[:4], 2) == (2, True, 2, 0))

            with tempfile.TemporaryDirectory() as td:
                d = Path(td) / "loop/ledger/tried"; d.mkdir(parents=True)
                (d / ("0"*16 + ".env")).write_bytes(b"not what this names")
                raises("a tried marker that is not the envelope it names is refused",
                       lambda: fsck(td, 16))

            with tempfile.TemporaryDirectory() as td:
                claim("genesis is not an epoch boundary",
                      position(load(td), 16) == (0, False, 0, 16))
                for _ in range(16):
                    write(td)
                claim("sixteen entries is one", position(load(td), 16) == (1, True, 1, 0))
                write(td, epoch="1")
                claim("seventeen is not, and the seventeenth entry was epoch one",
                      position(load(td), 16) == (1, False, 2, 15) and len(fsck(td, 16)) == 17)
            print("\n%d/%d claims held" % (ok, ok + fail))
            return 1 if fail else 0

        cmd = os.environ["COMMAND"].strip()
        root = os.environ.get("ROOT", ".")
        epoch_len = int(os.environ.get("EPOCH_LEN", "16") or "16")
        try:
            if cmd == "selftest":
                sys.exit(selftest())
            if cmd == "fsck":
                es = fsck(root, epoch_len)
                n = len(es)
                print("  the ledger holds %d entr%s and every claim it makes about itself holds"
                      % (n, "y" if n == 1 else "ies"))
            else:
                es = load(root)
                n = len(es)
            if cmd == "tail":
                text = tail(es, int(os.environ.get("TAIL_N", "10") or "10"))
                print(text)
                # And to a file, for the same reason ladder's progress is.
                Path("ledger-tail.txt").write_text(text + "\n", encoding="utf-8")
            elif cmd == "report":
                adopted = sum(1 for e in es if e.adopted)
                counted = sum(1 for e in es if e.counted)
                print("  %d entries, %d counted trials, %d adopted, epoch %d"
                      % (n, counted, adopted, es[-1].epoch if es else 0))
                print(tail(es, 10))
            elif cmd not in ("fsck", "count", "seq"):
                raise LedgerError("no such command: %r" % cmd)
            out("count", str(n))
            out("seq", str(n + 1))
            # Genesis is deliberately not a boundary. A criterion with no track
            # record to gate against is a criterion nothing has tested, and
            # letting the first evaluator change through for free is the one
            # moment the gate would have cost nothing to pass.
            nxt, full, amend, to_go = position(es, epoch_len)
            out("epoch", str(nxt))
            out("boundary", "yes" if full else "no")
            out("utility", es[-1]["utility"] if es else "")
            out("amend_epoch", str(amend))
            out("to_go", str(to_go))
            out("tip", tip(es))
            out("why", "")
        except LedgerError as exc:
            print("::error::ledger %s: %s" % (cmd, exc))
            out("why", str(exc))
            sys.exit(1)
        PYEOF
