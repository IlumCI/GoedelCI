name: proof

# **Two drills, end to end, with no model and no pushes.**
#
# Every action in this template proves itself against its own claims, and that
# is not the same as the machine working. A claim suite cannot see a seam: an
# envelope derived from the wrong tree, a step output nobody reads, a
# certificate field the judge fills and the ledger refuses. Every one of those
# has been a real bug here, and none of them was catchable by any unit claim.
#
# So this runs a whole night against a candidate written by hand, twice:
#
#   adopted    a candidate that adds a module and a test. It must derive
#              reproducibly, pass both arms, add claims, and end in a
#              certificate `cert check` accepts and `adopt-decide` lands on
#              the CANDIDATE's tree.
#
#   refused    the same shape, with the module deliberately broken. It must
#              end `verdict refuse` with the failure named in `why`, in a
#              certificate that is still a certificate, which `adopt-decide`
#              lands on the LIVE tree.
#
# The second drill is the one that matters, and it is the one the original of
# this machine could not run: a candidate that would not build took the judge
# job down, so the drill's expected outcome was a red run -- which is
# indistinguishable from the drill itself being broken. Under a schedule that
# is a silent stall, because a red job files nothing and the milestone that
# produced it never moves.
#
# Nothing here writes to a branch. The certificates are rendered, checked and
# thrown away.

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]
  schedule:
    # Weekly. The drills are cheap and the thing they guard against is drift
    # between actions that each still pass their own claims.
    - cron: "41 5 * * 1"

permissions:
  contents: read

concurrency:
  group: proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --- the claims no single night can make -------------------------------
  #
  # The epoch rules are claims about a SEQUENCE of certificates: that entries
  # within one epoch agree about which judge decided them, that the epoch
  # advances by exactly one, and that it does so only at a boundary. No night
  # can check any of those, because each night writes one entry. So this files
  # a whole run of them the way `adopt` does and asks `fsck`.
  #
  # It earns its place: the digest a certificate carried was computed over the
  # masks that say what the machine may not WRITE, which include the record --
  # so it changed every night, every entry in an epoch disagreed, and the
  # second night the loop ever had would have turned the branch red with a
  # corrupt ledger. Nothing else here could have found that.
  ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: File a run of nights, across three epochs
        shell: bash
        env:
          EPOCH_LEN: "4"
          NIGHTS: "10"
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import hashlib, os
          from pathlib import Path

          FIELDS = ("version seq utc point kind lane operator lineage epoch utility rung "
                    "axis ladder parent-tree candidate-tree rail corpus alpha-k bar fdr "
                    "minutes half level trials queries suites claims checks witness moved "
                    "effect interval q why verdict runner").split()

          length = int(os.environ["EPOCH_LEN"])
          nights = int(os.environ["NIGHTS"])
          root = Path("proof-ledger")
          entries = root / "loop/ledger/entries"
          entries.mkdir(parents=True)

          utility, lineage, tree = "b" * 64, "root", "c" * 40

          def file_one(n, **over):
              epoch = n // length
              f = dict(version="2", seq=str(n + 1), utc="2026-09-%02dT00:00:00Z" % (n + 2),
                       point=hashlib.sha256(b"p%d" % n).hexdigest(), kind="feature",
                       lane="model", operator="clonal", lineage=lineage, epoch=str(epoch),
                       utility=utility, rung="1", axis="src/a.py", ladder="-",
                       rail="none", corpus="0123abcd", bar="-", fdr="-", minutes="30",
                       half="extend", level="0", trials="3", queries="0", suites="-",
                       checks="-", witness="-", moved="-", effect="-", interval="-",
                       q="-", why="a night", runner="1/1")
              f["parent-tree"] = tree
              f["alpha-k"] = "0"
              f.update(over)
              text = "\n".join("%s %s" % (k, f[k]) for k in FIELDS) + "\n"
              name = hashlib.sha256(text.encode("utf-8")).hexdigest()[:16]
              (entries / (name + ".cert")).write_text(text, encoding="utf-8")
              return name, f

          for i in range(nights):
              n = len(list(entries.glob("*.cert")))
              # The evaluator may change ONLY at a boundary. Everywhere else in
              # this machine that is enforced; here it is exercised.
              if n and n % length == 0:
                  utility = hashlib.sha256(b"judge-%d" % (n // length)).hexdigest()
              adopt = i % 3 != 0
              cand = hashlib.sha256(b"t%d" % i).hexdigest()[:40] if adopt else "-"
              name, f = file_one(n, verdict="adopt" if adopt else "refuse",
                                 claims="6/7" if adopt else "6/6",
                                 **{"candidate-tree": cand})
              if adopt:
                  lineage, tree = name, cand
          print("  %d certificate(s) filed across %d epoch(s)"
                % (nights, (nights - 1) // length + 1))
          PYEOF

      - uses: ./.github/actions/cert
        with:
          command: check-dir
          dir: proof-ledger/loop/ledger/entries

      - name: And the record holds together
        uses: ./.github/actions/ledger
        with:
          command: fsck
          root: proof-ledger
          epoch-len: "4"

      - uses: ./.github/actions/archive
        with:
          command: report
          root: proof-ledger

      # **The negative, because a gate that has never refused is not known to
      # be one.** Moving a single entry's digest inside its epoch is exactly
      # the shape the real bug had, and fsck must refuse it by name.
      - name: A judge that changed mid-epoch is refused
        shell: bash
        run: |
          set -euo pipefail
          # **A REFUSED entry in the first epoch, and the choice is not
          # incidental.** Editing an entry changes its digest, so it has to be
          # renamed -- and renaming an ADOPTED one dangles the lineage of
          # everything descended from it, so fsck refuses for that instead and
          # the drill passes without ever reaching the rule it is about. A
          # refusal is never anybody's lineage parent, so moving its digest
          # leaves exactly one thing wrong with the ledger.
          d=proof-ledger/loop/ledger/entries
          f=$(grep -l '^epoch 0$' "$d"/*.cert | xargs grep -l '^verdict refuse$' | head -1)
          test -n "$f" || { echo "::error::the fixture filed no refusal in epoch 0"; exit 1; }
          sed -i "s/^utility .*/utility $(printf 'e%.0s' $(seq 64))/" "$f"
          mv "$f" "$d/$(sha256sum "$f" | cut -c1-16).cert"
          echo "  $(basename "$f") now claims a different judge, inside epoch 0"

      - id: refused
        continue-on-error: true
        uses: ./.github/actions/ledger
        with:
          command: fsck
          root: proof-ledger
          epoch-len: "4"

      - name: It must have refused, and for the right reason
        shell: bash
        env:
          OUTCOME: ${{ steps.refused.outcome }}
          REASON: ${{ steps.refused.outputs.why }}
        run: |
          set -euo pipefail
          if [ "$OUTCOME" != "failure" ]; then
            echo "::error::fsck accepted a ledger whose judge changed inside an epoch."
            echo "::error::That is the invariant the whole epoch mechanism rests on, and"
            echo "::error::a gate that has never refused is not known to be one."
            exit 1
          fi
          # And for the right reason. A refusal that fired on some other rule
          # would leave this one untested while reading green, which is the
          # failure mode a negative drill is supposed to not have.
          if ! printf '%s' "$REASON" | grep -q 'different evaluators'; then
            echo "::error::fsck refused, but not for the epoch rule: $REASON"
            exit 1
          fi
          echo "  fsck refused it by name, which is what makes the epoch rules real"

  drill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arm: pass
            want: adopt
          - arm: fail
            want: refuse
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }

      - id: cfg
        uses: ./.github/actions/config
        with: { command: load }

      # **The probe comes out of `goedel.toml`, so the drills survive
      # adoption.** They used to write a Python module under `src/` -- this
      # repository's own masks -- and skip once an adopter repointed them,
      # which lost the only test that exercises the seams exactly when the
      # machine started being used for something. `[proof]` declares two
      # variants of the same change, and `config` refuses a pair that differs
      # in anything but what the code does.
      - id: applicable
        shell: bash
        env:
          HAVE: ${{ steps.cfg.outputs.proof }}
        run: |
          set -euo pipefail
          if [ "$HAVE" != "yes" ]; then
            echo "::notice::goedel.toml declares no [proof] probe, so there is nothing to"
            echo "::notice::rehearse. Adding one is twenty lines and it is the only test"
            echo "::notice::that covers the seams between the actions."
          fi
          echo "run=$HAVE" >> "$GITHUB_OUTPUT"

      - name: A candidate, as draft would have written one
        id: write
        if: steps.applicable.outputs.run == 'yes'
        shell: bash
        env:
          ARM: ${{ matrix.arm }}
          CFG: ${{ steps.cfg.outputs.json }}
        run: |
          set -euo pipefail
          git config user.name "proof"; git config user.email "proof@local"
          echo "PARENT=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_ENV"

          python3 - <<'PYEOF'
          import json, os, subprocess
          from pathlib import Path

          cfg = json.loads(Path(os.environ["CFG"]).read_text(encoding="utf-8"))
          probe = cfg["proof"]
          files = probe[os.environ["ARM"]]

          for rel, body in sorted(files.items()):
              p = Path(rel)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(body.lstrip("\n"), encoding="utf-8")

          paths = sorted(files)
          # `add -N` so the new files appear in `git diff` without being
          # staged. The patch a real draft produces comes from exactly this.
          subprocess.run(["git", "add", "-N", "--"] + paths, check=True)
          patch = subprocess.run(["git", "diff", "--"] + paths, check=True,
                                 capture_output=True, text=True).stdout
          subprocess.run(["git", "reset", "-q"], check=True)
          for rel in paths:
              Path(rel).unlink(missing_ok=True)

          parent = subprocess.run(["git", "rev-parse", "HEAD^{tree}"], check=True,
                                  capture_output=True, text=True).stdout.strip()
          kind = cfg["kinds"][probe["kind"]]
          head = [
              "[envelope] v2", "kind " + probe["kind"], "verb " + kind["verb"],
              "target " + probe["target"], "lane model", "axis " + probe["target"],
              "rung 1", "corpus 00000000", "parent-tree " + parent,
              "operator clonal", "lineage root", "seed 0", "witness -",
              "title the %s drill" % os.environ["ARM"],
          ]
          text = "\n".join(head + ["[patch]", patch.rstrip("\n"), "[end]", ""])
          Path("envelope.env").write_text(text, encoding="utf-8")

          import hashlib
          point = hashlib.sha256(text.encode("utf-8")).hexdigest()
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fh:
              fh.write("POINT=%s\n" % point)
              fh.write("PROBE_KIND=%s\n" % probe["kind"])
              fh.write("PROBE_TARGET=%s\n" % probe["target"])
          print("  %s: %d file(s), point %s" % (os.environ["ARM"], len(paths), point[:16]))
          PYEOF

      # Admission is the gate that runs before a runner is spent, so a drill
      # that skipped it would be proving a path no night takes.
      - uses: ./.github/actions/envelope
        if: steps.applicable.outputs.run == 'yes'
        with:
          command: admit
          file: envelope.env
          config: ${{ steps.cfg.outputs.json }}

      - name: Mark it tried, exactly as stage does
        if: steps.applicable.outputs.run == 'yes'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p loop/ledger/tried
          cp envelope.env "loop/ledger/tried/${POINT:0:16}.env"
          git add loop/ledger/tried
          git commit -q -m "proof: tried ${POINT:0:16}"
          echo "MARKED=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_ENV"

      - id: derive
        if: steps.applicable.outputs.run == 'yes'
        uses: ./.github/actions/envelope
        with:
          command: derive
          file: envelope.env
          parent: ${{ env.MARKED }}

      # The claim the judge makes before it spends a test run, made here too:
      # deriving twice from the same tree gives the same tree. If it does not,
      # nothing downstream means anything.
      - id: rederive
        if: steps.applicable.outputs.run == 'yes'
        uses: ./.github/actions/envelope
        with:
          command: derive
          file: envelope.env
          parent: ${{ env.MARKED }}

      - name: The candidate is reproducible from the envelope alone
        if: steps.applicable.outputs.run == 'yes'
        shell: bash
        env:
          A: ${{ steps.derive.outputs.tree }}
          B: ${{ steps.rederive.outputs.tree }}
        run: |
          set -euo pipefail
          test "$A" = "$B" || { echo "::error::derive is not deterministic: $A vs $B"; exit 1; }
          test "$A" != "$MARKED" || { echo "::error::the patch changed nothing"; exit 1; }
          echo "CAND_TREE=$A" >> "$GITHUB_ENV"
          echo "  ${A:0:12}, twice"

      - id: base
        if: steps.applicable.outputs.run == 'yes'
        uses: ./.github/actions/harness
        with:
          command: run
          config: ${{ steps.cfg.outputs.json }}
          arm: a
          repeats: "1"

      - name: Become the candidate
        if: steps.applicable.outputs.run == 'yes'
        shell: bash
        run: |
          set -euo pipefail
          c=$(git commit-tree "$CAND_TREE" -p HEAD -m "proof: candidate")
          git checkout -qf --detach "$c"
          echo "CAND_REF=$c" >> "$GITHUB_ENV"
          test -f "$PROBE_TARGET" \
            || { echo "::error::the candidate tree is missing $PROBE_TARGET"; exit 1; }

      - id: cand
        if: steps.applicable.outputs.run == 'yes'
        continue-on-error: true
        uses: ./.github/actions/harness
        with:
          command: run
          config: ${{ steps.cfg.outputs.json }}
          arm: b
          repeats: "1"

      - id: rails
        if: steps.applicable.outputs.run == 'yes'
        uses: ./.github/actions/rails
        with:
          command: judge
          before: rails-a.txt
          after: rails-b.txt
          claims: "none"
          kind: ${{ env.PROBE_KIND }}
          config: ${{ steps.cfg.outputs.json }}
          seed: ${{ env.POINT }}

      - id: verdict
        if: steps.applicable.outputs.run == 'yes'
        shell: bash
        env:
          A_CLAIMS: ${{ steps.base.outputs.claims }}
          B_CLAIMS: ${{ steps.cand.outputs.claims }}
          B_TESTED: ${{ steps.cand.outputs.tested }}
          B_BUILT: ${{ steps.cand.outputs.built }}
          B_WHY: ${{ steps.cand.outputs.why }}
          WORSE: ${{ steps.rails.outputs.worse }}
        run: |
          set -euo pipefail
          if [ "$B_BUILT" != "yes" ]; then
            echo "verdict=refuse" >> "$GITHUB_OUTPUT"
            echo "why=the candidate did not build: $B_WHY" >> "$GITHUB_OUTPUT"
          elif [ "$B_TESTED" != "yes" ]; then
            echo "verdict=refuse" >> "$GITHUB_OUTPUT"
            echo "why=the candidate built and its tests did not pass: $B_WHY" >> "$GITHUB_OUTPUT"
          elif [ "${WORSE:-0}" != "0" ]; then
            echo "verdict=refuse" >> "$GITHUB_OUTPUT"
            echo "why=$WORSE rail(s) regressed" >> "$GITHUB_OUTPUT"
          elif [ "$B_CLAIMS" -le "$A_CLAIMS" ]; then
            echo "verdict=refuse" >> "$GITHUB_OUTPUT"
            echo "why=a feature that adds no claim is code nothing exercises" >> "$GITHUB_OUTPUT"
          else
            echo "verdict=adopt" >> "$GITHUB_OUTPUT"
            echo "why=it builds, it passes, it added $((B_CLAIMS - A_CLAIMS)) claim(s)" >> "$GITHUB_OUTPUT"
          fi
          echo "counts=$A_CLAIMS/$B_CLAIMS" >> "$GITHUB_OUTPUT"
          echo "NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      # A refused trial's certificate carries `-` for what nobody could count,
      # and the counts otherwise. `cert emit` checks its own output, so a
      # combination the ledger would refuse cannot be rendered here either.
      - id: cert
        if: steps.applicable.outputs.run == 'yes'
        uses: ./.github/actions/cert
        with:
          command: emit
          out: certificate.cert
          set: |
            seq=1
            utc=${{ env.NOW }}
            point=${{ env.POINT }}
            kind=${{ env.PROBE_KIND }}
            lane=model
            operator=clonal
            lineage=root
            epoch=0
            utility=${{ steps.cfg.outputs.utility }}
            rung=1
            axis=${{ env.PROBE_TARGET }}
            parent-tree=${{ env.MARKED }}
            candidate-tree=${{ env.CAND_TREE }}
            rail=none
            corpus=00000000
            claims=${{ steps.verdict.outputs.counts }}
            why=${{ steps.verdict.outputs.why }}
            verdict=${{ steps.verdict.outputs.verdict }}
            runner=${{ github.run_id }}/${{ github.run_attempt }}

      - uses: ./.github/actions/cert
        if: steps.applicable.outputs.run == 'yes'
        with:
          command: check
          file: certificate.cert

      - id: decide
        if: steps.applicable.outputs.run == 'yes'
        uses: ./.github/actions/adopt-decide
        with:
          command: decide
          cert: certificate.cert
          live: ${{ env.MARKED }}

      - name: The drill must have ended the way it was written to
        if: steps.applicable.outputs.run == 'yes'
        shell: bash
        env:
          GOT: ${{ steps.verdict.outputs.verdict }}
          WANT: ${{ matrix.want }}
          WHY: ${{ steps.verdict.outputs.why }}
          BASE: ${{ steps.decide.outputs.base }}
          DECIDED: ${{ steps.decide.outputs.verdict }}
          ARM: ${{ matrix.arm }}
        run: |
          set -euo pipefail
          echo "  verdict $GOT: $WHY"
          if [ "$GOT" != "$WANT" ]; then
            echo "::error::the $ARM drill wanted $WANT and got $GOT -- $WHY"
            exit 1
          fi
          if [ "$DECIDED" != "$WANT" ]; then
            echo "::error::adopt-decide turned $WANT into $DECIDED against an unmoved tip"
            exit 1
          fi
          # **The claim the refusal drill exists for.** A refusal that built on
          # the candidate's tree would adopt exactly what was refused, and the
          # only way to see that is to check which tree came back.
          if [ "$WANT" = "adopt" ] && [ "$BASE" != "$CAND_TREE" ]; then
            echo "::error::an adoption built on $BASE, not on the candidate's tree"
            exit 1
          fi
          if [ "$WANT" = "refuse" ] && [ "$BASE" != "$MARKED" ]; then
            echo "::error::a REFUSAL built on $BASE rather than the live tree."
            echo "::error::That would file the code that was just refused."
            exit 1
          fi
          echo "  and adopt-decide put it on ${BASE:0:12}, which is the right tree"

      # The staleness case has no runner in it -- it is a pure function of two
      # trees -- so it is asserted here against the same certificate rather
      # than given a drill of its own.
      - id: stale
        if: steps.applicable.outputs.run == 'yes'
        uses: ./.github/actions/adopt-decide
        with:
          command: decide
          cert: certificate.cert
          live: "0000000000000000000000000000000000000000"

      - name: And a tip that moved is stale, whatever the verdict said
        if: steps.applicable.outputs.run == 'yes'
        shell: bash
        env:
          V: ${{ steps.stale.outputs.verdict }}
          WANT: ${{ matrix.want }}
        run: |
          set -euo pipefail
          test "$V" = "stale" || { echo "::error::a moved tip answered $V"; exit 1; }
          echo "  a moved tip is stale, and this drill's verdict was $WANT"

      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: proof-${{ matrix.arm }}
          path: |
            certificate.cert
            envelope.env
            judged.txt
            rails-*.txt
            harness-*.log
          if-no-files-found: ignore
          retention-days: 30
