name: loop-judge

# The two-arm gate. One runner, one checkout, both arms -- anything else
# compares two machines and calls the difference an effect.
#
# It holds NO secrets and asks for `contents: read`, deliberately: the judge is
# the part of the loop most exposed to the candidate's own content, because it
# builds and runs it. So it is the part least entitled to authority. The
# verdict becomes real only when `loop-night`'s adopt job -- which never runs
# candidate code -- commits the certificate.
#
# **A candidate that does not build is a REFUSAL, not a red run.** A red job
# files no certificate, so the milestone that produced it never moves; under a
# schedule that is a silent stall where the same broken file is drafted every
# night forever. The BASELINE's build stays fatal, deliberately: a baseline
# that will not build is the runner or the branch being wrong, not the
# candidate, and blaming a candidate for infrastructure is a mistake that looks
# exactly like a verdict.
#
# CONSUMER: loop-night.adopt (the certificate artifact), and anybody reading a
# refused night.

on:
  workflow_call:
    inputs:
      point:          { type: string, required: true }
      baseline_ref:   { type: string, required: true }
      candidate_ref:  { type: string, required: true }
      kind:           { type: string, required: true }
      seq:            { type: string, required: true }
      epoch:          { type: string, required: true }
      utility:        { type: string, required: true }
      lineage:        { type: string, required: true }
      operator:       { type: string, required: true }
      author:         { type: string, required: false, default: "-" }
      rung:           { type: string, required: true }
      axis:           { type: string, required: true }
      corpus:         { type: string, required: true }
      rail:           { type: string, required: false, default: "none" }
      minutes:        { type: string, required: true }
      repeats:        { type: string, required: true }
      level:          { type: string, required: true }
      half:           { type: string, required: true }
      alpha_k:        { type: string, required: true }
      # Empty when this night was not the ladder's work. A certificate of some
      # other lane's claiming the milestone would retire it for something it
      # never tried.
      ladder:         { type: string, required: false, default: "" }
  workflow_dispatch:
    inputs:
      point:         { required: true }
      baseline_ref:  { required: true }
      candidate_ref: { required: true }
      kind:          { required: true }
      seq:           { required: true, default: "1" }
      epoch:         { required: true, default: "0" }
      utility:       { required: true }
      lineage:       { required: true, default: "root" }
      operator:      { required: true, default: "clonal" }
      author:        { required: false, default: "-" }
      rung:          { required: true, default: "1" }
      axis:          { required: true, default: "none" }
      corpus:        { required: true, default: "00000000" }
      rail:          { required: false, default: "none" }
      minutes:       { required: true, default: "45" }
      repeats:       { required: true, default: "3" }
      level:         { required: true, default: "0" }
      half:          { required: true, default: "extend" }
      alpha_k:       { required: true, default: "0" }

permissions:
  contents: read

jobs:
  judge:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(inputs.minutes) }}
    env:
      POINT: ${{ inputs.point }}
      BASE_REF: ${{ inputs.baseline_ref }}
      CAND_REF: ${{ inputs.candidate_ref }}
      KIND: ${{ inputs.kind }}
      RAIL: ${{ inputs.rail }}
      LEVEL: ${{ inputs.level }}
      REPEATS: ${{ inputs.repeats }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.baseline_ref }}
          # Full history: the candidate ref must be fetchable and the parent
          # tree must exist for the derive assertion below.
          fetch-depth: 0

      # One timestamp for the whole trial, taken before either arm runs. Taken
      # at certificate time instead, it would record when the rendering
      # happened rather than when the question was asked -- and the ledger
      # orders entries by it.
      - name: When this trial was asked
        shell: bash
        run: echo "NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - id: cfg
        uses: ./.github/actions/config
        with: { command: load }

      # **What this kind is, read from the config rather than spelled out
      # here.** The witness arm was gated on `env.KIND == 'repair' || == 'test'`
      # -- two names this file had no business knowing. A project that calls its
      # witnessed kind `bugfix` got no witness arm and every one of its
      # candidates was refused for "the witness arm was never run", which is a
      # sentence about a step that was skipped by a string comparison.
      #
      # The rail is read the same way, and for a worse reason: nothing passed
      # one, so a `rail` kind's claimed measurement never reached the
      # comparison, `moved` came back `-`, and every rail kind refused forever.
      - id: kind
        shell: bash
        env:
          CFG: ${{ steps.cfg.outputs.json }}
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import json, os
          from pathlib import Path
          cfg = json.loads(Path(os.environ["CFG"]).read_text(encoding="utf-8"))
          name = os.environ["KIND"]
          if name not in cfg["kinds"]:
              print("::error::%r is not a kind this project has" % name)
              raise SystemExit(1)
          k = cfg["kinds"][name]
          rail = k["rail"] if k["j1"] == "rail" else os.environ.get("RAIL", "none")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write("j1=%s\n" % k["j1"])
              fh.write("witness=%s\n" % ("yes" if k["j1"] == "witness" else "no"))
              fh.write("rail=%s\n" % (rail or "none"))
          print("  kind %s: j1 %s, rail %s" % (name, k["j1"], rail or "none"))
          PYEOF

      # The envelope is already on the branch -- the marker was committed
      # before the trial, by construction -- and it is re-admitted here even
      # though propose admitted it, because this job is about to RUN what it
      # describes and defence in depth is cheap.
      - name: Read the envelope back off its marker
        shell: bash
        run: |
          set -euo pipefail
          f="loop/ledger/tried/${POINT:0:16}.env"
          test -f "$f" || { echo "::error::no tried marker for $POINT"; exit 1; }
          got=$(sha256sum "$f" | cut -d' ' -f1)
          test "$got" = "$POINT" \
            || { echo "::error::the marker is not the envelope the point names"; exit 1; }
          echo "ENV_FILE=$f" >> "$GITHUB_ENV"
          echo "PARENT_TREE=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_ENV"

      # **Admitted without a parent check, deliberately.** The envelope records
      # the tree the DRAFTER saw; between drafting and judging, `stage` commits
      # the tried marker, so the tree here is that one plus a file under
      # `loop/ledger/tried/` -- a path no patch may touch. Asserting they are
      # equal would refuse every candidate the loop ever produces.
      #
      # Nothing is lost by dropping it, because the binding claim is the next
      # step's and it is strictly stronger: the candidate ref's tree must be
      # exactly apply(the tree HERE, this patch). A candidate carrying anything
      # else, however it got there, is not the proposal the marker records.
      - name: And re-admit it before anything runs it
        uses: ./.github/actions/envelope
        with:
          command: admit
          file: ${{ env.ENV_FILE }}
          config: ${{ steps.cfg.outputs.json }}

      # **The candidate's tree must be exactly apply(parent, patch)** before a
      # test run is spent on it. A candidate ref carrying anything else --
      # however it got there -- is not the proposal the marker records.
      - id: derive
        uses: ./.github/actions/envelope
        with:
          command: derive
          file: ${{ env.ENV_FILE }}
          parent: ${{ env.PARENT_TREE }}

      - name: The candidate is what the envelope says, bit for bit
        shell: bash
        env:
          WANT: ${{ steps.derive.outputs.tree }}
        run: |
          set -euo pipefail
          got=$(git rev-parse "$CAND_REF^{tree}")
          if [ "$WANT" != "$got" ]; then
            echo "::error::the candidate tree is $got, the envelope derives $WANT"
            exit 1
          fi
          echo "CAND_TREE=$got" >> "$GITHUB_ENV"

      # --- the baseline arm ------------------------------------------------

      # Counts only. The timing rails are taken later, by alternating between
      # the two trees, so that the clock is not one of the things being
      # compared -- see bench-pair/action.yml.
      - id: base
        uses: ./.github/actions/harness
        with:
          command: run
          config: ${{ steps.cfg.outputs.json }}
          arm: a
          repeats: "1"
          skip-bench: "true"

      - name: A baseline that does not build is the branch, not the candidate
        shell: bash
        env:
          BUILT: ${{ steps.base.outputs.built }}
          WHY: ${{ steps.base.outputs.why }}
        run: |
          set -euo pipefail
          if [ "$BUILT" != "yes" ]; then
            echo "::error::the BASELINE did not build: $WHY"
            echo "::error::nothing can be judged against it, and the candidate is not to blame"
            exit 1
          fi

      # --- the witness arm, for the kinds whose J1 it is -------------------
      #
      # The three-tree shape: the witness applied to the BASELINE must FAIL --
      # genuinely, as a test failure with the harness still answering, not as a
      # build death -- and the candidate (witness + fix) must then pass. A
      # bugfix without this is a diff with a story; recording fail-then-pass is
      # what makes it a certificate.
      - id: wtree
        if: steps.kind.outputs.witness == 'yes'
        uses: ./.github/actions/envelope
        with:
          command: derive
          file: ${{ env.ENV_FILE }}
          parent: ${{ env.PARENT_TREE }}
          witness-only: "true"

      - name: Become the witness arm
        if: steps.kind.outputs.witness == 'yes'
        shell: bash
        env:
          WTREE: ${{ steps.wtree.outputs.tree }}
        run: |
          set -euo pipefail
          c=$(git commit-tree "$WTREE" -p HEAD -m "witness arm (never pushed)")
          git checkout -f --detach "$c"

      - id: witness-run
        if: steps.kind.outputs.witness == 'yes'
        continue-on-error: true
        uses: ./.github/actions/harness
        with:
          command: run
          config: ${{ steps.cfg.outputs.json }}
          arm: w
          repeats: "1"
          skip-bench: "true"

      - name: The witness must have failed, and failed the right way
        if: steps.kind.outputs.witness == 'yes'
        shell: bash
        env:
          BUILT: ${{ steps.witness-run.outputs.built }}
          TESTED: ${{ steps.witness-run.outputs.tested }}
        run: |
          set -euo pipefail
          if [ "$BUILT" != "yes" ]; then
            # A witness that does not BUILD says nothing about the bug. Blaming
            # the candidate for it would be the two-machines error one level
            # down.
            echo "WITNESS_RES=the witness arm did not build, so it never tested anything" \
              >> "$GITHUB_ENV"
          elif [ "$TESTED" = "yes" ]; then
            echo "WITNESS_RES=the witness passes on the baseline, so there is nothing to fix" \
              >> "$GITHUB_ENV"
          else
            echo "WITNESS_RES=fail-then-pass" >> "$GITHUB_ENV"
          fi
          git checkout -f --detach "$BASE_REF"

      # --- the candidate arm -----------------------------------------------
      #
      # A full checkout, not a partial one: a partial checkout leaves files the
      # candidate deleted still in the worktree. Safe because admission refused
      # any patch touching the evaluator, so the actions judging this tree are
      # byte-identical to the baseline's -- and that was asserted by the derive
      # check above, not assumed.
      - name: Become the candidate
        shell: bash
        run: git checkout -f --detach "$CAND_REF"

      - id: cand
        continue-on-error: true
        uses: ./.github/actions/harness
        with:
          command: run
          config: ${{ steps.cfg.outputs.json }}
          arm: b
          repeats: "1"
          skip-bench: "true"

      # --- the measurement, alternating ------------------------------------
      #
      # **`repeats` is spent here and only here.** Each round takes one reading
      # of each tree, so whatever the machine is doing over the run is spread
      # across both arms instead of landing entirely on whichever was measured
      # first. A raised OOPS level buys more rounds, which is the only thing
      # that narrows the interval downstream.
      #
      # It leaves the candidate checked out, because the steps after it read
      # the candidate's files.
      - id: bench
        if: steps.cand.outputs.built == 'yes'
        continue-on-error: true
        uses: ./.github/actions/bench-pair
        with:
          base-ref: ${{ inputs.baseline_ref }}
          cand-ref: ${{ inputs.candidate_ref }}
          config: ${{ steps.cfg.outputs.json }}
          rounds: ${{ inputs.repeats }}
          before: rails-a.txt
          after: rails-b.txt
          restore: ${{ inputs.candidate_ref }}

      # --- the comparison ---------------------------------------------------

      - id: rails
        if: steps.cand.outputs.built == 'yes'
        uses: ./.github/actions/rails
        with:
          command: judge
          before: rails-a.txt
          after: rails-b.txt
          claims: ${{ steps.kind.outputs.rail }}
          kind: ${{ inputs.kind }}
          config: ${{ steps.cfg.outputs.json }}
          seed: ${{ inputs.point }}

      # --- the verdict ------------------------------------------------------

      - id: verdict
        shell: bash
        env:
          CFG: ${{ steps.cfg.outputs.json }}
          A_BUILT: ${{ steps.base.outputs.built }}
          A_SUITES: ${{ steps.base.outputs.suites }}
          A_CLAIMS: ${{ steps.base.outputs.claims }}
          A_CHECKS: ${{ steps.base.outputs.checks }}
          B_BUILT: ${{ steps.cand.outputs.built }}
          B_TESTED: ${{ steps.cand.outputs.tested }}
          B_SUITES: ${{ steps.cand.outputs.suites }}
          B_CLAIMS: ${{ steps.cand.outputs.claims }}
          B_CHECKS: ${{ steps.cand.outputs.checks }}
          B_WHY: ${{ steps.cand.outputs.why }}
          WORSE: ${{ steps.rails.outputs.worse }}
          UNSTABLE: ${{ steps.rails.outputs.unstable }}
          MOVED: ${{ steps.rails.outputs.moved }}
          RAIL_WHY: ${{ steps.rails.outputs.why }}
          CLAIMED: ${{ steps.kind.outputs.rail }}
          EFFECT: ${{ steps.rails.outputs.effect }}
          INTERVAL: ${{ steps.rails.outputs.interval }}
          QVAL: ${{ steps.rails.outputs.q }}
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import json, os
          from pathlib import Path

          def env(k, d=""):
              return os.environ.get(k, d) or d

          cfg = json.loads(Path(env("CFG")).read_text(encoding="utf-8"))
          kind = cfg["kinds"][env("KIND")]
          j1 = kind["j1"]

          def out(k, v):
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
                  fh.write("%s=%s\n" % (k, v))

          # A candidate that never built or never ran is refused before any rail
          # is consulted, because there are no readings to consult -- and the
          # certificate says WHICH of the two it was, so the ledger records a
          # refusal with a reason rather than a red run with none.
          if env("B_BUILT") != "yes":
              out("verdict", "refuse")
              out("why", "the candidate did not build: " + env("B_WHY", "no error line"))
              # `-` and not `0`. Nothing counted these, and a zero reads as a run
              # that answered nothing, which is a different fact from a run that
              # never happened.
              for k in ("suites", "claims", "checks"):
                  out(k, "-")
              out("moved", "-"); out("effect", "-"); out("interval", "-"); out("q", "-")
              out("witness", "-")
              raise SystemExit(0)

          a = {k: int(env("A_" + k.upper(), "0")) for k in ("suites", "claims", "checks")}
          b = {k: int(env("B_" + k.upper(), "0")) for k in ("suites", "claims", "checks")}
          for k in ("suites", "claims", "checks"):
              out(k, "%d/%d" % (a[k], b[k]))
          out("moved", env("MOVED", "-"))
          out("effect", env("EFFECT", "-"))
          out("interval", env("INTERVAL", "-"))
          out("q", env("QVAL", "-"))
          wres = env("WITNESS_RES")
          out("witness", "fail-then-pass" if wres == "fail-then-pass" else "-")

          worse = int(env("WORSE", "0"))
          unstable = int(env("UNSTABLE", "0"))

          def refuse(why):
              out("verdict", "refuse"); out("why", why); raise SystemExit(0)

          def adopt(why):
              out("verdict", "adopt"); out("why", why); raise SystemExit(0)

          # **The counts that may not fall, checked before any kind's J1.**
          # Keeping this ahead of the branch is what makes it an invariant
          # rather than one more thing a kind could forget, and it is the only
          # thing standing between this machine and deleting its own tests to
          # make the numbers go up.
          fell = [k for k in ("suites", "claims", "checks") if b[k] < a[k]]
          if fell:
              refuse("the candidate answers less than the baseline (%s)"
                     % ", ".join("%s %d->%d" % (k, a[k], b[k]) for k in fell))

          if env("B_TESTED") != "yes":
              refuse("the candidate built and its tests did not pass: " + env("B_WHY"))

          if unstable:
              refuse("%d rail(s) were not comparable, so this trial was starved rather than "
                     "decided" % unstable)

          # J2, common to every kind: nothing the kind did not ask to pay for
          # may read worse.
          if worse:
              refuse("%d rail(s) regressed" % worse)

          if j1 == "witness":
              if wres != "fail-then-pass":
                  refuse(wres or "the witness arm was never run")
              adopt("the witness failed on the baseline and passes with the fix; "
                    "no rail regressed")

          if j1 == "claims":
              # **The honest bar for creating a thing.** It does not say the
              # feature is correct. It says the candidate builds, its tests
              # pass, it lost no claim and it ADDED one -- so the new code is
              # exercised by something that printed a pass rather than merely
              # compiling. That is weaker than fail-then-pass and it is the
              # only bar a greenfield file can meet: a witness must build
              # against the PARENT tree, and a module being created is by
              # construction absent from it.
              #
              # It is not gameable in the direction that matters. A claim costs
              # running one; the counts above catch anything traded away for
              # it; and the diff budget and the path masks are unchanged.
              if b["claims"] <= a["claims"]:
                  refuse("a %s that adds no claim is code nothing exercises (claims %d->%d)"
                         % (env("KIND"), a["claims"], b["claims"]))
              adopt("it builds, it passes, it added %d claim(s) and lost none; no rail "
                    "regressed" % (b["claims"] - a["claims"]))

          if j1 in ("rail", "cost"):
              want = env("CLAIMED", "none")
              moved = env("MOVED", "-")
              if moved == "absent":
                  refuse("nothing measured %s, so its claim cannot be judged" % want)
              if moved != "better":
                  refuse("%s reads %s: %s" % (want, moved, env("RAIL_WHY", "no line")))
              adopt(env("RAIL_WHY") or ("%s improved past its floor" % want))

          refuse("this kind has no J1 this judge knows, which config should have refused")
          PYEOF

      - id: cert
        uses: ./.github/actions/cert
        with:
          command: emit
          out: certificate.cert
          set: |
            seq=${{ inputs.seq }}
            utc=${{ env.NOW }}
            point=${{ inputs.point }}
            kind=${{ inputs.kind }}
            lane=model
            operator=${{ inputs.operator }}
            author=${{ inputs.author || '-' }}
            lineage=${{ inputs.lineage }}
            epoch=${{ inputs.epoch }}
            utility=${{ inputs.utility }}
            rung=${{ inputs.rung }}
            axis=${{ inputs.axis }}
            ladder=${{ inputs.ladder || '-' }}
            parent-tree=${{ env.PARENT_TREE }}
            candidate-tree=${{ env.CAND_TREE }}
            rail=${{ steps.kind.outputs.rail }}
            corpus=${{ inputs.corpus }}
            alpha-k=${{ inputs.alpha_k }}
            minutes=${{ inputs.minutes }}
            half=${{ inputs.half }}
            level=${{ inputs.level }}
            trials=${{ inputs.repeats }}
            suites=${{ steps.verdict.outputs.suites }}
            claims=${{ steps.verdict.outputs.claims }}
            checks=${{ steps.verdict.outputs.checks }}
            witness=${{ steps.verdict.outputs.witness }}
            moved=${{ steps.verdict.outputs.moved }}
            effect=${{ steps.verdict.outputs.effect }}
            interval=${{ steps.verdict.outputs.interval }}
            q=${{ steps.verdict.outputs.q }}
            why=${{ steps.verdict.outputs.why }}
            verdict=${{ steps.verdict.outputs.verdict }}
            runner=${{ github.run_id }}/${{ github.run_attempt }}

      - name: Keep everything
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: loopjudge-${{ inputs.point }}
          path: |
            certificate.cert
            judged.txt
            rails-*.txt
            harness-*.log
          if-no-files-found: ignore
          retention-days: 90
