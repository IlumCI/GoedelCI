name: boundary

# **The only lane that may change the evaluator**: the actions under
# `.github/actions/`, the workflows, the floors and bars in `goedel.toml`.
# Everywhere else the machine changes the project and a fixed judge decides.
# Here the machine changes the JUDGE, and nothing about that is safe by
# default -- an evaluator free to rewrite its own bar will discover that the
# cheapest way to pass is a lower one.
#
# It ships last by design and it is the one lane an operator starts by hand.
# The epoch gate needs a ledger to count and a gate with no track record to
# gate against is a ceremony.
#
# Two human decisions, not one. The write half runs under the `evaluator`
# environment, whose required reviewer means every run BLOCKS before
# `EVALUATOR_TOKEN` resolves; and its output is a pull request to the default
# branch, never a push -- not even to `loop/main`. Evaluator changes reach the
# machine only through the branch a human merges, which the machine then
# follows.
#
# The machine may DRAFT proposals into `loop/boundary/` through its ordinary
# lane, because they are data. Only an operator dispatch judges one.

on:
  workflow_dispatch:
    inputs:
      proposal:
        description: "path under loop/boundary/ (a declaration line, then a diff)"
        required: true

permissions:
  contents: read

concurrency:
  group: boundary
  cancel-in-progress: false

jobs:
  judge:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PROPOSAL: ${{ inputs.proposal }}
    outputs:
      ok: ${{ steps.verdict.outputs.ok }}
      declares: ${{ steps.proposal.outputs.declares }}
      moves: ${{ steps.verdict.outputs.moves }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: loop/main
          fetch-depth: 0

      - id: cfg
        uses: ./.github/actions/config
        with: { command: load }

      - id: ledger
        uses: ./.github/actions/ledger
        with:
          command: fsck
          epoch-len: ${{ steps.cfg.outputs.epoch-len }}

      - id: proposal
        name: The proposal itself
        shell: bash
        run: |
          set -euo pipefail
          case "$PROPOSAL" in
            loop/boundary/*) ;;
            *) echo "::error::proposals live under loop/boundary/"; exit 1;;
          esac
          test -f "$PROPOSAL" || { echo "::error::no such proposal"; exit 1; }
          decl=$(head -1 "$PROPOSAL")
          case "$decl" in
            "declares floors"|"declares judge"|"declares workflow"|"declares bar") ;;
            *) echo "::error::the proposal declares nothing this lane knows: $decl"; exit 1;;
          esac
          echo "declares=${decl#declares }" >> "$GITHUB_OUTPUT"
          tail -n +2 "$PROPOSAL" > /tmp/boundary.diff
          git apply --check --stat /tmp/boundary.diff

      # **The inverse of every other mask in this repository.** A boundary
      # proposal may touch ONLY the evaluator. A diff that reaches into the
      # project as well would be an ordinary change smuggled through the one
      # lane that does not judge ordinary changes -- adopted on Moves and
      # Honest, which say nothing about whether the project still works.
      - name: It may touch the evaluator, and nothing else
        shell: bash
        env:
          CFG: ${{ steps.cfg.outputs.json }}
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import fnmatch, json, os, re, sys
          from pathlib import Path
          cfg = json.loads(Path(os.environ["CFG"]).read_text(encoding="utf-8"))
          def m(p, masks):
              if p.startswith("./"):
                  p = p[2:]
              for x in masks:
                  if fnmatch.fnmatch(p, x):
                      return True
                  if x.endswith("/**") and (p == x[:-3] or p.startswith(x[:-2])):
                      return True
              return False
          paths = []
          for line in Path("/tmp/boundary.diff").read_text(encoding="utf-8").splitlines():
              g = re.match(r"^diff --git a/(.+?) b/(.+)$", line)
              if g:
                  for x in g.groups():
                      if x != "/dev/null" and x not in paths:
                          paths.append(x)
          if not paths:
              print("::error::the proposal's diff names no file")
              sys.exit(1)
          bad = [p for p in paths if not m(p, cfg["evaluator"])]
          if bad:
              print("::error::a boundary proposal may touch only the evaluator; these are "
                    "not evaluator paths: " + ", ".join(bad))
              sys.exit(1)
          print("  %d evaluator file(s): %s" % (len(paths), ", ".join(paths)))
          PYEOF

      # --- the anchors, as the CURRENT evaluator reads them ---------------
      - id: old
        uses: ./.github/actions/rails
        with:
          command: anchors
          anchors: loop/anchors
          config: ${{ steps.cfg.outputs.json }}
          out: anchors-old.tsv

      - name: Apply it
        shell: bash
        run: git apply /tmp/boundary.diff

      # --- Sane: the patched evaluator still proves itself ----------------
      #
      # Every claim suite, with the change applied. A proposal that breaks a
      # check does not get to argue that the check was wrong -- that argument
      # is a separate proposal, made against the check.
      - uses: ./.github/actions/template-check
        with: { command: check }
      - uses: ./.github/actions/cert
        with: { command: selftest }
      - uses: ./.github/actions/ledger
        with: { command: selftest }
      - uses: ./.github/actions/config
        with: { command: selftest }
      - uses: ./.github/actions/envelope
        with: { command: selftest }
      - uses: ./.github/actions/rails
        with: { command: selftest }
      - uses: ./.github/actions/archive
        with: { command: selftest }
      - uses: ./.github/actions/ladder
        with: { command: selftest }
      - uses: ./.github/actions/draft
        with: { command: selftest }
      - uses: ./.github/actions/harness
        with: { command: selftest }
      - uses: ./.github/actions/budget
        with: { command: selftest }
      - uses: ./.github/actions/adopt-decide
        with: { command: selftest }
      - uses: ./.github/actions/boundary-judge
        with: { command: selftest }

      # A floors change must cite a measurement, and the measurement must be
      # one this runner class produced. A number somebody typed is what the
      # original of this machine had, and it was wrong by up to seven times.
      - name: A floors change must sit inside the measured spread
        if: steps.proposal.outputs.declares == 'floors'
        shell: bash
        run: |
          set -euo pipefail
          newest=$(ls -1 loop/evidence/floors/*.tsv 2>/dev/null | sort | tail -1 || true)
          if [ -z "$newest" ]; then
            # Single quotes: backticks inside a double-quoted string are
            # command substitution, so this line ran `floors` as a command and
            # printed its 'not found' into the middle of an error message.
            echo '::error::a floors change with no measured spread to cite.'
            echo '::error::run the floors workflow first; a floor nobody measured'
            echo '::error::is a number somebody typed.'
            exit 1
          fi
          python3 - "$newest" <<'PYEOF'
          import json, sys, tomllib
          from pathlib import Path
          rows = {}
          for line in Path(sys.argv[1]).read_text(encoding="utf-8").splitlines()[1:]:
              if not line.strip():
                  continue
              name, n, med, p95 = line.split("\t")
              rows[name] = float(p95)
          floors = tomllib.loads(Path("goedel.toml").read_text(encoding="utf-8")).get("floors", {})
          bad = 0
          for prefix, f in floors.items():
              seen = [v for name, v in rows.items() if name == prefix or name.startswith(prefix)]
              if not seen:
                  continue
              p95 = max(seen)
              # A floor below the measured spread admits the day as an effect;
              # one far above it refuses real improvements. Twice the spread is
              # the band, and it is a judgement rather than a theorem -- which
              # is why it is stated here where a proposal can argue with it.
              if p95 > 0 and not (p95 <= float(f) <= 2 * p95):
                  bad += 1
                  print("::error::%s: %s is outside [%.4f, %.4f] of the newest measured spread"
                        % (prefix, f, p95, 2 * p95))
          sys.exit(1 if bad else 0)
          PYEOF

      # --- the anchors again, as the PROPOSED evaluator reads them --------
      - id: new
        uses: ./.github/actions/rails
        with:
          command: anchors
          anchors: loop/anchors
          config: ${{ steps.cfg.outputs.json }}
          out: anchors-new.tsv

      - name: Put it back before judging it
        shell: bash
        run: git apply -R /tmp/boundary.diff

      - id: verdict
        uses: ./.github/actions/boundary-judge
        with:
          command: judge
          old: anchors-old.tsv
          new: anchors-new.tsv
          boundary: ${{ steps.ledger.outputs.boundary }}
          entries: ${{ steps.ledger.outputs.count }}
          epoch-len: ${{ steps.cfg.outputs.epoch-len }}

      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: boundary-${{ github.run_id }}
          path: |
            anchors-old.tsv
            anchors-new.tsv
          if-no-files-found: ignore
          retention-days: 90

  # The write half: blocked on a human by the environment, and its output is a
  # pull request, never a push.
  open-pr:
    needs: judge
    if: needs.judge.outputs.ok == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: evaluator
    permissions:
      contents: read
    env:
      PROPOSAL: ${{ inputs.proposal }}
      EVALUATOR_TOKEN: ${{ secrets.EVALUATOR_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: loop/main
          fetch-depth: 0
          token: ${{ secrets.EVALUATOR_TOKEN }}

      - name: A branch and a pull request, for the second human decision
        shell: bash
        env:
          FROM_EVENT: ${{ github.event.repository.default_branch }}
          DECLARES: ${{ needs.judge.outputs.declares }}
          MOVES: ${{ needs.judge.outputs.moves }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Asked of git when the event does not carry it; see the same note in
          # loop-night.yml.
          DEFAULT="${FROM_EVENT:-}"
          if [ -z "$DEFAULT" ]; then
            DEFAULT=$(git remote show origin | sed -n 's/.*HEAD branch: //p')
          fi
          test -n "$DEFAULT" || { echo "::error::cannot tell which branch is the default"; exit 1; }
          name=$(sha256sum "$PROPOSAL" | cut -c1-16)
          git fetch origin "$DEFAULT"
          git checkout -q -b "boundary/$name" "origin/$DEFAULT"
          tail -n +2 "$PROPOSAL" | git apply
          git add -A
          git commit -q -m "boundary: $DECLARES ($name)"
          git push origin "boundary/$name"
          GH_TOKEN="$EVALUATOR_TOKEN" gh pr create \
            --head "boundary/$name" --base "$DEFAULT" --label evaluator \
            --title "boundary: $DECLARES ($name)" \
            --body "A change to the evaluator itself, cross-judged at an epoch boundary.

The run's log carries Sane, Moves, Honest and Remembers; it moves on $MOVES archived anchor(s) and disagrees with none of their ground truth. Merging is the second human decision.

Nothing in this branch has been through the ordinary judge, because the ordinary judge is what it changes."
