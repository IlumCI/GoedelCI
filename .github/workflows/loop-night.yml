name: loop-night

# The night: follow, reconsider, extend the ladder, draft, judge, adopt.
#
# Every job sits under ONE concurrency group, which is what makes
# fast-forward-only real -- there is never a second night interleaving with
# this one, so adopt's read-then-commit is atomic in the only sense that
# matters here.
#
# **The machine's whole world is `loop/*`.** Its token has `contents: write`
# and no `workflows: write`, so GitHub itself rejects any push touching
# `.github/workflows/**`; the rolling audit pull request is how its work
# reaches a human, and `main` is reachable only through that human.
#
# CONSUMER: loop/main's ledger (the next night reads it), the audit PR (the
# operator reads it), and ci.yml, which re-verifies every push to loop/** with
# a job the loop does not control.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "draft and judge, but adopt writes nothing"
        type: boolean
        default: false
  schedule:
    # 02:17 rather than 02:00: every scheduled workflow on GitHub fires on the
    # hour, the queue is deepest there, and a night that starts forty minutes
    # late has spent forty minutes of its own timeout waiting.
    - cron: "17 2 * * *"

permissions:
  contents: read

concurrency:
  group: loop-main
  cancel-in-progress: false

env:
  # Named here and read by name from goedel.toml, so a project that uses a
  # different provider changes one file and not this one.
  GOEDEL_INFERENCE_KEY: ${{ secrets.GOEDEL_INFERENCE_KEY }}
  GOEDEL_INFERENCE_URL: ${{ vars.GOEDEL_INFERENCE_URL }}

jobs:
  # --- follow: the machine follows main, never the reverse -----------------
  follow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      tip: ${{ steps.tip.outputs.tip }}
      default: ${{ steps.default.outputs.branch }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      # **Asked of git, not of the event.** `github.event.repository` is not
      # guaranteed to be populated on a `schedule` event, and the night runs on
      # a schedule -- so a default branch read from the payload is empty on
      # exactly the runs nobody is watching, and `origin/` is not a ref.
      - id: default
        name: Which branch is the human authority
        shell: bash
        env:
          FROM_EVENT: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          b="${FROM_EVENT:-}"
          if [ -z "$b" ]; then
            b=$(git remote show origin | sed -n 's/.*HEAD branch: //p')
          fi
          test -n "$b" || { echo "::error::cannot tell which branch is the default"; exit 1; }
          echo "  $b"
          echo "branch=$b" >> "$GITHUB_OUTPUT"
          echo "DEFAULT=$b" >> "$GITHUB_ENV"

      - name: The loop's branch, made if it is not there
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse --verify --quiet origin/loop/main >/dev/null; then
            git checkout -f -B loop/main origin/loop/main
          else
            echo "::notice::first night: loop/main starts from $DEFAULT"
            git checkout -f -B loop/main "origin/$DEFAULT"
            mkdir -p loop/ledger/entries loop/ledger/tried loop/ladder loop/anchors
            git push origin HEAD:refs/heads/loop/main
          fi

      - id: cfg
        uses: ./.github/actions/config
        with: { command: load }

      - name: A corrupted ledger judges nothing
        uses: ./.github/actions/ledger
        with:
          command: fsck
          epoch-len: ${{ steps.cfg.outputs.epoch-len }}

      - id: seq
        uses: ./.github/actions/ledger
        with:
          command: count
          epoch-len: ${{ steps.cfg.outputs.epoch-len }}

      # A conflict here is the operator having overridden an adoption, and the
      # ledger records the override instead of pretending it did not happen.
      # main is the human authority; the machine notes what it lost.
      - name: Follow main, and record what it overrode
        id: follow
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$DEFAULT"
          if git merge-base --is-ancestor "origin/$DEFAULT" HEAD; then
            echo "  already carries $DEFAULT"
            echo "conflicted=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          git merge --no-commit --no-ff "origin/$DEFAULT" >/dev/null 2>&1
          set -e
          conflicted=$(git diff --name-only --diff-filter=U | tr '\n' ' ')
          if [ -n "$conflicted" ]; then
            git checkout --theirs -- .
            git add -A
            git commit -q -m "loop: follow $DEFAULT, which overrode: $conflicted"
          else
            git commit -q -m "loop: follow $DEFAULT" || echo "  nothing to merge"
          fi
          echo "conflicted=$conflicted" >> "$GITHUB_OUTPUT"
          echo "POINT=$(printf 'superseded by %s over %s' \
            "$(git rev-parse origin/$DEFAULT)" "$conflicted" | sha256sum | cut -d' ' -f1)" \
            >> "$GITHUB_ENV"
          echo "NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - if: steps.follow.outputs.conflicted != ''
        uses: ./.github/actions/cert
        with:
          command: emit
          out: superseded.cert
          set: |
            seq=${{ steps.seq.outputs.seq }}
            utc=${{ env.NOW }}
            point=${{ env.POINT }}
            kind=event
            lane=event
            epoch=${{ steps.seq.outputs.epoch }}
            utility=${{ steps.cfg.outputs.utility }}
            rung=0
            axis=none
            why=main overrode: ${{ steps.follow.outputs.conflicted }}
            verdict=superseded
            runner=${{ github.run_id }}/${{ github.run_attempt }}

      - name: File it, and push
        shell: bash
        env:
          CONFLICTED: ${{ steps.follow.outputs.conflicted }}
        run: |
          set -euo pipefail
          if [ -n "$CONFLICTED" ]; then
            name=$(sha256sum superseded.cert | cut -c1-16)
            mkdir -p loop/ledger/entries
            mv superseded.cert "loop/ledger/entries/$name.cert"
            git add loop/ledger/entries
            git commit -q -m "loop: a superseded entry for what main overrode"
          fi
          git push origin HEAD:refs/heads/loop/main

      - id: tip
        run: echo "tip=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        shell: bash

  # --- plan: reconsider, extend the ladder, decide the budget --------------
  #
  # Its own job, and the tree the rest of the night grows from is THIS job's
  # last commit rather than follow's: reconsider may commit a backtrack and the
  # ladder may commit a new rung, both pushed to loop/main. A shard that
  # checked out follow's tip would draw against a tree that no longer exists
  # and name a parent the judge cannot find.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: follow
    permissions:
      contents: write
    outputs:
      have: ${{ steps.rung.outputs.have }}
      verb: ${{ steps.rung.outputs.verb }}
      kind: ${{ steps.rung.outputs.kind }}
      target: ${{ steps.rung.outputs.target }}
      ladder: ${{ steps.rung.outputs.point }}
      lineage: ${{ steps.node.outputs.node }}
      tip: ${{ steps.tip.outputs.tip }}
      shards: ${{ steps.cfg.outputs.shard-matrix }}
      minutes: ${{ steps.budget.outputs.minutes }}
      repeats: ${{ steps.budget.outputs.repeats }}
      level: ${{ steps.budget.outputs.level }}
      half: ${{ steps.budget.outputs.half }}
      alpha_k: ${{ steps.budget.outputs.alpha-k }}
      epoch: ${{ steps.seq.outputs.epoch }}
      seq: ${{ steps.seq.outputs.seq }}
      utility: ${{ steps.cfg.outputs.utility }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.follow.outputs.tip }}
          fetch-depth: 0

      - id: cfg
        uses: ./.github/actions/config
        with: { command: load }

      - id: seq
        uses: ./.github/actions/ledger
        with:
          command: fsck
          epoch-len: ${{ steps.cfg.outputs.epoch-len }}

      - name: What the record looks like
        uses: ./.github/actions/archive
        with: { command: report }

      - id: budget
        uses: ./.github/actions/budget
        with:
          command: plan
          config: ${{ steps.cfg.outputs.json }}

      # Clade before anything else. Under the evidence floor this answers
      # `stay` by construction, so early nights report and move on; when it
      # answers `move`, the move is a real commit -- the chosen state's tree
      # restored, the ledger carried forward WHOLE (a restore that restored its
      # own record would be a lineage erasing the decision that moved it), and
      # a `restore` event appended.
      #
      # The chosen state may be an ancestor of the tip or a cousin. Both cost
      # the same and both keep every invariant fsck enforces; see the long note
      # in archive/action.yml.
      - id: clade
        uses: ./.github/actions/archive
        with:
          command: reconsider
          seed: ${{ github.run_id }}
          half: ${{ steps.budget.outputs.half }}
          min-evidence: ${{ env.GOEDEL_MIN_EVIDENCE }}

      - name: Move, if the record says move
        if: steps.clade.outputs.decision == 'move'
        shell: bash
        env:
          TARGET: ${{ steps.clade.outputs.tree }}
          STEPS: ${{ steps.clade.outputs.steps }}
          WHY: ${{ steps.clade.outputs.why }}
          SEQ: ${{ steps.seq.outputs.seq }}
          EPOCH: ${{ steps.seq.outputs.epoch }}
          UTILITY: ${{ steps.cfg.outputs.utility }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          parent=$(git rev-parse 'HEAD^{tree}')
          now=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          point=$(printf 'restore %s from %s' "$TARGET" "$parent" \
                  | sha256sum | cut -d' ' -f1)
          printf 'GOEDEL_RESTORE_POINT=%s\nGOEDEL_RESTORE_NOW=%s\nGOEDEL_RESTORE_PARENT=%s\n' \
            "$point" "$now" "$parent" >> "$GITHUB_ENV"

      - if: steps.clade.outputs.decision == 'move'
        uses: ./.github/actions/cert
        with:
          command: emit
          out: restore.cert
          set: |
            seq=${{ steps.seq.outputs.seq }}
            utc=${{ env.GOEDEL_RESTORE_NOW }}
            point=${{ env.GOEDEL_RESTORE_POINT }}
            kind=event
            lane=event
            epoch=${{ steps.seq.outputs.epoch }}
            utility=${{ steps.cfg.outputs.utility }}
            rung=0
            axis=none
            parent-tree=${{ env.GOEDEL_RESTORE_PARENT }}
            candidate-tree=${{ steps.clade.outputs.tree }}
            why=the clade chose another state: ${{ steps.clade.outputs.why }}
            verdict=restore
            runner=${{ github.run_id }}/${{ github.run_attempt }}

      - name: Commit the move through the index, never the worktree
        if: steps.clade.outputs.decision == 'move'
        shell: bash
        env:
          TARGET: ${{ steps.clade.outputs.tree }}
          NODE: ${{ steps.clade.outputs.node }}
        run: |
          set -euo pipefail
          name=$(sha256sum restore.cert | cut -c1-16)
          blob=$(git hash-object -w restore.cert)
          # The commit's tree is the target, with the CURRENT ledger overlaid,
          # plus the event entry. Pure plumbing, so there is no deleted-file or
          # stale-file class of mistake to make.
          export GIT_INDEX_FILE=/tmp/rb-index
          git read-tree "$TARGET"
          git rm -r --cached loop/ledger --quiet 2>/dev/null || true
          git read-tree --prefix=loop/ledger/ 'HEAD:loop/ledger'
          git update-index --add --cacheinfo "100644,$blob,loop/ledger/entries/$name.cert"
          tree=$(git write-tree)
          unset GIT_INDEX_FILE
          new=$(git commit-tree "$tree" -p HEAD \
                  -m "loop: restore the tree of ${NODE:0:12}")
          git checkout -f --detach "$new"
          rm -f restore.cert
          git push origin "$new:refs/heads/loop/main"

      - name: Re-check the ledger after writing to it
        if: steps.clade.outputs.decision == 'move'
        uses: ./.github/actions/ledger
        with:
          command: fsck
          epoch-len: ${{ steps.cfg.outputs.epoch-len }}

      # **The operator writes one line and the machine writes the rest.** A
      # refused proposal is the ordinary outcome and not a failure: the fence
      # contract is strict on purpose, and a night with no new rung still has
      # whatever is already open.
      - id: propose
        name: Keep the ladder stocked
        uses: ./.github/actions/ladder
        with:
          command: propose
          config: ${{ steps.cfg.outputs.json }}

      - name: File the new rung, if there is one
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain loop/ladder)" ]; then
            git add loop/ladder
            git commit -q -m "loop: a rung toward the goal"
            git push origin HEAD:refs/heads/loop/main
          fi

      # The rung travels as a FILE and not as a job output. A title carries
      # spaces and backticks and a witness carries a sentence, and every one of
      # those is a quoting accident waiting in $GITHUB_OUTPUT.
      - id: rung
        uses: ./.github/actions/ladder
        with:
          command: next
          config: ${{ steps.cfg.outputs.json }}
          emit-env: rung.env

      - id: node
        uses: ./.github/actions/archive
        with:
          command: select
          seed: ${{ github.run_id }}
          half: ${{ steps.budget.outputs.half }}

      - id: tip
        name: Where the night grows from
        shell: bash
        run: echo "tip=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: loop-rung
          path: rung.env
          if-no-files-found: error
          retention-days: 7

  # --- draft: one shard, one declared draw ---------------------------------
  #
  # **Speculative, and that is the point.** On a public repository hosted
  # minutes are free and the concurrency limit is twenty jobs, so the thing
  # being spent is a resource that does not deplete, to buy the one that does:
  # wall clock inside a night.
  #
  # Shard 0 draws greedily -- it is the night the loop would have had anyway,
  # so the fan-out can only ever add. The rest draw at a raised temperature
  # with their index as the declared seed, which is provenance: which shard's
  # answer this was. It is not a replay, and nothing needs it to be, because
  # what a later run re-derives is the VERDICT on the patch, and the envelope
  # carries the patch whole.
  #
  # `fail-fast: false`, because a shard is a sample. One that came back
  # unusable says nothing about the next, and cancelling its siblings for it
  # would make the search narrower the worse the draw was.
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [follow, plan]
    if: needs.plan.outputs.have == 'yes'
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.tip }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with: { name: loop-rung }

      - id: cfg
        uses: ./.github/actions/config
        with: { command: load }

      - id: draw
        continue-on-error: true
        uses: ./.github/actions/draft
        with:
          command: draft
          rung: rung.env
          config: ${{ steps.cfg.outputs.json }}
          seed: ${{ matrix.shard == 0 && '' || matrix.shard }}
          lineage: ${{ needs.plan.outputs.lineage }}
          out: envelope.env

      # **A shard that got no answer is not a draw.** Three balks retire a
      # milestone, so an afternoon of 503s would otherwise retire the ladder.
      # `drew` separates "the model said no" -- which IS evidence about the
      # rung -- from "nothing answered", which is evidence about the night.
      - name: Say which of the two happened
        shell: bash
        env:
          DREW: ${{ steps.draw.outputs.drew }}
          WHY: ${{ steps.draw.outputs.why }}
          CODE: ${{ steps.draw.outcome }}
        run: |
          set -euo pipefail
          mkdir -p shard
          echo "${{ matrix.shard }}" > shard/n
          if [ "$DREW" = "yes" ]; then
            cp envelope.env shard/envelope.env
            echo "drew" > shard/state
          elif printf '%s' "$WHY" | grep -q '^no answer'; then
            echo "noanswer" > shard/state
          else
            echo "balk" > shard/state
          fi
          printf '%s' "$WHY" > shard/why

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: loop-shard-${{ matrix.shard }}
          path: shard
          if-no-files-found: ignore
          retention-days: 7

  # --- stage: choose among the shards, mark tried, push the candidate ------
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [follow, plan, draft]
    # `!cancelled()` and not `always()`: a shard that drew nothing is a shard
    # that failed and the night carries on, but an operator who cancelled the
    # run meant it, and `always()` would mark a point tried on a night nobody
    # wanted.
    if: ${{ !cancelled() && needs.plan.outputs.have == 'yes' }}
    permissions:
      contents: write
    outputs:
      have: ${{ steps.pick.outputs.have }}
      point: ${{ steps.pick.outputs.point }}
      baseline: ${{ steps.refs.outputs.baseline }}
      candidate: ${{ steps.push.outputs.candidate }}
      operator: ${{ steps.pick.outputs.operator }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.tip }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: loop-shard-*
          path: shards

      - id: cfg
        uses: ./.github/actions/config
        with: { command: load }

      - id: pick
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Lowest shard wins, and that is the whole rule. Shard 0 is the
          # greedy draw, so the fan-out can only add: if the night would have
          # worked without it, shard 0 produced that answer and takes the tie.
          # A glob rather than `ls`, because `ls` on an absent directory exits
          # 2 and `pipefail` makes that the shell's last word.
          shopt -s nullglob
          took=""; drew=0; balked=0; why=""
          for d in shards/loop-shard-*; do
            state=$(cat "$d/state" 2>/dev/null || echo none)
            case "$state" in
              drew) drew=$((drew+1)); [ -n "$took" ] || took="$d" ;;
              # `tr` and not a bare read. The reason is whatever the model
              # said, and a newline in it writes a SECOND assignment into
              # $GITHUB_OUTPUT that the runner obeys.
              balk) balked=$((balked+1))
                    [ -n "$why" ] || why=$(head -c 300 "$d/why" | tr '\n\r' '  ') ;;
            esac
          done
          echo "  $drew shard(s) drew, $balked balked"
          if [ -z "$took" ]; then
            echo "have=no" >> "$GITHUB_OUTPUT"
            echo "balked=$balked" >> "$GITHUB_OUTPUT"
            echo "balk_why=$why" >> "$GITHUB_OUTPUT"
            echo "::notice::no shard drew a usable candidate tonight"
            exit 0
          fi
          cp "$took/envelope.env" envelope.env
          point=$(sha256sum envelope.env | cut -d' ' -f1)
          echo "have=yes" >> "$GITHUB_OUTPUT"
          echo "point=$point" >> "$GITHUB_OUTPUT"
          echo "balked=0" >> "$GITHUB_OUTPUT"
          echo "operator=$(sed -n 's/^operator //p' envelope.env)" >> "$GITHUB_OUTPUT"
          echo "  shard $(cat "$took/n") drew ${point:0:16}"

      # A milestone every shard refused is a fact about the milestone rather
      # than about any one draw -- independent samples, and every one came back
      # unusable. That is exactly what a balk records, and enough of them
      # retire the rung so the ladder does not stall on it forever.
      - name: Record a balk against the milestone
        if: steps.pick.outputs.have == 'no' && steps.pick.outputs.balked != '0'
        uses: ./.github/actions/ladder
        with:
          command: balk
          config: ${{ steps.cfg.outputs.json }}
          why: ${{ steps.pick.outputs.balk_why }}

      - name: Push the balk
        if: steps.pick.outputs.have == 'no'
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain loop/ladder)" ]; then
            git add loop/ladder
            git commit -q -m "loop: the drafter balked at this milestone"
            git push origin HEAD:refs/heads/loop/main
          fi

      # Marker BEFORE trial: an interrupted night has still spent the night,
      # and a point that was tried and left unrecorded is one the next night
      # will try again identically.
      # **Marker BEFORE trial, and the candidate derived from the tree the
      # marker left behind.** An interrupted night has still spent the night,
      # and a point that was tried and left unrecorded is one the next night
      # will try again identically.
      #
      # The order matters for a reason that is easy to get backwards. The
      # envelope records the tree the DRAFTER saw, which is this job's tip
      # before the marker commit; the judge derives from the tree at
      # `baseline_ref`, which is this job's tip AFTER it. Those two differ by
      # exactly one file under `loop/ledger/tried/`, which no patch may touch,
      # so deriving from the post-marker tree is what makes the judge's
      # bit-for-bit assertion hold. Deriving from the pre-marker one produces a
      # candidate the judge cannot reproduce, and the night dies at the gate
      # every time.
      - name: Mark it tried
        if: steps.pick.outputs.have == 'yes'
        id: refs
        shell: bash
        env:
          POINT: ${{ steps.pick.outputs.point }}
        run: |
          set -euo pipefail
          mkdir -p loop/ledger/tried
          cp envelope.env "loop/ledger/tried/${POINT:0:16}.env"
          git add loop/ledger/tried
          git commit -q -m "loop: tried ${POINT:0:16}"
          git push origin HEAD:refs/heads/loop/main
          echo "baseline=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "parent=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"

      - id: derive
        if: steps.pick.outputs.have == 'yes'
        uses: ./.github/actions/envelope
        with:
          command: derive
          file: envelope.env
          parent: ${{ steps.refs.outputs.parent }}

      - id: push
        name: Push it where the judge can reach it
        if: steps.pick.outputs.have == 'yes'
        shell: bash
        env:
          POINT: ${{ steps.pick.outputs.point }}
          TREE: ${{ steps.derive.outputs.tree }}
        run: |
          set -euo pipefail
          cand=$(git commit-tree "$TREE" -p HEAD -m "loop: candidate ${POINT:0:16}")
          git push origin "$cand:refs/heads/loop/cand/${POINT:0:16}"
          echo "candidate=$cand" >> "$GITHUB_OUTPUT"

  # --- judge: the two-arm gate, in its own workflow ------------------------
  judge:
    needs: [plan, stage]
    # An explicit status function, or a skipped shard skips the judge: with
    # none, GitHub adds an implicit `success()` that looks at the whole chain
    # of ancestors rather than at `needs`. actions/runner#2205.
    if: ${{ !cancelled() && needs.stage.result == 'success' && needs.stage.outputs.have == 'yes' }}
    uses: ./.github/workflows/loop-judge.yml
    with:
      point: ${{ needs.stage.outputs.point }}
      baseline_ref: ${{ needs.stage.outputs.baseline }}
      candidate_ref: ${{ needs.stage.outputs.candidate }}
      kind: ${{ needs.plan.outputs.kind }}
      seq: ${{ needs.plan.outputs.seq }}
      epoch: ${{ needs.plan.outputs.epoch }}
      utility: ${{ needs.plan.outputs.utility }}
      lineage: ${{ needs.plan.outputs.lineage }}
      operator: ${{ needs.stage.outputs.operator }}
      rung: "1"
      axis: ${{ needs.plan.outputs.target }}
      corpus: "00000000"
      rail: "none"
      minutes: ${{ needs.plan.outputs.minutes }}
      repeats: ${{ needs.plan.outputs.repeats }}
      level: ${{ needs.plan.outputs.level }}
      half: ${{ needs.plan.outputs.half }}
      alpha_k: ${{ needs.plan.outputs.alpha_k }}
      ladder: ${{ needs.plan.outputs.ladder }}

  # --- adopt: the only writer of entries, serialized, staleness-checked ----
  adopt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [follow, plan, stage, judge]
    if: ${{ !cancelled() && needs.judge.result == 'success' && needs.stage.outputs.have == 'yes' && !inputs.dry_run }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: loop/main
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: loopjudge-${{ needs.stage.outputs.point }}
          path: judge

      - id: cfg
        uses: ./.github/actions/config
        with: { command: load }

      - name: The certificate must be one before anything acts on it
        uses: ./.github/actions/cert
        with:
          command: check
          file: judge/certificate.cert

      - id: live
        shell: bash
        run: echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"

      - id: decide
        uses: ./.github/actions/adopt-decide
        with:
          command: decide
          cert: judge/certificate.cert
          live: ${{ steps.live.outputs.tree }}

      - name: File it, in one commit with whatever it adopted
        shell: bash
        env:
          VERDICT: ${{ steps.decide.outputs.verdict }}
          BASE: ${{ steps.decide.outputs.base }}
          STALE: ${{ steps.decide.outputs.stale }}
          POINT: ${{ needs.stage.outputs.point }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cert=judge/certificate.cert
          # The one honest edit a certificate ever receives, before it is
          # frozen: the judge answered about a parent that is no longer the
          # tip, so its verdict cannot land whatever it was.
          if [ "$STALE" = "yes" ]; then
            sed -i "s/^verdict .*/verdict stale/" "$cert"
            echo "::notice::the tip moved mid-judge; filed as stale"
          fi
          # seq is re-derived under the lock, where it is authoritative.
          n=0
          if [ -d loop/ledger/entries ]; then
            n=$(find loop/ledger/entries -name '*.cert' | wc -l)
          fi
          sed -i "s/^seq .*/seq $(( n + 1 ))/" "$cert"
          name=$(sha256sum "$cert" | cut -c1-16)
          blob=$(git hash-object -w "$cert")
          # Pure plumbing: the commit's tree is built in an index, so the
          # worktree is never mutated. On an adoption the base is the candidate
          # tree -- which already carries tonight's marker, because it derives
          # from the post-marker tip -- and on a refusal it is the live tree.
          # Either way the one addition is the certificate, so code and record
          # land together and are inseparable in history.
          export GIT_INDEX_FILE=/tmp/adopt-index
          git read-tree "$BASE"
          git update-index --add --cacheinfo "100644,$blob,loop/ledger/entries/$name.cert"
          tree=$(git write-tree)
          unset GIT_INDEX_FILE
          new=$(git commit-tree "$tree" -p HEAD \
                  -m "loop: $VERDICT ${POINT:0:16} (seq $(( n + 1 )))")
          git checkout -f --detach "$new"
          git push origin "$new:refs/heads/loop/main"
          git push origin --delete "loop/cand/${POINT:0:16}" || true

      # **Every decided trial leaves an anchor behind.** An anchor is the two
      # arms' rail files plus the rail that was claimed: a question with a
      # known history, which a LATER evaluator can be asked again. Without a
      # stock of them, `boundary` cannot ask whether a change to the judge
      # moves anything, and a Moves that cannot be asked is not a Moves that
      # passed -- which is why that lane refuses outright when the stock is
      # empty.
      #
      # `ground` is deliberately NOT written here. Whether a movement was real
      # or was the day is a judgement the machine is not entitled to make
      # about its own record; an operator writes the word into the file, and
      # until somebody does, the anchor abstains rather than votes.
      - name: Archive the anchor
        if: steps.decide.outputs.verdict != 'stale'
        shell: bash
        env:
          POINT: ${{ needs.stage.outputs.point }}
        run: |
          set -euo pipefail
          a=judge/rails-a.txt; b=judge/rails-b.txt
          if [ ! -f "$a" ] || [ ! -f "$b" ]; then
            echo "  no rail files in the judge's artifact; nothing to anchor"
            exit 0
          fi
          claimed=$(awk '$1 != "[rail]" {print $1; exit}' "$a" || true)
          if [ -z "$claimed" ]; then
            echo "  the baseline measured no rail; nothing to anchor"
            exit 0
          fi
          d="loop/anchors/${POINT:0:16}"
          mkdir -p "$d"
          cp "$a" "$d/before.txt"
          cp "$b" "$d/after.txt"
          printf '%s\n' "$claimed" > "$d/claims"
          git add "$d"
          git commit -q -m "loop: an anchor from ${POINT:0:16}"
          git push origin HEAD:refs/heads/loop/main

      - name: And the ledger still holds together after writing to it
        uses: ./.github/actions/ledger
        with:
          command: fsck
          epoch-len: ${{ steps.cfg.outputs.epoch-len }}

      - id: progress
        uses: ./.github/actions/ladder
        with:
          command: progress
          config: ${{ steps.cfg.outputs.json }}

      - id: tail
        uses: ./.github/actions/ledger
        with:
          command: tail
          n: "12"

      # **The ladder above the ledger.** The ledger says what was judged; it
      # does not say whether the loop is getting anywhere. An operator checking
      # in once a week wants the second question answered first.
      - name: The rolling audit pull request
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT: ${{ needs.follow.outputs.default }}
        shell: bash
        run: |
          set -euo pipefail
          body=$(printf 'Where the loop is going:\n\n```\n%s\n```\n\nAnd what it has judged, newest last:\n\n```\n%s\n```\n\nEvery entry is a content-named certificate under `loop/ledger/entries`, re-verified by `ci.yml` on every push to this branch. Merging is yours; the machine only ever writes here.\n' \
            "$(cat ladder-progress.txt 2>/dev/null || echo 'see the run log')" \
            "$(cat ledger-tail.txt 2>/dev/null || echo 'see the run log')")
          n=$(gh pr list --head loop/main --base "$DEFAULT" --state open --json number --jq length)
          if [ "$n" = "0" ]; then
            gh pr create --head loop/main --base "$DEFAULT" \
              --title "The loop ledger" --body "$body"
          else
            num=$(gh pr list --head loop/main --base "$DEFAULT" --state open \
                    --json number --jq '.[0].number')
            gh pr edit "$num" --body "$body"
          fi

  # --- no night leaves a candidate ref behind ------------------------------
  #
  # Keyed on `adopt` rather than on `judge`, because adopt is the thing that
  # does the deleting: any outcome of it other than success means the branch is
  # still there. One condition covers the dry run, the failed judge, the
  # skipped judge and an adopt that fell over itself. Without it, every night
  # the judge failed left `loop/cand/<point>` on the remote forever -- nightly,
  # over a year, a refs list nobody can read.
  tidy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [stage, judge, adopt]
    if: always() && needs.stage.outputs.have == 'yes' && needs.adopt.result != 'success'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        env:
          POINT: ${{ needs.stage.outputs.point }}
        run: git push origin --delete "loop/cand/${POINT:0:16}" || true
