name: genesis

# **A name and a kind of thing, and a repository that runs.**
#
# Everything else here improves a project that exists. This makes one.
#
# What you have to supply is a name and what kind of thing it is. Everything
# past that is optional and has somewhere better to live than a dispatch box:
#
#   loop/brief.md   if you have written a specification, it wins
#   README.md       otherwise, the marked block, or the prose under the title
#   the input       and if you would rather just type it, type it
#   nothing         which is fine. A kind of thing carries most of its own
#                   requirements, and `brief` builds the rest out into a
#                   document you can read and disagree with before anything
#                   is written.
#
# It then plans, builds phase one, proves the result actually works, writes the
# config the nightly loop will run against, and commits. After it, `loop-night`
# has something to do every night and you have nothing to do at all.
#
# **It is not finished until the tree it wrote runs.** A scaffold is accepted
# only when `config` loads what was assembled for it, the harness builds and
# tests it, the claim count is above zero, and `verify` answers. Anything less
# goes back to be written again with the failure attached. Three attempts, and
# they are separate jobs so that each one starts from a clean checkout rather
# than from whatever the last one left behind.
#
# That gate is the whole design. A loop bootstrapped onto a tree whose tests do
# not pass can never adopt anything -- the count that may not fall starts at
# the floor -- and a loop whose `claims_re` matches nothing refuses every night
# forever for a reason that has nothing to do with the code. Both fail silently
# months later. Here they fail in four minutes, with the reason printed.
#
# Run it once, on an empty repository. Running it again on one that already has
# a blueprint refuses rather than overwriting the plan the record is built on.

on:
  workflow_dispatch:
    inputs:
      name:
        description: "what the thing is called"
        required: true
      type:
        description: "what kind of thing it is"
        type: choice
        required: true
        default: app
        options: [app, api, agent, token, business, experiment]
      description:
        description: >-
          optional. Leave it empty and the README is read instead; leave that
          empty too and the name and the kind are enough.
        required: false
        default: ""
      autonomous:
        description: "promote its own work to the default branch, with no human"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: loop-main
  cancel-in-progress: false

env:
  GOEDEL_INFERENCE_KEY: ${{ secrets.GOEDEL_INFERENCE_KEY }}
  GOEDEL_INFERENCE_URL: ${{ vars.GOEDEL_INFERENCE_URL }}

jobs:
  # --- plan: the description becomes phases with observable criteria -------
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      stack: ${{ steps.admit.outputs.stack }}
      source: ${{ steps.found.outputs.why }}
      verify: ${{ steps.admit.outputs.verify }}
      branch: ${{ steps.branch.outputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }

      - id: branch
        name: The loop's branch, and a refusal if this has run before
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          default=$(git remote show origin | sed -n 's/.*HEAD branch: //p')
          test -n "$default" || { echo "::error::cannot tell the default branch"; exit 1; }
          echo "name=$default" >> "$GITHUB_OUTPUT"
          if git rev-parse --verify --quiet origin/loop/main >/dev/null; then
            git checkout -f -B loop/main origin/loop/main
          else
            git checkout -f -B loop/main "origin/$default"
          fi
          # **Genesis is once.** The blueprint is what every certificate's
          # milestone was drawn from, so replacing it retroactively detaches
          # the whole record from the plan it claims to be executing. Revising
          # the plan is a `boundary` proposal at an epoch edge, not a second
          # genesis.
          if [ -f loop/blueprint.txt ]; then
            echo "::error::this repository already has a plan at loop/blueprint.txt."
            echo "::error::Genesis runs once. Revising the plan is a boundary proposal,"
            echo "::error::so that the record stays attached to the plan it executed."
            exit 1
          fi

      # --- the brief: whatever there is, made concrete -------------------
      - id: found
        uses: ./.github/actions/brief
        with:
          command: read
          name: ${{ inputs.name }}
          type: ${{ inputs.type }}
          description: ${{ inputs.description }}
          source: loop/brief.md README.md
          input-out: brief-input.txt

      - uses: ./.github/actions/brief
        with:
          command: card
          name: ${{ inputs.name }}
          type: ${{ inputs.type }}
          input-out: brief-input.txt
          card-out: brief-card.txt
          system-out: brief-system.txt

      - id: brief-ask
        uses: ./.github/actions/draft
        with:
          command: ask
          config: ${{ runner.temp }}/ask.json
          system: brief-system.txt
          user: brief-card.txt
          out: brief-reply.txt

      - id: brief
        uses: ./.github/actions/brief
        with:
          command: admit
          name: ${{ inputs.name }}
          type: ${{ inputs.type }}
          found: ${{ steps.found.outputs.found }}
          reply: brief-reply.txt

      # --- the plan, from the brief rather than from the sentence --------
      - id: card
        uses: ./.github/actions/blueprint
        with:
          command: card
          name: ${{ inputs.name }}
          brief: loop/brief.md
          card-out: blueprint-card.txt
          system-out: blueprint-system.txt

      # No config exists yet, and `ask` needs only the [author] table -- so it
      # gets a minimal one written here rather than a chicken-and-egg.
      - name: The smallest config that can ask a question
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ask.json" <<'JSON'
          {"author": {"provider": "anthropic", "model": "claude-sonnet-5",
                      "api_key_env": "GOEDEL_INFERENCE_KEY",
                      "base_url_env": "GOEDEL_INFERENCE_URL",
                      "attempts": 1, "temperature": 0.0, "max_tokens": 8000,
                      "shards": 1, "context": []}}
          JSON

      - id: ask
        uses: ./.github/actions/draft
        with:
          command: ask
          config: ${{ runner.temp }}/ask.json
          system: blueprint-system.txt
          user: blueprint-card.txt
          out: blueprint-reply.txt

      - id: admit
        uses: ./.github/actions/blueprint
        with:
          command: admit
          reply: blueprint-reply.txt

      - name: File the plan and the goal
        shell: bash
        env:
          NAME: ${{ inputs.name }}
          TYPE: ${{ inputs.type }}
        run: |
          set -euo pipefail
          mkdir -p loop
          # The goal is what was actually written, kept verbatim. The brief is a
          # reading of it and the blueprint is a reading of that, and both
          # readings can be wrong -- so whatever they were read from stays
          # where a later night, and a person, can compare.
          {
            printf '%s (%s)\n\n' "$NAME" "$TYPE"
            if [ -s brief-input.txt ]; then
              cat brief-input.txt
            else
              printf 'No description was given. The brief in loop/brief.md was\n'
              printf 'written from the name and the kind of thing alone.\n'
            fi
          } > loop/goal.txt
          git add loop
          git commit -q -m "genesis: a brief and a plan for $NAME"
          git push origin HEAD:refs/heads/loop/main

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: genesis-plan
          path: |
            loop/brief.md
            loop/blueprint.txt
            brief-input.txt
            brief-reply.txt
            blueprint-reply.txt
          if-no-files-found: error
          retention-days: 30

  # --- build: three attempts at a tree that actually runs ------------------
  #
  # Separate jobs rather than one with a retry loop: a composite action cannot
  # be called in a loop from YAML, and each attempt wants a clean checkout
  # anyway. Each is skipped if an earlier one worked, and each is handed the
  # reason the last one did not.
  build-1:
    needs: plan
    uses: ./.github/workflows/genesis-build.yml
    with:
      attempt: "1"
      name: ${{ inputs.name }}
      autonomous: ${{ inputs.autonomous }}
      because: ""
    secrets: inherit

  build-2:
    needs: [plan, build-1]
    if: ${{ !cancelled() && needs.build-1.outputs.ok != 'yes' }}
    uses: ./.github/workflows/genesis-build.yml
    with:
      attempt: "2"
      name: ${{ inputs.name }}
      autonomous: ${{ inputs.autonomous }}
      because: ${{ needs.build-1.outputs.why }}
    secrets: inherit

  build-3:
    needs: [plan, build-1, build-2]
    if: ${{ !cancelled() && needs.build-1.outputs.ok != 'yes' && needs.build-2.outputs.ok != 'yes' }}
    uses: ./.github/workflows/genesis-build.yml
    with:
      attempt: "3"
      name: ${{ inputs.name }}
      autonomous: ${{ inputs.autonomous }}
      because: ${{ needs.build-2.outputs.why }}
    secrets: inherit

  # --- born: say what happened, and what happens next ----------------------
  born:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [plan, build-1, build-2, build-3]
    if: always()
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: loop/main
          fetch-depth: 0

      - id: state
        shell: bash
        env:
          OK1: ${{ needs.build-1.outputs.ok }}
          OK2: ${{ needs.build-2.outputs.ok }}
          OK3: ${{ needs.build-3.outputs.ok }}
          WHY: ${{ needs.build-3.outputs.why || needs.build-2.outputs.why || needs.build-1.outputs.why }}
        run: |
          set -euo pipefail
          if [ "$OK1" = "yes" ] || [ "$OK2" = "yes" ] || [ "$OK3" = "yes" ]; then
            echo "born=yes" >> "$GITHUB_OUTPUT"
          else
            echo "born=no" >> "$GITHUB_OUTPUT"
            echo "::error::three attempts and none of them produced a tree that runs."
            echo "::error::last reason: $WHY"
            echo "::error::The plan is on loop/main; nothing was built. Read it, adjust"
            echo "::error::the description, and run genesis again on a fresh branch."
          fi

      - if: steps.state.outputs.born == 'yes'
        uses: ./.github/actions/config
        with: { command: load }

      - if: steps.state.outputs.born == 'yes'
        uses: ./.github/actions/blueprint
        with:
          command: phase
          config: ${{ env.GOEDEL_CONFIG }}

      - name: Offer it to the default branch
        if: steps.state.outputs.born == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT: ${{ needs.plan.outputs.branch }}
          NAME: ${{ inputs.name }}
          STACK: ${{ needs.plan.outputs.stack }}
          AUTONOMOUS: ${{ inputs.autonomous }}
          SOURCE: ${{ needs.plan.outputs.source }}
        shell: bash
        run: |
          set -euo pipefail
          body=$(printf '**%s** is born.\n\n## What it decided to build\n\n%s\n\n<details><summary>The plan</summary>\n\n```\n%s\n```\n\n</details>\n\nStack: %s\n\nEach line under **Done Means** became a phase criterion, and each criterion becomes a milestone whose witness is that sentence. `loop-night` works the first open one every night.\n\n**If the brief above is not what you meant, say so now** -- it was written from %s, and everything after it is built on it.\n\nAutonomous promotion: **%s**. %s\n\nWhat to do now: merge this, apply the protections in `.github/RULESETS.md`, and run `proof` once by hand.\n' \
            "$NAME" "$(cat loop/brief.md)" "$(cat loop/blueprint.txt)" "$STACK" \
            "$SOURCE" "$AUTONOMOUS" \
            "$([ "$AUTONOMOUS" = "true" ] \
               && echo 'Nights that get past the judge push to this branch themselves; the audit pull request becomes a record rather than a gate.' \
               || echo 'Nights stop at a pull request you merge.')")
          n=$(gh pr list --head loop/main --base "$DEFAULT" --state open --json number --jq length)
          if [ "$n" = "0" ]; then
            gh pr create --head loop/main --base "$DEFAULT" \
              --title "genesis: $NAME" --body "$body"
          else
            num=$(gh pr list --head loop/main --base "$DEFAULT" --state open \
                    --json number --jq '.[0].number')
            gh pr edit "$num" --body "$body"
          fi

      - if: steps.state.outputs.born != 'yes'
        shell: bash
        run: exit 1
