name: ci

# The gate. Two jobs, because the cheap truths should not wait on the project's
# test suite: `machine` answers in about a minute and is about this template;
# `project` is about whatever repository the template was adopted into.
#
# It also runs on `loop/**`, deliberately. Every adoption the night commits to
# `loop/main` gets re-verified by a job the loop does not control, so a bad
# adopt turns the branch red even if the night's own judge was somehow wrong.
# That independence is the point of having both.
#
# CONSUMER: humans merging to main (branch protection requires both jobs), and
# the loop's audit trail on loop/**.

on:
  push:
    branches: ["main", "loop/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

# A superseded push is not a paid-for question: cancel it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --- the machine ---------------------------------------------------------
  #
  # **First, because a workflow GitHub cannot load is a gate that is not
  # running at all.** `template-check` reads every file here structurally and
  # refuses what a permissive YAML loader would quietly resolve, then every
  # action proves itself against its own claims. A step deleted from this list
  # is a check silently stopped, so `template-check` also refuses an action
  # that has no selftest at all.
  machine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Every workflow is one GitHub can actually load
        uses: ./.github/actions/template-check
        with:
          command: check

      # Named one per line rather than looped, because a composite action
      # cannot be called in a loop from YAML -- and because a claim suite that
      # quietly stopped being run is the failure this whole file exists to
      # prevent.
      - uses: ./.github/actions/cert
        with: { command: selftest }
      - uses: ./.github/actions/ledger
        with: { command: selftest }
      - uses: ./.github/actions/config
        with: { command: selftest }
      - uses: ./.github/actions/envelope
        with: { command: selftest }
      - uses: ./.github/actions/rails
        with: { command: selftest }
      - uses: ./.github/actions/archive
        with: { command: selftest }
      - uses: ./.github/actions/ladder
        with: { command: selftest }
      - uses: ./.github/actions/draft
        with: { command: selftest }
      - uses: ./.github/actions/harness
        with: { command: selftest }
      - uses: ./.github/actions/budget
        with: { command: selftest }
      - uses: ./.github/actions/adopt-decide
        with: { command: selftest }
      - uses: ./.github/actions/boundary-judge
        with: { command: selftest }
      - uses: ./.github/actions/template-check
        with: { command: selftest }

      - name: The config this project adapts itself with
        uses: ./.github/actions/config
        with:
          command: load

      # On main this reads an empty ledger and answers clean, which is correct.
      # On loop/** it is the invariant check the night's own jobs cannot be
      # trusted to be the only ones running.
      - name: The ledger, if this ref carries one
        uses: ./.github/actions/ledger
        with:
          command: fsck
          epoch-len: ${{ env.GOEDEL_EPOCH_LEN }}

  # --- the project ---------------------------------------------------------
  #
  # Whatever `goedel.toml` says to build and run. This is the job whose counts
  # the night's monotonic invariants are measured against, so it is also the
  # job that tells an operator the template was wired up correctly: if `claims`
  # comes back zero here, the loop has no J2 and every kind will be refused for
  # a reason that has nothing to do with the code.
  project:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - id: cfg
        uses: ./.github/actions/config
        with:
          command: load

      - id: harness
        uses: ./.github/actions/harness
        with:
          command: run
          config: ${{ steps.cfg.outputs.json }}
          arm: main
          repeats: "1"

      - name: A project the machine cannot count is a project it cannot judge
        shell: bash
        env:
          BUILT: ${{ steps.harness.outputs.built }}
          TESTED: ${{ steps.harness.outputs.tested }}
          CLAIMS: ${{ steps.harness.outputs.claims }}
          WHY: ${{ steps.harness.outputs.why }}
        run: |
          set -euo pipefail
          if [ "$BUILT" != "yes" ] || [ "$TESTED" != "yes" ]; then
            echo "::error::$WHY"
            exit 1
          fi
          if [ "$CLAIMS" = "0" ]; then
            echo "::error::the tests passed and nothing counted a single claim."
            echo "::error::harness.claims_re in goedel.toml does not match what your test"
            echo "::error::runner prints. Every kind's J2 is a count that may not fall, so"
            echo "::error::a count that is always zero is a gate that cannot fail."
            exit 1
          fi
          echo "  $CLAIMS claim(s) counted; the loop has something to hold onto"

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-harness
          path: |
            rails-main.txt
            harness-main.log
          if-no-files-found: ignore
          retention-days: 14
